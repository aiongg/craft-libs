name: Check

on:
  push:
    branches: ['ci/k*']

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
  CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts

jobs:
  check:
    name: compile check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: aiongg/craft-fonts
          ref: b4b8f4d15f3c7d4e4ed9e0558411439b8c9aabfd
          path: craft-fonts
      - name: Install linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold clang
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: check
      - name: Cargo check
        run: |
          set -o pipefail
          cargo check -p craft-behavior -p craft-i18n -p craft-keymap -p craft-ui -p craft-ui-macros -p craft-ui-gallery -p craft-ui-bench --all-targets --features craft-ui/testing --locked --message-format short 2>&1 | tee check.log
      - name: Structure lint
        run: |
          set -o pipefail
          cargo run -q -p craft-design-lint -- structure --config design-lint.toml 2>&1 | tee -a check.log
      - name: "Domain crates: cargo check"
        if: ${{ !cancelled() && hashFiles('migration/check-crates.txt') != '' }}
        run: |
          set -o pipefail
          mapfile -t lines < <(grep -vE '^[[:space:]]*(#|$)' migration/check-crates.txt || true)
          if [ "${#lines[@]}" -eq 0 ]; then
            echo "no domain crates listed" | tee -a check.log
            exit 0
          fi
          meta="$RUNNER_TEMP/metadata.json"
          cargo metadata --no-deps --format-version 1 --locked > "$meta"
          pkgs=()
          feats=()
          for line in "${lines[@]}"; do
            read -r pkg fl <<< "$line"
            if ! jq -e --arg p "$pkg" '.packages[] | select(.name == $p)' "$meta" > /dev/null; then
              echo "error: check-crates.txt: no workspace package $pkg" | tee -a check.log
              exit 1
            fi
            [ "$pkg" = craft-ui ] || pkgs+=(-p "$pkg")
            IFS=, read -ra fs <<< "$fl"
            for f in "${fs[@]}"; do
              [ -n "$f" ] && [ "$f" != screen-testing ] && feats+=("$pkg/$f")
            done
            if jq -e --arg p "$pkg" '.packages[] | select(.name == $p) | .features | has("screen-testing")' "$meta" > /dev/null; then
              feats+=("$pkg/screen-testing")
            fi
          done
          feats+=(craft-ui/testing)
          list=$(IFS=,; echo "${feats[*]}")
          echo "cargo check -p craft-ui ${pkgs[*]} --features $list" | tee -a check.log
          cargo check -p craft-ui "${pkgs[@]}" --all-targets --features "$list" --locked --message-format short 2>&1 | tee -a check.log
      - name: "Domain crates: structure lint"
        if: ${{ !cancelled() && hashFiles('migration/check-crates.txt') != '' }}
        run: |
          set -o pipefail
          mapfile -t lines < <(grep -vE '^[[:space:]]*(#|$)' migration/check-crates.txt || true)
          if [ "${#lines[@]}" -eq 0 ]; then
            echo "no domain crates listed" | tee -a check.log
            exit 0
          fi
          adds=""
          for line in "${lines[@]}"; do
            read -r pkg _ <<< "$line"
            if [ -d "design/layers/$pkg" ]; then
              echo "layer map of $pkg is merged" | tee -a check.log
              continue
            fi
            pending="migration/domain-lint/$pkg"
            if [ ! -f "$pending/crate.toml" ]; then
              echo "error: no layer map for $pkg" | tee -a check.log
              exit 1
            fi
            mkdir -p "design/layers/$pkg"
            cp "$pending"/*.toml "design/layers/$pkg/"
            echo "layer map of $pkg copied from $pending" | tee -a check.log
            if [ -f "$pending/paths.txt" ]; then
              while IFS= read -r path; do
                [ -n "$path" ] || continue
                if [ -e "$path" ]; then
                  adds="$adds\"$path\", "
                else
                  echo "lint path $path does not exist yet" | tee -a check.log
                fi
              done < "$pending/paths.txt"
            fi
          done
          if [ "$(grep -cE '^paths = \[' design-lint.toml)" -ne 1 ]; then
            echo "error: design-lint.toml: expected one single-line paths entry" | tee -a check.log
            exit 1
          fi
          sed -E "s|^paths = \[|paths = [$adds|" design-lint.toml > design-lint.domain.toml
          { echo "generated design-lint.domain.toml:"; grep -E '^paths = ' design-lint.domain.toml; } | tee -a check.log
          cargo run -q -p craft-design-lint --locked -- structure --config design-lint.domain.toml 2>&1 | tee -a check.log
      - name: Summary
        if: always()
        run: bash .github/ci/check-summary.sh check.log >> "$GITHUB_STEP_SUMMARY"
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-log
          path: check.log
          retention-days: 3
          if-no-files-found: ignore
