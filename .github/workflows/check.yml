name: Check

on:
  push:
    branches: [ci/k1, ci/k2, ci/k3, ci/k4, ci/k5, ci/k6, ci/k7, ci/k8]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
  CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts

jobs:
  check:
    name: compile check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: aiongg/craft-fonts
          ref: b4b8f4d15f3c7d4e4ed9e0558411439b8c9aabfd
          path: craft-fonts
      - name: Install linker
        run: |
          sudo apt-get update
          sudo apt-get install -y mold clang
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: check
      - name: Cargo check
        run: |
          set -o pipefail
          cargo check -p craft-behavior -p craft-i18n -p craft-keymap -p craft-ui -p craft-ui-macros -p craft-ui-gallery -p craft-ui-bench --all-targets --features craft-ui/testing --locked --message-format short 2>&1 | tee check.log
      - name: Structure lint
        run: |
          set -o pipefail
          cargo run -q -p craft-design-lint -- structure --config design-lint.toml 2>&1 | tee -a check.log
      - name: Summary
        if: always()
        run: bash .github/ci/check-summary.sh check.log >> "$GITHUB_STEP_SUMMARY"
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-log
          path: check.log
          retention-days: 3
          if-no-files-found: ignore
