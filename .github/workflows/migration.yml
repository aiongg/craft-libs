name: Migration

on:
  push:
    branches: [ci/a, ci/b, ci/c]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: migration-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
  CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts

jobs:
  ui-tests:
    name: craft-ui tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: aiongg/craft-fonts
          ref: b4b8f4d15f3c7d4e4ed9e0558411439b8c9aabfd
          path: craft-fonts
      - name: Free disk and install linker
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y mold clang
          df -h / | tail -1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ui-tests
      - name: Test craft-ui
        run: cargo test -p craft-ui --features testing --locked --no-fail-fast 2>&1 | tee test.log
      - name: Summary
        if: always()
        run: bash .github/ci/summary.sh test.log "craft-ui tests" >> "$GITHUB_STEP_SUMMARY"

  other-tests:
    name: other new crates
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: aiongg/craft-fonts
          ref: b4b8f4d15f3c7d4e4ed9e0558411439b8c9aabfd
          path: craft-fonts
      - name: Free disk and install linker
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y mold clang
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: other-tests
      - name: Test
        run: |
          {
            cargo test --locked --no-fail-fast -p craft-behavior -p craft-host -p craft-window -p craft-ui-macros -p craft-design-lint
            cargo test --locked --no-fail-fast -p craft-keymap --all-features
          } 2>&1 | tee test.log
          exit "${PIPESTATUS[0]}"
      - name: Summary
        if: always()
        run: bash .github/ci/summary.sh test.log "other new crates" >> "$GITHUB_STEP_SUMMARY"

  gallery-tests:
    name: gallery tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: aiongg/craft-fonts
          ref: b4b8f4d15f3c7d4e4ed9e0558411439b8c9aabfd
          path: craft-fonts
      - name: Free disk and install linker
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y mold clang
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: gallery-tests
      - name: Test craft-ui-gallery
        run: cargo test -p craft-ui-gallery --locked --no-fail-fast 2>&1 | tee test.log
      - name: Summary
        if: always()
        run: bash .github/ci/summary.sh test.log "gallery tests" >> "$GITHUB_STEP_SUMMARY"

  static:
    name: static checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: aiongg/craft-fonts
          ref: b4b8f4d15f3c7d4e4ed9e0558411439b8c9aabfd
          path: craft-fonts
      - name: Free disk and install linker
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y mold clang
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: static
      - name: Structure lint
        run: cargo run -q -p craft-design-lint --locked -- structure --config design-lint.toml
      - name: Clippy (warnings reported, not fatal)
        run: |
          cargo clippy --locked --tests --features testing \
            -p craft-ui -p craft-ui-macros -p craft-behavior -p craft-host -p craft-window \
            -p craft-design-lint -p craft-keymap -p craft-ui-gallery -p craft-ui-bench > clippy.log 2>&1 || true
          {
            echo "### clippy"
            echo "$(grep -c '^warning' clippy.log) warning lines, $(grep -c '^error' clippy.log) error lines"
            grep -E '^(warning|error)' clippy.log | sort | uniq -c | sort -rn | head -12
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Check workspace
        run: cargo check --workspace --all-targets --locked

  windows-check:
    name: windows compile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: aiongg/craft-fonts
          ref: b4b8f4d15f3c7d4e4ed9e0558411439b8c9aabfd
          path: craft-fonts
      - name: Install the Windows cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows-check
      # The platform code under cfg(windows) compiles nowhere else; a check is enough (no Windows runner).
      - name: Check craft-window and craft-ui for Windows
        run: cargo check --locked --target x86_64-pc-windows-gnu -p craft-window -p craft-ui

  domain-tests:
    name: domain crates (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Shards run in parallel; `rest` takes every listed crate no other shard names.
    # craft-imaging is the longest crate. Its harness (libtest-mimic) takes one substring filter
    # and any number of --skip: imaging-a runs the tests whose name contains `_the_`, imaging-b
    # skips them, so together they run every test exactly once (about half each).
    strategy:
      fail-fast: false
      matrix:
        shard: [table, color, draw, fonts, imaging-a, imaging-b, rest]
    steps:
      - uses: actions/checkout@v7
      - name: List domain crates
        id: list
        run: |
          if [ -f migration/check-crates.txt ] && grep -qvE '^[[:space:]]*(#|$)' migration/check-crates.txt; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no domain crates listed"
          fi
      - uses: actions/checkout@v7
        if: steps.list.outputs.run == 'true'
        with:
          repository: aiongg/craft-fonts
          ref: b4b8f4d15f3c7d4e4ed9e0558411439b8c9aabfd
          path: craft-fonts
      - name: Free disk and install linker
        if: steps.list.outputs.run == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y mold clang
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.list.outputs.run == 'true'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.list.outputs.run == 'true'
        with:
          key: domain-tests
          save-if: ${{ matrix.shard == 'table' }}
      - name: Test domain crates
        if: steps.list.outputs.run == 'true'
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          declare -A groups=(
            [table]="craft-table craft-review"
            [color]="craft-color craft-automation"
            [draw]="craft-draw craft-browse craft-text craft-timeline"
            [fonts]="craft-font-manager craft-menu craft-dialogs"
            [imaging-a]="craft-imaging"
            [imaging-b]="craft-imaging"
          )
          assigned=" ${groups[*]} "
          extra=()
          case "$SHARD" in
            imaging-a) extra=(-- _the_) ;;
            imaging-b) extra=(-- --skip _the_) ;;
          esac
          mapfile -t all < <(grep -vE '^[[:space:]]*(#|$)' migration/check-crates.txt)
          lines=()
          for line in "${all[@]}"; do
            read -r pkg _ <<< "$line"
            if [ "$SHARD" = rest ]; then
              if [[ "$assigned" != *" $pkg "* ]]; then lines+=("$line"); fi
            elif [[ " ${groups[$SHARD]} " == *" $pkg "* ]]; then
              lines+=("$line")
            fi
          done
          : > test.log
          echo "shard $SHARD: ${#lines[@]} crates" | tee -a test.log
          meta="$RUNNER_TEMP/metadata.json"
          cargo metadata --no-deps --format-version 1 --locked > "$meta"
          failed=0
          for line in "${lines[@]}"; do
            read -r pkg fl <<< "$line"
            if [ "$pkg" = craft-ui ]; then
              echo "craft-ui: tested by the craft-ui tests job" | tee -a test.log
              continue
            fi
            if ! jq -e --arg p "$pkg" '.packages[] | select(.name == $p) | .targets[] | select(.name == "it" and (.kind | index("test")))' "$meta" > /dev/null; then
              echo "no tests/it: $pkg" | tee -a test.log
              continue
            fi
            feats=()
            IFS=, read -ra fs <<< "$fl"
            for f in "${fs[@]}"; do
              [ -n "$f" ] && [ "$f" != screen-testing ] && feats+=("$pkg/$f")
            done
            if jq -e --arg p "$pkg" '.packages[] | select(.name == $p) | .features | has("screen-testing")' "$meta" > /dev/null; then
              feats+=("$pkg/screen-testing")
            fi
            list=$(IFS=,; echo "${feats[*]}")
            if ! cargo test --locked --no-fail-fast -p "$pkg" --features "$list" --test it "${extra[@]}" 2>&1 | tee -a test.log; then failed=1; fi
          done
          exit "$failed"
      - name: Summary
        if: always() && steps.list.outputs.run == 'true'
        run: bash .github/ci/summary.sh test.log "domain crates (${{ matrix.shard }})" >> "$GITHUB_STEP_SUMMARY"
