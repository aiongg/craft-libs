[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor/krilla", "vendor/hayro", "vendor/hayro-interpret", "vendor/hayro-syntax", "vendor/hayro-jbig2", "vendor/hayro-cmap", "vendor/hayro-postscript"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/storytold/craft-libs"

[workspace.dependencies]
# internal: add each crate here as `craft-<name> = { path = "crates/<name>" }`
craft-platform = { path = "crates/platform" }
craft-win32 = { path = "crates/win32" }
craft-ai-core = { path = "crates/ai-core" }
craft-pdf = { path = "crates/pdf", version = "=0.1.0" }
craft-plate-test = { path = "crates/plate-test" }
krilla = { version = "=0.8.2", default-features = false, features = ["raster-images"] }
hayro = { version = "=0.7.1", default-features = false }
hayro-interpret = { version = "=0.7.0", default-features = false, features = ["embed-fonts", "embed-cmaps"] }
hayro-syntax = { version = "=0.7.2", default-features = false, features = ["std"] }
bytemuck = "1"
kurbo = "0.13"
thiserror = "2"
craft-behavior = { path = "crates/behavior" }
craft-atomic = { path = "crates/atomic" }
craft-automation = { path = "crates/automation" }
craft-browse = { path = "crates/browse" }
craft = { path = "crates/craft" }
craft-cms = { path = "crates/cms" }
craft-color = { path = "crates/color" }
craft-crw = { path = "crates/crw" }
craft-design-lint = { path = "crates/design-lint" }
craft-dialogs = { path = "crates/dialogs" }
craft-doc = { path = "crates/doc" }
craft-docpath = { path = "crates/docpath" }
craft-draw = { path = "crates/draw" }
craft-ecproj-format = { path = "crates/ecproj-format" }
craft-font-catalog = { path = "crates/font-catalog" }
craft-font-manager = { path = "crates/font-manager" }
craft-font-store = { path = "crates/font-store" }
craft-fonts-build = { path = "crates/fonts-build" }
craft-host = { path = "crates/host" }
craft-i18n = { path = "crates/i18n" }
craft-imaging = { path = "crates/imaging" }
craft-jpeg = { path = "crates/jpeg" }
craft-keymap = { path = "crates/keymap" }
craft-layers = { path = "crates/layers" }
craft-audio = { path = "crates/audio" }
# No default features, so craft-audio's `encode` builds craft-media without `isobmff`.
craft-media = { path = "crates/media", default-features = false }
craft-media-testkit = { path = "crates/media-testkit" }
craft-menu = { path = "crates/menu" }
craft-pcraft-format = { path = "crates/pcraft-format" }
craft-prepress = { path = "crates/prepress" }
craft-pages = { path = "crates/pages" }
craft-print = { path = "crates/print" }
craft-proof = { path = "crates/proof" }
craft-quit = { path = "crates/quit" }
craft-review = { path = "crates/review" }
craft-settings = { path = "crates/settings" }
craft-table = { path = "crates/table" }
craft-text = { path = "crates/text" }
craft-theme = { path = "crates/theme" }
craft-theme-store = { path = "crates/theme-store" }
craft-timeline = { path = "crates/timeline" }
craft-ui = { path = "crates/ui" }
craft-ui-macros = { path = "crates/ui-macros" }
craft-update = { path = "crates/update" }
craft-vectorcraft-format = { path = "crates/vectorcraft-format" }
craft-web-api = { path = "crates/web-api" }
craft-window = { path = "crates/window" }
# egui's colour types alone, for crates that convert to and from them without egui.
ecolor = { version = "0.37", default-features = false }
craft-web-host = { path = "crates/web-host" }
egui = { version = "0.37", default-features = false }
bitflags = "2"
rayon = "1"
smallvec = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"
# All date/time conversion goes through chrono (no hand-rolled calendar code beyond the 400-year range extension; AGENTS.md).
chrono = { version = "0.4.45", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
# Every public item has a doc comment; a self-evident field or variant carries
# `#[allow(missing_docs)]` instead.
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(craft_pdf_unicode_fixtures)"] }

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

[patch.crates-io]
krilla = { path = "vendor/krilla" }

hayro = { path = "vendor/hayro" }
hayro-interpret = { path = "vendor/hayro-interpret" }
hayro-syntax = { path = "vendor/hayro-syntax" }
hayro-jbig2 = { path = "vendor/hayro-jbig2" }
hayro-cmap = { path = "vendor/hayro-cmap" }
hayro-postscript = { path = "vendor/hayro-postscript" }
ecolor = { git = "https://github.com/aiongg/egui.git", rev = "4b93a86c52348eb53e883c9b6b9f59c573608e07" }
emath = { git = "https://github.com/aiongg/egui.git", rev = "4b93a86c52348eb53e883c9b6b9f59c573608e07" }
epaint = { git = "https://github.com/aiongg/egui.git", rev = "4b93a86c52348eb53e883c9b6b9f59c573608e07" }
epaint_default_fonts = { git = "https://github.com/aiongg/egui.git", rev = "4b93a86c52348eb53e883c9b6b9f59c573608e07" }
egui = { git = "https://github.com/aiongg/egui.git", rev = "4b93a86c52348eb53e883c9b6b9f59c573608e07" }
egui-winit = { git = "https://github.com/aiongg/egui.git", rev = "4b93a86c52348eb53e883c9b6b9f59c573608e07" }
egui-wgpu = { git = "https://github.com/aiongg/egui.git", rev = "4b93a86c52348eb53e883c9b6b9f59c573608e07" }
egui_glow = { git = "https://github.com/aiongg/egui.git", rev = "4b93a86c52348eb53e883c9b6b9f59c573608e07" }
egui_extras = { git = "https://github.com/aiongg/egui.git", rev = "4b93a86c52348eb53e883c9b6b9f59c573608e07" }
egui_kittest = { git = "https://github.com/aiongg/egui.git", rev = "4b93a86c52348eb53e883c9b6b9f59c573608e07" }
egui_system_font_provider = { git = "https://github.com/aiongg/egui.git", rev = "4b93a86c52348eb53e883c9b6b9f59c573608e07" }
eframe = { git = "https://github.com/aiongg/egui.git", rev = "4b93a86c52348eb53e883c9b6b9f59c573608e07" }
egui_demo_lib = { git = "https://github.com/aiongg/egui.git", rev = "4b93a86c52348eb53e883c9b6b9f59c573608e07" }
egui_inspection = { git = "https://github.com/aiongg/egui.git", rev = "4b93a86c52348eb53e883c9b6b9f59c573608e07" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }

# symphonia's FLAC decoder restores LPC samples as `residual + (prediction as i32)`. In a valid
# 32-bit stream the prediction can leave the i32 range while the sum does not, so a debug build
# panics where a release build wraps to the right sample. Apps that decode 32-bit FLAC through
# craft-audio's `decode` need the same override in their own workspace.
[profile.dev.package.symphonia-bundle-flac]
overflow-checks = false

# Dependencies (egui, rendering, text shaping, syn) run optimised in dev and test builds, so
# screen tests, design-lint and the debug gallery run at a usable speed. They build once per
# target dir; the workspace's own crates stay unoptimised and incremental.
[profile.dev.package."*"]
opt-level = 2

# The workspace crates whose code runs in every screen-test frame (the framework runtime, the theme's colour maths
# and the behaviour cores), and craft-proof, whose tests parse and check whole dictionaries, build at opt-level 1:
# unoptimised, they made the test binaries several times slower, and opt-level 1 keeps their incremental rebuilds
# short.
[profile.dev.package.craft-ui]
opt-level = 1
[profile.dev.package.craft-theme]
opt-level = 1
[profile.dev.package.craft-behavior]
opt-level = 1
[profile.dev.package.craft-proof]
opt-level = 1
