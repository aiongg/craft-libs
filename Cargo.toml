[workspace]
resolver = "3"
members = ["crates/*", "gpu/*"]
exclude = ["vendor/krilla", "vendor/hayro", "vendor/hayro-interpret", "vendor/hayro-syntax", "vendor/hayro-jbig2", "vendor/hayro-cmap", "vendor/hayro-postscript", "vendor/linesweeper"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/storytold/craft-libs"

[workspace.dependencies]
# internal: add each crate here as `craft-<name> = { path = "crates/<name>" }`
craft-platform = { path = "crates/platform" }
craft-win32 = { path = "crates/win32" }
craft-ai-core = { path = "crates/ai-core" }
craft-pdf = { path = "crates/pdf", version = "=0.1.0" }
craft-plate-test = { path = "crates/plate-test" }
krilla = { version = "=0.8.2", default-features = false, features = ["raster-images"] }
hayro = { version = "=0.7.1", default-features = false }
hayro-interpret = { version = "=0.7.0", default-features = false, features = ["embed-fonts", "embed-cmaps"] }
hayro-syntax = { version = "=0.7.2", default-features = false, features = ["std"] }
bytemuck = "1"
kurbo = "0.13"
thiserror = "2"
craft-behavior = { path = "crates/behavior" }
craft-atomic = { path = "crates/atomic" }
craft-cfb = { path = "crates/cfb" }
craft-automation = { path = "crates/automation" }
craft-browse = { path = "crates/browse" }
craft = { path = "crates/craft" }
craft-cms = { path = "crates/cms" }
craft-color = { path = "crates/color" }
craft-crw = { path = "crates/crw" }
craft-design-lint = { path = "crates/design-lint" }
craft-dialogs = { path = "crates/dialogs" }
craft-dxf = { path = "crates/dxf" }
craft-doc = { path = "crates/doc" }
craft-docpath = { path = "crates/docpath" }
craft-draw = { path = "crates/draw" }
craft-ecproj-format = { path = "crates/ecproj-format" }
craft-font-catalog = { path = "crates/font-catalog" }
craft-font-manager = { path = "crates/font-manager" }
craft-font-store = { path = "crates/font-store" }
craft-gcode = { path = "crates/gcode" }
craft-mesh = { path = "crates/mesh" }
craft-wgsl = { path = "gpu/wgsl" }
craft-gpu-testkit = { path = "gpu/testkit" }
craft-heif = { path = "crates/heif" }
craft-fonts-build = { path = "crates/fonts-build" }
craft-host = { path = "crates/host" }
craft-i18n = { path = "crates/i18n" }
craft-imaging = { path = "crates/imaging" }
craft-jpeg = { path = "crates/jpeg" }
craft-keymap = { path = "crates/keymap" }
craft-layers = { path = "crates/layers" }
craft-audio = { path = "crates/audio" }
# No default features, so craft-audio's `encode` builds craft-media without `isobmff`.
craft-media = { path = "crates/media", default-features = false }
craft-media-testkit = { path = "crates/media-testkit" }
craft-mime = { path = "crates/mime" }
craft-menu = { path = "crates/menu" }
craft-metafile = { path = "crates/metafile" }
craft-pcraft-format = { path = "crates/pcraft-format" }
craft-prepress = { path = "crates/prepress" }
craft-pages = { path = "crates/pages" }
craft-print = { path = "crates/print" }
craft-proof = { path = "crates/proof" }
craft-quit = { path = "crates/quit" }
craft-review = { path = "crates/review" }
craft-settings = { path = "crates/settings" }
craft-silhouette-studio = { path = "crates/silhouette-studio" }
craft-svg-paths = { path = "crates/svg-paths" }
craft-table = { path = "crates/table" }
craft-text = { path = "crates/text" }
craft-theme = { path = "crates/theme" }
craft-theme-store = { path = "crates/theme-store" }
craft-tiff = { path = "crates/tiff" }
craft-timeline = { path = "crates/timeline" }
craft-ui = { path = "crates/ui" }
craft-ui-canvas = { path = "crates/ui-canvas" }
craft-ui-contract = { path = "crates/ui-contract" }
craft-ui-panels = { path = "crates/ui-panels" }
craft-ui-patterns = { path = "crates/ui-patterns" }
craft-ui-shell = { path = "crates/ui-shell" }
craft-ui-test-kit = { path = "crates/ui-test-kit" }
craft-ui-widgets = { path = "crates/ui-widgets" }
craft-ui-macros = { path = "crates/ui-macros" }
craft-update = { path = "crates/update" }
craft-vectorcraft-format = { path = "crates/vectorcraft-format" }
craft-xml = { path = "crates/xml" }
craft-video = { path = "crates/video" }
craft-web-api = { path = "crates/web-api" }
craft-window = { path = "crates/window" }
# egui's colour types alone, for crates that convert to and from them without egui.
ecolor = { version = "0.37", default-features = false }
craft-web-host = { path = "crates/web-host" }
egui = { version = "0.37", default-features = false }
bitflags = "2"
md5 = { package = "md-5", version = "0.10", default-features = false }
rayon = "1"
smallvec = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"
# GPU engine crates (gpu/): the version egui-wgpu builds, so there is one wgpu.
wgpu = "30"
naga = { version = "30", features = ["wgsl-in"] }
pollster = "0.4"
# Character sets of the WHATWG Encoding Standard (craft-mime). (Apache-2.0 OR MIT) AND BSD-3-Clause.
encoding_rs = "0.8"
# All date/time conversion goes through chrono (no hand-rolled calendar code beyond the 400-year range extension; AGENTS.md).
chrono = { version = "0.4.45", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
# Every public item has a doc comment; a self-evident field or variant carries
# `#[allow(missing_docs)]` instead.
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(craft_pdf_unicode_fixtures)"] }

[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

[patch.crates-io]
krilla = { path = "vendor/krilla" }

hayro = { path = "vendor/hayro" }
hayro-interpret = { path = "vendor/hayro-interpret" }
hayro-syntax = { path = "vendor/hayro-syntax" }
hayro-jbig2 = { path = "vendor/hayro-jbig2" }
hayro-cmap = { path = "vendor/hayro-cmap" }
hayro-postscript = { path = "vendor/hayro-postscript" }
linesweeper = { path = "vendor/linesweeper" }
ecolor = { git = "https://github.com/aiongg/egui.git", rev = "3f56db2d932d5ce35ff420f8679896b646be9e77" }
emath = { git = "https://github.com/aiongg/egui.git", rev = "3f56db2d932d5ce35ff420f8679896b646be9e77" }
epaint = { git = "https://github.com/aiongg/egui.git", rev = "3f56db2d932d5ce35ff420f8679896b646be9e77" }
epaint_default_fonts = { git = "https://github.com/aiongg/egui.git", rev = "3f56db2d932d5ce35ff420f8679896b646be9e77" }
egui = { git = "https://github.com/aiongg/egui.git", rev = "3f56db2d932d5ce35ff420f8679896b646be9e77" }
egui-winit = { git = "https://github.com/aiongg/egui.git", rev = "3f56db2d932d5ce35ff420f8679896b646be9e77" }
egui-wgpu = { git = "https://github.com/aiongg/egui.git", rev = "3f56db2d932d5ce35ff420f8679896b646be9e77" }
egui_glow = { git = "https://github.com/aiongg/egui.git", rev = "3f56db2d932d5ce35ff420f8679896b646be9e77" }
egui_extras = { git = "https://github.com/aiongg/egui.git", rev = "3f56db2d932d5ce35ff420f8679896b646be9e77" }
egui_kittest = { git = "https://github.com/aiongg/egui.git", rev = "3f56db2d932d5ce35ff420f8679896b646be9e77" }
egui_system_font_provider = { git = "https://github.com/aiongg/egui.git", rev = "3f56db2d932d5ce35ff420f8679896b646be9e77" }
eframe = { git = "https://github.com/aiongg/egui.git", rev = "3f56db2d932d5ce35ff420f8679896b646be9e77" }
egui_demo_lib = { git = "https://github.com/aiongg/egui.git", rev = "3f56db2d932d5ce35ff420f8679896b646be9e77" }
egui_inspection = { git = "https://github.com/aiongg/egui.git", rev = "3f56db2d932d5ce35ff420f8679896b646be9e77" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }

# symphonia's FLAC decoder restores LPC samples as `residual + (prediction as i32)`. In a valid
# 32-bit stream the prediction can leave the i32 range while the sum does not, so a debug build
# panics where a release build wraps to the right sample. Apps that decode 32-bit FLAC through
# craft-audio's `decode` need the same override in their own workspace.
[profile.dev.package.symphonia-bundle-flac]
overflow-checks = false

# Codec hot loops: the oracle and conformance tests of a debug build take minutes below opt-level 3.
[profile.dev.package.craft-video]
opt-level = 3

# Dev and test builds never run LTO: with `lto = false` (cargo's default) rustc runs thin-local LTO across every
# optimised crate's 256 codegen units on each rebuild, which multiplied the incremental rebuild of the framework
# crates. Off, a one-line edit re-optimises only the changed units.
[profile.dev]
lto = "off"

# Dependencies (egui, rendering, text shaping, syn) run optimised in dev and test builds, so
# screen tests, design-lint and the debug gallery run at a usable speed. They build once per
# target dir; the workspace's own crates stay unoptimised and incremental.
[profile.dev.package."*"]
opt-level = 2

# craft-theme's colour maths and the behaviour cores, which run in every screen-test frame, and craft-proof, whose
# tests parse and check whole dictionaries, build at opt-level 1: unoptimised, they made the test binaries several
# times slower, and they are rarely edited. Every other workspace crate, the framework runtime included, stays at
# opt-level 0: an edit to craft-ui-contract (65k lines) rebuilt for 35-90 s at opt-level 1 and rebuilds in seconds at 0,
# and the runtime's hot pipeline is generic, so it compiles in the dependants at their opt-level anyway.
[profile.dev.package.craft-theme]
opt-level = 1
[profile.dev.package.craft-behavior]
opt-level = 1
[profile.dev.package.craft-proof]
opt-level = 1

# The gallery on the Mac: optimised like release, but the workspace's crates build in many small
# units, incrementally, so a change to craft-ui rebuilds in minutes. Dependencies keep release
# settings and build once in target/gallery. `cargo run --profile gallery -p craft-ui-gallery`.
[profile.gallery]
inherits = "release"
incremental = true
codegen-units = 256
opt-level = 1

# The workspace's own crates build at opt-level 1 in the gallery profile: rustc shares generic instantiations across
# crates at opt-level 0, 1, s and z only, so at 1 a change in a framework crate no longer makes every dependant
# re-generate its own copies of that crate's generics and inlined functions (a one-line edit rebuilt the gallery in
# 25 s at opt-level 1 and 69–84 s at 3). `package."*"` matches the dependencies only: they keep release optimisation,
# so this changes nothing in their settings.
[profile.gallery.package."*"]
codegen-units = 16
opt-level = 3
