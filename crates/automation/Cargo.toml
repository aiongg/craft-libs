[package]
name = "craft-automation"
description = "Drive a running Craft app from tests, agents and the CLI: control channel, screenshot queue, frame profiler and frame trace (native only)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# `server` and `client`: the loopback JSON-lines transport over TCP.
tcp = []

[dependencies]
base64 = "0.22"
craft-platform = { workspace = true, features = ["clock"] }
craft-ui = { workspace = true }
egui = { workspace = true }
getrandom = "0.3"
log = "0.4"
png = "0.17"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
