[package]
name = "craft-automation"
description = "Drive a running Craft app from tests, agents and the CLI (control channel, screenshot queue, frame profiler and frame trace; native only), and recorded actions with the Actions panel (every target)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
# Screenshot and input tests of the Actions panel with egui_kittest (desktop only).
screen-testing = ["craft-ui/screen-testing"]

[dependencies]
craft-ui = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# The control channel, its server and client, screenshots, the profiler and the trace.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
base64 = "0.22"
craft-platform = { workspace = true }
getrandom = "0.3"
log = "0.4"
png = "0.17"
thiserror = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu"] }
