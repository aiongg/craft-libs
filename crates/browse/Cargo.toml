[package]
name = "craft-browse"
description = "Browsing for Craft apps: places and folder listings, linked files, file thumbnails, and (`ui`) the tile grid, media bin, places tree, compare tile and relink."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# The browsing widgets (`craft_browse::ui`) and `FileThumbSource`.
ui = ["dep:craft-ui", "dep:egui", "dep:kurbo"]
# Screenshot and input tests of the widgets with egui_kittest (desktop only).
screen-testing = ["ui", "craft-ui/screen-testing"]

[dependencies]
craft-docpath = { workspace = true }
craft-host = { workspace = true }
craft-i18n = { workspace = true }
craft-platform = { workspace = true }
craft-settings = { workspace = true }
craft-theme = { workspace = true }
craft-ui = { package = "craft-ui-legacy", path = "../ui-legacy", optional = true }
egui = { workspace = true, optional = true }
kurbo = { workspace = true, optional = true }
serde = { workspace = true }

[dev-dependencies]
egui = { workspace = true, features = ["default_fonts", "serde"] }
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu"] }
tempfile = "3"
