[package]
name = "craft-color"
description = "Colour for Craft apps: the colour picker, wells, swatch tables, ramps and the hex field."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# The colour widgets (`craft_color::ui`).
ui = ["dep:craft-behavior", "dep:craft-ui", "dep:egui", "dep:craft-settings", "craft-platform/screen"]
# The widgets' stories and trials (`tests/it`).
screen-testing = ["ui", "craft-ui/testing"]

[dependencies]
craft-behavior = { workspace = true, optional = true }
craft-cms = { workspace = true }
craft-host = { workspace = true }
craft-i18n = { workspace = true }
craft-platform = { workspace = true }
craft-settings = { workspace = true, optional = true }
craft-theme = { workspace = true }
craft-ui = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
serde = { workspace = true }

[dev-dependencies]
craft-color = { path = ".", features = ["screen-testing"] }
libtest-mimic = "0.8"
serde_json = { workspace = true }
egui = { workspace = true, features = ["default_fonts", "serde"] }

[[test]]
name = "it"
path = "tests/it/main.rs"
harness = false
required-features = ["screen-testing"]

[[test]]
name = "control_dumps"
required-features = ["ui"]

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu"] }
