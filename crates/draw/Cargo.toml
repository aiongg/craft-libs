[package]
name = "craft-draw"
description = "Vector and shape tools for Craft apps: gradient editing, pen, stroke, shapes, crop, free transform, measure, symmetry and brush presets."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# The tool widgets (`craft_draw::ui`).
ui = ["dep:craft-behavior", "dep:craft-keymap", "dep:craft-ui", "dep:egui", "dep:craft-color", "craft-color/ui", "dep:craft-settings"]
# The widgets' stories and trials (`tests/it`).
screen-testing = ["ui", "craft-ui/testing", "craft-color/screen-testing"]

[dependencies]
craft-behavior = { workspace = true, optional = true }
craft-color = { workspace = true, optional = true }
craft-host = { workspace = true }
craft-i18n = { workspace = true }
craft-keymap = { workspace = true, optional = true }
craft-settings = { workspace = true, optional = true }
craft-theme = { workspace = true }
craft-ui = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
kurbo = { workspace = true, features = ["serde"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
egui = { workspace = true, features = ["default_fonts", "serde"] }
libtest-mimic = "0.8"
serde_json = "1"

[[test]]
name = "it"
path = "tests/it/main.rs"
harness = false
required-features = ["screen-testing"]
