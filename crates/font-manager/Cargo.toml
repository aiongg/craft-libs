[package]
name = "craft-font-manager"
description = "Craft Font Manager as a library: search and filters over the font indexes (Google Fonts, Noto, user-added sources), installed fonts by family, the font store interface, and the egui panel the launcher and the standalone app show."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = []
# `FontsPanel`: the whole interface as one egui panel.
ui = ["dep:egui", "dep:craft-ui", "dep:craft-host", "dep:serde", "dep:log", "dep:epaint_default_fonts"]

[dependencies]
craft-font-catalog = { workspace = true }
craft-i18n = { workspace = true }
# The pinned built-in indexes compiled in, for browsing offline.
craft-font-store = { workspace = true, features = ["bundled-index"] }
# egui's default faces lead the interface font stack.
egui = { workspace = true, features = ["default_fonts"], optional = true }
# The story's installed faces.
epaint_default_fonts = { version = "0.37", optional = true }
# A host that wants installed fonts for characters its interface faces lack (language names in
# their own scripts in the language filter) enables craft-ui's `system_fonts` itself.
craft-ui = { workspace = true, optional = true }
# The Host: settings section, jobs and interface language.
craft-host = { workspace = true, features = ["ui"], optional = true }
serde = { workspace = true, optional = true }
log = { version = "0.4", optional = true }

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# The system's fonts for the Japanese and Arabic screenshots.
egui_system_font_provider = "0.37"

[[test]]
name = "flows"
required-features = ["ui"]

[lints]
workspace = true
