[package]
name = "craft-imaging"
description = "Raster image editing for Craft apps: warps, adjustments, layer styles, selection tools and masks, the full-window editors, the Channels panel and the scopes."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# The editing widgets (`craft_imaging::ui`).
ui = ["dep:craft-behavior", "dep:craft-ui", "dep:egui", "dep:kurbo"]
# Stories and integration trials of the widgets.
screen-testing = ["ui", "craft-ui/testing"]

[dependencies]
craft-behavior = { workspace = true, optional = true }
craft-host = { workspace = true }
craft-i18n = { workspace = true }
craft-theme = { workspace = true }
craft-ui = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
kurbo = { workspace = true, optional = true }
serde = { workspace = true }

[dev-dependencies]
craft-imaging = { path = ".", features = ["screen-testing"] }
egui = { workspace = true, features = ["default_fonts", "serde"] }
libtest-mimic = "0.8"
serde_json = { workspace = true }

[[test]]
name = "control_dumps"
required-features = ["ui"]

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu"] }

[[test]]
name = "it"
path = "tests/it/main.rs"
harness = false
required-features = ["screen-testing"]
