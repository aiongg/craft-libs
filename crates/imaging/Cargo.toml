[package]
name = "craft-imaging"
description = "Raster image editing for Craft apps: the warp grid and the levels editor."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# The editing widgets (`craft_imaging::ui`).
ui = ["dep:craft-ui", "dep:egui", "dep:kurbo"]
# Screenshot and input tests of the widgets with egui_kittest (desktop only).
screen-testing = ["ui", "craft-ui/screen-testing"]

[dependencies]
craft-i18n = { workspace = true }
craft-theme = { workspace = true, features = ["ecolor"] }
craft-ui = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
kurbo = { workspace = true, optional = true }

[dev-dependencies]
egui = { workspace = true, features = ["default_fonts", "serde"] }

[[test]]
name = "control_dumps"
required-features = ["ui"]

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu"] }
