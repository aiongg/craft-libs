[package]
name = "craft-menu"
description = "A Craft app's menus: layouts for macOS, Windows, Linux and the web, shortcuts from craft-keymap, a macOS backend, and key equivalents fed back to egui."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
craft-behavior = { workspace = true }
craft-host = { workspace = true }
craft-i18n = { workspace = true, features = ["collate"] }
craft-keymap = { workspace = true, features = ["egui"] }
craft-quit = { workspace = true, features = ["ui"] }
craft-theme = { workspace = true }
craft-ui = { workspace = true }
egui = { workspace = true }
serde_json = { workspace = true }

# Already in the apps' Cargo.lock: muda through craft-quit's `menu` feature, objc2 and objc2-app-kit
# through eframe.
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21.2", default-features = false }
objc2 = { version = "0.6.4", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSBundle", "NSLocale", "NSString"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSEvent", "NSMenu", "NSMenuItem", "NSResponder"] }

[features]
screen-testing = ["craft-ui/testing"]

[dev-dependencies]
# `default_fonts` so that the bar's tests lay out text.
egui = { workspace = true, features = ["default_fonts"] }
libtest-mimic = "0.8"

[[test]]
name = "it"
path = "tests/it/main.rs"
harness = false
required-features = ["screen-testing"]

[lints]
workspace = true
