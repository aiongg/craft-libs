[package]
name = "craft-pages"
description = "Pages for the Craft document apps: page geometry, page setup, page ranges and numbering; with `ui`, the page view, thumbnails, page setup dialog, rulers' margin handles, header and footer zones and document tables."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# The page widgets (`craft_pages::ui`), on craft-ui.
ui = ["dep:craft-ui", "dep:craft-theme", "dep:egui", "dep:craft-host"]

[dependencies]
# `numbering` formats page numbers with craft-text's list number styles.
craft-text = { workspace = true, default-features = false }
kurbo = { workspace = true }
serde = { workspace = true }
craft-ui = { package = "craft-ui-legacy", path = "../ui-legacy", optional = true }
craft-theme = { workspace = true, optional = true }
craft-host = { workspace = true, features = ["ui"], optional = true }
egui = { workspace = true, optional = true }

[dev-dependencies]
egui = { workspace = true, features = ["default_fonts"] }
egui_kittest = "0.37"
# The list test installs a catalog.
craft-i18n = { workspace = true }
