[package]
name = "craft-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Small platform lifecycle services for the Craft suite"

[lints]
workspace = true

[features]
default = []
dialogs = []
appearance = ["dep:zbus", "dep:futures-lite", "dep:async-channel", "dep:async-io", "dep:async-process", "dep:web-sys"]
browser = ["dep:wasm-bindgen", "dep:js-sys", "dep:web-sys"]
ui = ["dep:egui"]
theme = ["dep:craft-theme"]
# Moving the system pointer (a scrub's screen-edge wrap).
pointer = ["dep:core-graphics"]
# `session`: the documents open at the last quit, stored with serde in the app's settings.
session = ["dep:serde", "dep:serde_json"]
# `usage`: the process's memory use.
usage = ["dep:sysinfo"]
# `clock`: the monotonic app clock tests can set by hand.
clock = ["dep:web-time"]
# `pacing`: frame-rate cap, window state and background work slices.
pacing = ["clock", "dep:egui"]
# `logs`: the app log file, the panic hook and its crash log.
logs = ["clock", "dep:log", "dep:web-time"]
# `open`: file intake, natural order, reveal in the file manager.
open = ["dep:craft-host"]
# `autosave`: the autosave timer and the recovery folder.
autosave = ["dep:serde", "dep:serde_json", "dep:craft-atomic"]
# Screen capture for the screen colour picker (`craft_platform::screen`).
screen = ["dep:craft-host", "dep:zbus", "zbus?/blocking-api", "dep:futures-lite", "dep:async-io", "dep:x11rb", "dep:core-graphics2", "dep:xcap"]
# `clipboard`: the system clipboard with size limits, the synthetic-input fence and the paste probe.
clipboard = ["dep:arboard"]
# `watch`: open files that change on disk.
watch = []
# `default-app`: making the app the system default for its file types, and its launch arguments.
default-app = []
# `temp`: private temporary folders and files.
temp = []

[dependencies]
egui = { workspace = true, optional = true }
craft-theme = { workspace = true, optional = true }
log = { version = "0.4", optional = true }
web-time = { version = "1.1", optional = true }
craft-atomic = { workspace = true, optional = true }
craft-host = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

# Version eframe already pulls in; image data only (no default features beyond it).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = { version = "3.7", default-features = false, features = ["image-data", "wayland-data-control"], optional = true }

[target.'cfg(all(unix, not(target_os = "macos"), not(target_arch = "wasm32")))'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io"], optional = true }
futures-lite = { version = "2", optional = true }
async-channel = { version = "2", optional = true }
async-io = { version = "2", optional = true }
async-process = { version = "2", optional = true }
x11rb = { version = "0.13", default-features = false, features = ["image", "randr"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.23", optional = true }
core-graphics2 = { version = "=0.6.1", default-features = false, features = ["display", "window", "link"], optional = true }

# Linux reads `/proc`; elsewhere `sysinfo` gives the system's available memory (MIT).
[target.'cfg(any(target_os = "macos", windows))'.dependencies]
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"], optional = true }

[target.'cfg(windows)'.dependencies]
xcap = { version = "=0.9.8", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "Node", "Element", "MediaQueryList"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
wasm-bindgen-futures = "0.4"
