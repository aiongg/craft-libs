[package]
name = "craft-review"
description = "Review for Craft apps: comments and threads, annotations, signatures, version history and revisions; presence, voting, chat and join over the app's own transport."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# The review widgets (`craft_review::ui`).
ui = ["dep:craft-behavior", "dep:craft-keymap", "dep:craft-ui", "dep:craft-host", "dep:craft-theme", "dep:egui", "dep:image"]
# The stories and the integration tests (`tests/it`).
screen-testing = ["ui", "craft-ui/testing"]

[dependencies]
craft-behavior = { workspace = true, optional = true }
craft-host = { workspace = true, optional = true, features = ["ui"] }
craft-i18n = { workspace = true }
craft-keymap = { workspace = true, optional = true }
craft-theme = { workspace = true, optional = true }
craft-ui = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
kurbo = { workspace = true, features = ["serde"] }
serde = { workspace = true }

[dev-dependencies]
egui = { workspace = true, features = ["default_fonts", "serde"] }
libtest-mimic = "0.8"
serde_json = { workspace = true }

[[test]]
name = "it"
path = "tests/it/main.rs"
harness = false
required-features = ["screen-testing"]
