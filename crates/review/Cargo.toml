[package]
name = "craft-review"
description = "Review for Craft apps: comments and threads, annotations, signatures, version history and revisions; presence, voting, chat and join over the app's own transport."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# `Serialize` and `Deserialize` for the plain-data types (threads, annotations, signatures, versions).
serde = ["dep:serde", "kurbo/serde"]
# Collaboration: presence, voting, cursor chat and join, over a `CollabTransport` the app implements.
collab = []
# The review widgets (`craft_review::ui`); the saved signatures need `serde`.
ui = ["dep:craft-ui", "dep:craft-host", "dep:egui", "serde"]
# Screenshot and input tests of the widgets with egui_kittest (desktop only).
screen-testing = ["ui", "craft-ui/screen-testing"]

[dependencies]
craft-host = { workspace = true, optional = true }
craft-ui = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
kurbo = { workspace = true }
serde = { workspace = true, optional = true }

[dev-dependencies]
egui = { workspace = true, features = ["default_fonts", "serde"] }
