[package]
name = "craft-table"
description = "Spreadsheet widgets for Craft apps: the cell grid, outline bands, field lists, conditions, charts, slicers, reference picking, selection statistics, error tags and filter buttons."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# The table widgets (`craft_table::ui`).
ui = ["dep:craft-ui", "dep:egui"]
# Screenshot and input tests of the widgets with egui_kittest (desktop only).
screen-testing = ["ui", "craft-ui/screen-testing"]

[dependencies]
craft-ui = { workspace = true, optional = true }
egui = { workspace = true, optional = true }

[dev-dependencies]
egui = { workspace = true, features = ["default_fonts", "serde"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu"] }
