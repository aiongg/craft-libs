[package]
name = "craft-theme-store"
description = "The Craft suite's theme files, machine-local theme library and shared suite selection, with a lock/revision protocol for concurrent apps. egui only behind the `ui` feature (the appearance page)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = []
# `SAMPLE_THEME_JSON` and its expected colours for app adapter tests, and a fault-injecting
# file system for write-failure tests.
testing = []
# serde for `Accepted`, which apps keep in their preferences, and craft-theme's selection types in it.
serde = ["dep:serde", "craft-theme/serde"]
# `craft_theme_store::ui`: the Preferences appearance page and its theme chips.
ui = ["dep:craft-ui", "dep:egui"]

[dependencies]
craft-theme = { workspace = true }
craft-ui = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-atomic = { workspace = true }
dirs = "7"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
