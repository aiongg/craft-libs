[package]
name = "craft-theme-store"
description = "The Craft suite's theme files, machine-local theme library and shared suite selection, with a lock/revision protocol for concurrent apps. egui only behind the `ui` feature (the appearance page)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = []
# `craft_theme_store::ui`: the Preferences appearance page and its theme chips.
ui = ["dep:craft-ui", "dep:egui"]
# Input and screenshot tests of the appearance page with egui_kittest (desktop only).
screen-testing = ["ui", "dep:egui_kittest", "craft-ui/screen-testing"]

[dependencies]
craft-theme = { workspace = true }
craft-ui = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
egui_kittest = { version = "0.37", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-atomic = { workspace = true }
dirs = "7"

[dev-dependencies]
tempfile = "3"
# Glyphs for the appearance page tests.
egui = { workspace = true, features = ["default_fonts"] }

[lints]
workspace = true
