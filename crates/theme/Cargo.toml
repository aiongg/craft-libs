[package]
name = "craft-theme"
description = "The Craft design system's theme model: colour, scale and token primitives, semantic and component tokens derived from theme seeds and pins, contrast rules, the `craft-design-theme` file format, built-in themes and the suite selection. No egui (the `ecolor` feature adds conversion from egui's colour type). The library does no file I/O; the `craft-theme` binary reads theme files to check them."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = []
# Serialize and Deserialize for the data types: colours as "#rrggbb[aa]", ids as strings.
serde = ["dep:serde"]
# `From<ecolor::Color32>` for `Rgba`, for callers that hold egui colours.
ecolor = ["dep:ecolor"]

[dependencies]
ecolor = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
craft-cms = { workspace = true }

[lints]
workspace = true
