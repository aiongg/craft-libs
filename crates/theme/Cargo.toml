[package]
name = "craft-theme"
description = "The Craft apps' suite-theme contract: theme identity, core colour roles, derived states, contrast checks, built-in themes, the v2 theme file format and resolution. No egui. The library does no file I/O; the `craft-theme` binary reads theme files to check them."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = []
# Serialize and Deserialize for the data types: colours as "#rrggbb[aa]", ids as strings.
serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, optional = true }
serde_json = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
