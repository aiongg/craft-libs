[package]
name = "craft-timeline"
description = "Timelines for Craft apps: exact media time, frame rates, timecode, the playback clock, frame cache and frame server; the ruler, tracks, clips, keyframes, graph editor, transport and render queue."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = []
# The timeline widgets (`craft_timeline::ui`).
ui = ["dep:craft-behavior", "dep:craft-keymap", "dep:craft-theme", "dep:craft-ui", "dep:egui"]
# The stories and the integration tests (`tests/it`).
screen-testing = ["ui", "craft-ui/testing"]

[dependencies]
craft-behavior = { workspace = true, optional = true }
craft-keymap = { workspace = true, optional = true }
craft-theme = { workspace = true, optional = true }
craft-ui = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
serde = { workspace = true }
web-time = "1.1"

[dev-dependencies]
egui = { workspace = true, features = ["default_fonts", "serde"] }
libtest-mimic = "0.8"

[[test]]
name = "it"
path = "tests/it/main.rs"
harness = false
required-features = ["screen-testing"]
