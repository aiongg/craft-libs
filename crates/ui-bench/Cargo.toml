[package]
name = "craft-ui-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Release-mode benchmark of the UI library's performance scenarios (spec 22.7)"
publish = false

# Not `workspace = true`: the counting allocator needs `unsafe`, which the workspace forbids.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"

[dependencies]
craft-behavior = { workspace = true }
craft-host = { workspace = true }
craft-ui = { workspace = true }
# Both libraries are named `craft_ui`; the legacy one is renamed here so the foundation binary links `craft-ui`.
craft_ui_legacy = { package = "craft-ui-legacy", path = "../ui-legacy" }
craft-window = { workspace = true }
egui = { workspace = true, features = ["default_fonts"] }
serde = { workspace = true }
serde_json = { workspace = true }

[[bin]]
name = "legacy"
path = "src/bin/legacy.rs"

[[bin]]
name = "foundation"
path = "src/bin/foundation/main.rs"
