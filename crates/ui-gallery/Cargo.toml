[package]
name = "craft-ui-gallery"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Storybook-like gallery of craft-ui stories, themed with craft-theme (desktop and web)"
publish = false

[lints]
workspace = true

[dependencies]
craft-theme = { workspace = true }
craft-ui = { workspace = true, features = ["window-frame"] }
egui = { workspace = true }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "persistence", "wgpu"] }
serde = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The "System" interface face reads the installed fonts.
craft-ui = { workspace = true, features = ["system_fonts"] }
eframe = { version = "0.37", default-features = false, features = ["x11", "wayland"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
