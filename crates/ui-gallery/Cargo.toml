[package]
name = "craft-ui-gallery"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Story viewer over craft-ui's registered stories"
publish = false
autotests = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "craft-ui-gallery"
path = "src/main.rs"
test = false

[[test]]
name = "it"
path = "tests/it/main.rs"
harness = false

[lints]
workspace = true

[dependencies]
craft-ui = { workspace = true, features = ["app", "testing"] }
craft-i18n = { workspace = true }
craft-theme = { workspace = true }
craft-window = { workspace = true }
egui = { workspace = true }
eframe = { version = "0.37", default-features = false }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

# The viewer's saved settings and its panel layout.
craft-behavior = { workspace = true }
craft-settings = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# The domain crates' stories, registered under each crate's `screen-testing`.
craft-automation = { workspace = true, features = ["screen-testing"] }
craft-browse = { workspace = true, features = ["screen-testing"] }
craft-color = { workspace = true, features = ["screen-testing"] }
craft-dialogs = { workspace = true, features = ["screen-testing"] }
craft-draw = { workspace = true, features = ["screen-testing"] }
craft-font-manager = { workspace = true, features = ["screen-testing"] }
craft-imaging = { workspace = true, features = ["screen-testing"] }
craft-layers = { workspace = true, features = ["screen-testing"] }
craft-menu = { workspace = true, features = ["screen-testing"] }
craft-pages = { workspace = true, features = ["screen-testing"] }
craft-print = { workspace = true, features = ["screen-testing"] }
craft-review = { workspace = true, features = ["screen-testing"] }
craft-table = { workspace = true, features = ["screen-testing"] }
craft-text = { workspace = true, features = ["screen-testing"] }
craft-theme-store = { workspace = true, features = ["screen-testing"] }
craft-timeline = { workspace = true, features = ["screen-testing"] }
craft-update = { workspace = true, features = ["screen-testing"] }

[dev-dependencies]
libtest-mimic = "0.8"
