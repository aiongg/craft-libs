[package]
name = "craft-ui-gallery"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Story viewer over craft-ui's registered stories"
publish = false
autotests = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "craft-ui-gallery"
path = "src/main.rs"
test = false

[[test]]
name = "it"
path = "tests/it/main.rs"
harness = false

[lints]
workspace = true

[dependencies]
craft-ui = { workspace = true, features = ["app", "testing"] }
craft-i18n = { workspace = true }
craft-theme = { workspace = true }
craft-window = { workspace = true }
egui = { workspace = true }
eframe = { version = "0.37", default-features = false }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }

# The viewer's saved settings and its panel layout.
craft-behavior = { workspace = true }
craft-settings = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
libtest-mimic = "0.8"
