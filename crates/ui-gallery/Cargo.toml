[package]
name = "craft-ui-gallery"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Storybook-like gallery of craft-ui stories, themed with craft-theme (desktop and web)"
publish = false
default-run = "craft-ui-gallery"

[lints]
workspace = true

[features]
# The `capture` binary: stories rendered to PNG without a window (desktop only).
capture = ["craft-ui/screen-testing", "craft-color/screen-testing", "craft-draw/screen-testing", "dep:egui_kittest", "dep:image", "dep:serde_json"]

[[bin]]
name = "capture"
required-features = ["capture"]

[dependencies]
craft-color = { workspace = true, features = ["ui"] }
craft-draw = { workspace = true, features = ["ui"] }
craft-i18n = { workspace = true }
craft-theme = { workspace = true, features = ["serde"] }
craft-platform = { workspace = true, features = ["appearance", "ui", "theme"] }
craft-ui = { workspace = true, features = ["window-frame", "serde"] }
egui = { workspace = true }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "persistence", "wgpu"] }
serde = { workspace = true }
egui_kittest = { version = "0.37", features = ["wgpu"], optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
serde_json = { version = "1", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The "System" interface face reads the installed fonts.
craft-ui = { workspace = true, features = ["system_fonts"] }
eframe = { version = "0.37", default-features = false, features = ["x11", "wayland"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"

[[test]]
name = "capture"
required-features = ["capture"]
