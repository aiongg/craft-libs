[package]
name = "craft-ui-platform-winit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "craft-ui-rt's Platform on craft's winit fork: multi-window desktop and browser canvas, one AccessKit adapter per window, IME, clipboard, cursors, file drop, theme events, monitors and raw window handles"

[lints]
workspace = true

[dependencies]
craft-ui-rt = { workspace = true }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
accesskit = "0.25"
accesskit_winit = { version = "0.34", default-features = false, features = ["rwh_06", "accesskit_unix", "async-io"] }
web-time = "1.1"
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = { workspace = true }
arboard = { version = "3.7", default-features = false, features = ["image-data", "wayland-data-control"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Navigator", "Element", "HtmlCanvasElement"] }

[dev-dependencies]
craft-theme = { workspace = true }
