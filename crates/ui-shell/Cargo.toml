[package]
name = "craft-ui-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The app shell and title bar of the craft UI library, and its app host"

[lib]
# Every test lives in the `it` integration binary.
test = false

[lints]
workspace = true

[features]
suite = ["testing", "craft-ui-panels/suite"]
default = []
# `shell::app::run` and `start_web`: the app host on winit, drawing with epaint.
app = ["dep:craft-ui-platform-winit", "dep:craft-ui-render-epaint"]
# `shell::app::run` can draw with Skia's CPU raster too (`CRAFT_RENDERER=skia`; native only).
skia = ["app", "dep:craft-ui-render-skia"]
# `craft_ui::testing`.
testing = ["craft-ui-panels/testing"]

[dependencies]
craft-ui-panels = { workspace = true }
craft-behavior = { workspace = true }
# `open::CAN_REVEAL`: whether the start screen offers Show in Folder.
craft-platform = { workspace = true }
craft-theme = { workspace = true }
craft-ui-macros = { workspace = true }
egui = { workspace = true }
craft-host = { workspace = true }
# The app host's command board keymap.
craft-keymap = { workspace = true }
craft-window = { workspace = true }
# The app host: the driver, its platforms and renderers.
craft-ui-rt = { workspace = true }
craft-ui-platform-winit = { workspace = true, optional = true }
craft-ui-render-epaint = { workspace = true, optional = true }
craft-i18n = { workspace = true, features = ["collate"] }
# The saved forms of `ScreenMode`, `RecentView` and `RecentSort`.
serde = { workspace = true }
# The caption button icons.
craft-svg = { workspace = true, features = ["draw"] }
# `std::time::Instant` on native; the browser clock on wasm, where `Instant::now` panics.
web-time = "1.1"

# Skia has no wasm32-unknown-unknown build.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-ui-render-skia = { workspace = true, optional = true }

[dev-dependencies]
craft-ui-shell = { path = ".", features = ["suite"] }
craft-keymap = { workspace = true }
craft-ui-platform-headless = { workspace = true }
craft-ui-rt = { workspace = true }
craft-behavior = { workspace = true }
craft-host = { workspace = true }
craft-theme = { workspace = true }
craft-ui-test-kit = { workspace = true, features = ["suite"] }
craft-window = { workspace = true }
egui = { workspace = true }
serde_json = { workspace = true }

[[test]]
name = "host"
path = "tests/host.rs"

[[test]]
name = "it"
path = "tests/it/main.rs"
harness = false
