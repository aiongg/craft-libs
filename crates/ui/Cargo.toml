[package]
name = "craft-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Runtime, contract, components, patterns and shell of the craft UI library, on egui"
autotests = false

[lib]
# Every test lives in the `it` integration binary, so `cargo test` builds the library once.
test = false

[lints]
workspace = true

[features]
default = []
# `shell::app`: the eframe entry point.
app = ["dep:eframe", "craft-window/ui"]
# `craft_ui::testing`: the fixture and suite runner.
testing = ["dep:libtest-mimic"]
# `craft_ui::testing::snapshot`: stories rendered to images offscreen (desktop only).
snapshot = ["testing", "dep:egui_kittest", "dep:image"]
# Draw colour glyphs (COLR, sbix, CBDT), e.g. colour emoji.
color_fonts = ["dep:epaint", "epaint/color_fonts"]
# Find installed fonts for characters the app's faces lack (desktop only).
system_fonts = ["dep:fontique"]

[dependencies]
craft-behavior = { workspace = true }
# `Intent::Access` and the AccessKit action requests the key stage routes.
accesskit = "0.25"
craft-keymap = { workspace = true, features = ["egui"] }
craft-theme = { workspace = true }
craft-ui-macros = { workspace = true }
egui = { workspace = true }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "x11", "default_fonts"], optional = true }
libtest-mimic = { version = "0.8", optional = true }
craft-host = { workspace = true }
# `WindowSystem` and `restore::Store`, which viewport mounts place windows through.
craft-window = { workspace = true }
# `quit`, which `runtime::windows::logic` routes a root close through.
craft-quit = { workspace = true }
craft-i18n = { workspace = true, features = ["collate"] }
log = "0.4"
smallvec = { workspace = true }
inventory = "0.3.25"
serde = { workspace = true }
# `patterns::preferences::SettingsDocument` turns an app's settings struct into a draft table and back; `toml_edit` gives
# the struct's field order, which a `toml::Table` sorts away.
toml = { version = "1.1", default-features = false, features = ["std", "parse", "serde"] }
toml_edit = { version = "0.25", features = ["serde"] }
# `patterns::form_dialogs::PdfExportDialog` edits `craft_pdf::settings::PdfSettings`.
craft-pdf = { workspace = true, default-features = false }
# `patterns::form_dialogs::Secret` zeroes its buffer on drop.
zeroize = "1.9"

# `fonts`: character maps and variation axes of faces, and inflating egui's default fonts, stored deflated.
skrifa = { version = "0.44", default-features = false, features = ["std"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# The installed font folders, for the on-demand font candidates (`fonts::SystemCandidates`).
craft-font-catalog = { workspace = true, default-features = false }
# The craft-fonts faces (`fonts::EmbeddedFace`, `fonts::ServedFace`).
craft-fonts-build = { workspace = true }
# Only `color_fonts` reads it: the feature turns on epaint's colour glyphs.
epaint = { version = "0.37", default-features = false, optional = true }

# Icon rasterising; the version egui_extras's `svg` feature uses, so apps build one copy.
resvg = { version = "0.45.1", default-features = false }
# `std::time::Instant` on native; the browser clock on wasm, where `Instant::now` panics.
web-time = "1.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The versions egui_system_font_provider 0.37 uses.
fontique = { version = "0.11.1", default-features = false, features = ["system", "fontconfig-dlopen"], optional = true }
# `testing::snapshot`: egui's wgpu test renderer, which prefers a software adapter, and PNG output.
egui_kittest = { version = "0.37", features = ["wgpu"], optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

# `shell::title_bar::sync_movable` sets `NSWindow.movable` through craft-window's AppKit code, without its egui layer.
[target.'cfg(target_os = "macos")'.dependencies]
craft-window = { workspace = true, features = ["appkit"] }

# build.rs reads icons/icons.toml and deflates the suite's default fonts (Inter, egui's faces) for `fonts::deflated_default_definitions`.
[build-dependencies]
toml = { version = "1.1", default-features = false, features = ["std", "parse", "serde"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
epaint_default_fonts = "0.37"

[dev-dependencies]
craft-ui = { path = ".", features = ["testing"] }
# The word-id and api-map trials parse the workspace's sources.
proc-macro2 = "1"
syn = { version = "2", features = ["full"] }
toml = { version = "1.1", default-features = false, features = ["std", "parse", "serde"] }

[[test]]
name = "it"
path = "tests/it/main.rs"
harness = false
