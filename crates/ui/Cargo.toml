[package]
name = "craft-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Reusable egui controls and icon catalogs for Craft frontends"

[lints]
workspace = true

[dependencies]
craft-fonts-build = { workspace = true }
craft-i18n = { workspace = true }
craft-theme = { workspace = true, features = ["ecolor"] }
craft-ui-macros = { workspace = true }
craft-window = { workspace = true, features = ["egui"], optional = true }
egui = { workspace = true }
epaint = { version = "0.37", default-features = false }
# Document geometry of canvas overlays (`canvas::kurbo`): the version DesignCraft and VectorCraft use.
kurbo = { workspace = true }
log = "0.4"
# Icon rasterising; the version egui_extras's `svg` feature uses, so apps build one copy.
resvg = { version = "0.45.1", default-features = false }
serde = { version = "1", features = ["derive"], optional = true }
# Same version as epaint's, for reading a face's character map.
skrifa = { version = "0.44", default-features = false, features = ["std"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Screenshot and input tests of an app's screens (the screen-testing feature).
egui_kittest = { version = "0.37", features = ["snapshot", "wgpu"], optional = true }
# The version egui_kittest's wgpu renderer uses, for sharing one device (testing::wgpu_renderer).
egui-wgpu = { version = "0.37", default-features = false, optional = true }
# The versions egui_system_font_provider 0.37 uses.
fontique = { version = "0.11.1", default-features = false, features = ["system", "fontconfig-dlopen"], optional = true }
unicode-script = { version = "0.5.8", optional = true }

# Fetching served fonts (`fonts::UiFonts::served_faces`); already in every eframe web build.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "RequestInit", "Response", "console"] }

# Fading a native window while it is dragged (`NSWindow.alphaValue`); winit already uses these.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "objc2-core-foundation", "NSApplication", "NSEvent", "NSResponder", "NSScreen", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSString"] }

[features]
default = []
serde = ["dep:serde"]
# Floating windows may move to their own OS windows (desktop egui backends with viewports).
native-windows = []
# Draw colour glyphs (COLR, sbix, CBDT), e.g. colour emoji.
color_fonts = ["epaint/color_fonts"]
# Find installed fonts for characters the app's faces lack (desktop only).
system_fonts = ["dep:fontique", "dep:unicode-script"]
# `title_bar`: the app-drawn caption row that is the window's title bar (desktop only).
window-frame = ["dep:craft-window", "craft-window/egui"]
# `PreferencesWindow::remember`: the window's size and position kept by craft-window's window-restore store.
window-restore = ["window-frame", "craft-window/restore-egui"]
# `docking::testing`: a headless driver for application docking tests.
testing = []
# craft_ui::testing: per-language screenshot tests and IME smoke tests with egui_kittest
# (desktop only).
screen-testing = ["dep:egui_kittest", "dep:egui-wgpu"]

# build.rs reads icons/icons.toml.
[build-dependencies]
toml = { version = "1.1", default-features = false, features = ["std", "parse", "serde"] }

[dev-dependencies]
# serde: the IME tests read events that only the suite's egui fork has from JSON.
egui = { workspace = true, features = ["default_fonts", "serde"] }
serde_json = "1"
ron = "0.12"
egui_extras = { version = "0.37", default-features = false, features = ["svg"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[[example]]
name = "docking_native"
required-features = ["native-windows"]

[[test]]
name = "screens"
required-features = ["screen-testing"]

# PNG sheets of every story (CRAFT_UI_SHEETS=<dir>).
[[test]]
name = "sheets"
required-features = ["screen-testing"]

[[test]]
name = "visual_regression"
required-features = ["screen-testing"]

[[test]]
name = "docking_workflows"
required-features = ["screen-testing"]

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu"] }
craft-quit = { workspace = true, features = ["egui"] }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "x11", "default_fonts"] }

# The browser test (tests/web_fonts.rs).
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3"
web-sys = { version = "0.3", features = ["Window", "Response"] }
