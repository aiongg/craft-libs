# The suite's icons by meaning, and each candidate set's file for them (without `.svg`).
#
# `build.rs` turns this into `craft_ui::icons::Icon` and `IconSet`. A name without a file in a
# set, or a file a set folder holds but no icon lists, fails the build. Sources and licences:
# ATTRIBUTION.md.
#
# `directional`: mirrored in a right-to-left interface (arrows of reading order, undo, redo).
# `kind`: "stroke" sets get their stroke width rewritten to the suite's drawn width; "fill" sets
# render as drawn. `stroke_width` is the set's own width in view-box units.

[[set]]
id = "lucide"
title = "Lucide"
licence = "ISC"
kind = "stroke"
stroke_width = 2.0

[[set]]
id = "phosphor"
title = "Phosphor (regular)"
licence = "MIT"
kind = "fill"

[[set]]
id = "carbon"
title = "IBM Carbon"
licence = "Apache-2.0"
kind = "fill"

[[set]]
id = "tabler"
title = "Tabler (outline)"
licence = "MIT"
kind = "stroke"
stroke_width = 2.0

