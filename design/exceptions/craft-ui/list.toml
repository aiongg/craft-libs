config_version = 1

[[exception]]
name = "empty-note-stories"
kind = "probe"
rule = "probe/exempt/face-only"
path = "crates/ui/src/list/findings.rs"
reason = "The empty state of FindingsList, shown by its empty story; a worked example, so the exemption goes when the story covers it."

[[exception]]
name = "row-thumb-face-only"
kind = "probe"
rule = "probe/exempt/face-only"
path = "crates/ui/src/list/row.rs"
reason = "The thumbnail picture is a part of `ListRow`, shown by its stories."
