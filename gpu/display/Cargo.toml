[package]
name = "craft-display"
description = "Display colour for the Craft suite: each monitor's profile and why, the display transform from a document's profile to the monitor's, and the display pass (channel views, exposure, a pending HDR step, the display conversion) on the CPU and in WGSL."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
craft-cms = { workspace = true }
craft-platform = { workspace = true, features = ["monitors"] }
craft-wgsl = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }

[dev-dependencies]
naga = { workspace = true }
craft-gpu-testkit = { workspace = true }

# The GPU target: the WGSL pass against its CPU reference, skipped when no adapter is present.
[[test]]
name = "gpu"
path = "tests/gpu/main.rs"
