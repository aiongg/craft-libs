[package]
autotests = false
name = "craft-gpu-host"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "The window's and headless GPU devices for the Craft suite: device health with one handler per device, error scopes, limits, software-adapter detection and the video-memory query"

[lints]
workspace = true

[dependencies]
wgpu = { workspace = true }
log = "0.4"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = { workspace = true }
# The start-up record, the restart argument and the test start's lines.
serde_json = { workspace = true }
# Physical memory for `memory::physical_memory`.
craft-platform = { workspace = true, features = ["usage"] }

# A scope the browser answers later (`scope::checked`).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"

# DXGI's dedicated video memory (`memory::video_memory`), the display devices that tell which GPU
# drives a monitor (`adapter::display_gpus`), ending a hung process (`start::watch_first_frame`) and
# the display drivers in the registry (`probe`); a safe API, so no `unsafe` here.
[target.'cfg(windows)'.dependencies]
winsafe = { version = "0.0.29", default-features = false, features = ["dxgi", "user", "kernel", "advapi"] }

# Asks the Wayland compositor which GPU it draws with (linux-dmabuf feedback,
# `adapter::compositor_gpu`). Both are already in the build through winit.
[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }

# The GPU target: real devices, skipped when no adapter is present.
[[test]]
name = "gpu"
path = "tests/gpu/main.rs"
