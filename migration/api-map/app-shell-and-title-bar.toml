# API map of the "App shell and title bar" family: old path to new path and setter renames.
# Filled in by the family track; the codemods and the app scan read it.

family = "App shell and title bar"
new_module = "craft_ui::shell"

# One entry per public type: `old` is the path an app calls today, `new` the path after migration.
# `status` is "pending", "same" (path unchanged), "moved", "replaced" (use `note`) or "removed".

[[type]]
name = "AppShell"
old = "craft_ui::shell::AppShell"
new = "craft_ui::shell::AppShell"
status = "pending"

[[type]]
name = "CanvasShell"
old = "craft_ui::shell::canvas::CanvasShell"
new = "craft_ui::shell::CanvasShell"
status = "pending"

[[type]]
name = "StartScreen"
old = "craft_ui::shell::StartScreen"
new = "craft_ui::shell::StartScreen"
status = "same"
note = "A `Pattern`: `StartScreen::new(Bind<RecentView>, Bind<RecentSort>, &[RecentFile], &Collator)`, `show(self, ui) -> StartOutput` (actions in `StartOutput.actions`)."

[[type]]
name = "TitleBar"
old = ""
# found in: craft_ui::docking::chrome::TitleBar, craft_ui::title_bar::TitleBar
new = "craft_ui::shell::TitleBar"
status = "pending"

[[type]]
name = "ViewportWindow"
old = "craft_ui::viewport::ViewportWindow"
new = "craft_ui::shell::ViewportWindow"
status = "moved"
note = "A `Pattern` over `Dialog::viewport()`: `ViewportWindow::new(title).app_modal(bool).layer(Overlay).remember(SaveKey).show(ui, body) -> ViewportWindowOutput`. It has no viewport id and no builder: the dialog identifies and places the window."

[[type]]
name = "ShellCx"
old = "craft_ui::shell::ShellCx"
new = "craft_ui::runtime::env::ShellCx"
status = "moved"
note = "Read through `BodyCx::shell() -> Option<ShellCx>`, which returns a clone; built with `ShellCx::new`, `detached` or the `with_*` builders."

[[type]]
name = "Slot"
old = "craft_ui::shell::Slot"
new = "craft_ui::shell::Slot"
status = "same"
note = "Sizes are `SlotSize` names; the label is a `Label`; `frame` is gone."

[[type]]
name = "SlotKey"
old = "craft_ui::shell::SlotKey"
new = "craft_ui::runtime::env::SlotKey"
status = "moved"

[[type]]
name = "WindowKey"
old = "craft_ui::shell::WindowKey"
new = "craft_ui::runtime::env::WindowKey"
status = "moved"

[[type]]
name = "BodyMode"
old = "craft_ui::shell::BodyMode"
new = "craft_ui::runtime::env::BodyMode"
status = "moved"

[[type]]
name = "Edge"
old = "craft_ui::shell::Edge"
new = ""
status = "replaced"
note = "`craft_ui::contract::PaneEdge` (`Center`, `Start`, `End`, `Top`, `Bottom`); the shell adds no second edge type."

# One entry per renamed, removed or reshaped setter or constructor.
# [[setter]]
# type = ""
# old = ""
# new = ""

# Window edge zones, the drag strip and the caption record (winhost cleanup).

[[type]]
name = "CaptionRegions"
old = "craft_ui::title_bar::CaptionRegions"
new = "craft_ui::shell::CaptionRegions"
status = "replaced"
note = "A trait with `button`, `drag` and `native_hit_test` methods becomes the record `CaptionRegions { buttons, edges, moves }` that `WindowHost::caption_regions(viewport)` derives from the window's exclusive parts: a bar tags its parts with `PartBuilder::exclusive(WindowHit::Caption(button))` or `WindowHit::Move`, and publishes nothing."

[[type]]
name = "Caption"
old = "craft_ui::title_bar::Caption"
new = "craft_ui::shell::Caption"
status = "moved"

[[type]]
name = "resize_zones_only"
old = "craft_ui::title_bar::resize_zones_only"
new = ""
status = "replaced"
note = "The edge zones are the body step's resize grips of a container in an OS window; there is no separate call."

[[type]]
name = "release_after_os_resize"
old = "craft_ui::title_bar::release_after_os_resize"
new = ""
status = "replaced"
note = "The runtime ends a press the operating system took over; an app installs no raw-input hook for it."

[[setter]]
type = "Slot"
old = "height(f32)"
new = "size(SlotSize)"
note = "A size is a named theme size: `SlotSize::TitleBar`, `TabBar`, `StatusBar`, `OptionsBar`, `OptionsBarNarrow`, `RailWidth` (per column; `Slot::columns(n)` says how many rail columns)."

[[setter]]
type = "Slot"
old = "width(f32)"
new = "size(SlotSize)"
note = "A size is a named theme size: `SlotSize::RailWidth` for a rail."

[[setter]]
type = "Slot"
old = "size(f32)"
new = "size(SlotSize)"
note = "No point sizes: the slot takes a named theme size."

[[setter]]
type = "Slot"
old = "frame(Frame)"
new = ""
note = "removed: the slot's container paints its own surface."

[[setter]]
type = "ShellCx"
old = "canvas(CanvasId)"
new = ""
note = "removed: the key stage asks the focused component's `KeyUse` whether Tab toggles the chrome, so a canvas registers nothing."

# Start screen and app windows.

[[type]]
name = "RecentFile"
old = "craft_ui::shell::RecentFile"
new = "craft_ui::shell::RecentFile"
status = "same"
note = "`#[non_exhaustive]`: `RecentFile::new(path, name)` then set `opened`, `created` and `thumbnail`. `thumbnail` is an `Option<Revision>` of the picture stored under `ThumbKey::Recent(path)`, not an `egui::TextureId`."

[[type]]
name = "Template"
old = "craft_ui::shell::Template"
new = "craft_ui::shell::Template"
status = "same"
note = "`#[non_exhaustive]`: `Template::new(id, name, detail)` then set `thumbnail`, an `Option<Revision>` of the picture stored under `ThumbKey::Template(id)`."

[[type]]
name = "RecentView"
old = "craft_ui::shell::RecentView"
new = "craft_ui::shell::RecentView"
status = "same"
note = "`#[non_exhaustive]`; the app owns it as a `Bind<RecentView>`."

[[type]]
name = "RecentSort"
old = "craft_ui::shell::RecentSort"
new = "craft_ui::shell::RecentSort"
status = "same"
note = "`#[non_exhaustive]`; the app owns it as a `Bind<RecentSort>`."

[[type]]
name = "StartAction"
old = "craft_ui::shell::StartAction"
new = "craft_ui::shell::StartAction"
status = "same"
note = "`ViewChanged` is gone: the view and sort are the app's bindings, written when the user changes them."

[[type]]
name = "sort_recent"
old = "craft_ui::shell::sort_recent"
new = "craft_ui::shell::sort_recent"
status = "same"

[[type]]
name = "StartLabels"
old = "craft_ui::shell::StartLabels"
new = ""
status = "removed"
note = "Replaced by `StartWords`, the installed word set; the screen takes no labels."

[[type]]
name = "StartWords"
old = ""
new = "craft_ui::shell::StartWords"
status = "replaced"
note = "The start screen's word set, replacing `StartLabels`; ids keep the `start.` prefix."

[[type]]
name = "ThumbKey"
old = ""
new = "craft_ui::shell::ThumbKey"
status = "replaced"
note = "The texture-store key of a start screen picture (a recent file's path or a template's id); replaces the `egui::TextureId` fields."

[[type]]
name = "StartOutput"
old = ""
new = "craft_ui::shell::StartOutput"
status = "replaced"
note = "`show` returns it in place of `Vec<StartAction>`: `output.actions`."

[[type]]
name = "StartRecentCommands"
old = ""
new = "craft_ui::shell::StartRecentCommands"
status = "replaced"
note = "The recent files' context menu rows as commands (Open, Remove from Recent, Clear Recent Files, Show in Folder)."

[[type]]
name = "StartPinnedCommands"
old = ""
new = "craft_ui::shell::StartPinnedCommands"
status = "replaced"
note = "The pinned folders' context menu rows as commands (Open, Unpin)."

[[type]]
name = "ViewportWindowOutput"
old = ""
new = "craft_ui::shell::ViewportWindowOutput"
status = "replaced"
note = "Replaces `ViewportResponse`: `close_requested` is the close reason when the window asked to close."

[[type]]
name = "Hosting"
old = "craft_ui::viewport::Hosting"
new = ""
status = "removed"
note = "The dialog chooses an OS window or its fallback layer; the body does not learn which."

[[type]]
name = "ViewportResponse"
old = "craft_ui::viewport::ViewportResponse"
new = ""
status = "removed"
note = "Replaced by `ViewportWindowOutput`."

[[setter]]
type = "StartScreen"
old = "new(id_salt)"
new = "new(Bind<RecentView>, Bind<RecentSort>, &[RecentFile], &Collator)"
note = "The screen's identity comes from its place; the view, sort, files and collator are constructor arguments."

[[setter]]
type = "StartScreen"
old = "recent(&[RecentFile])"
new = "new(.., &[RecentFile], ..)"
note = "The files are a constructor argument."

[[setter]]
type = "StartScreen"
old = "view(RecentView, RecentSort)"
new = "new(Bind<RecentView>, Bind<RecentSort>, ..)"
note = "The view and sort are bindings the app owns; a change is written through them."

[[setter]]
type = "StartScreen"
old = "labels(StartLabels)"
new = ""
note = "removed: the words are the installed `StartWords`."

[[setter]]
type = "StartScreen"
old = "id_salt(impl AsIdSalt)"
new = ""
note = "removed: the screen is a pattern identified by its place."

[[setter]]
type = "StartScreen"
old = "show(&mut Ui) -> Vec<StartAction>"
new = "show(self, &mut Ui) -> StartOutput"
note = "The actions are `StartOutput.actions`."

[[setter]]
type = "ViewportWindow"
old = "new(ViewportId, ViewportBuilder)"
new = "new(title)"
note = "The title is the constructor argument. The builder's inner and minimum sizes and the opening position go on the `Overlay` given to `layer`: `Overlay::dialog().size_limits(min, max).placed(rect).resizable(true)`."

[[setter]]
type = "ViewportWindow"
old = "title(impl Into<String>)"
new = "new(title)"

[[setter]]
type = "ViewportWindow"
old = "app_modal(bool /*scrim*/)"
new = "app_modal(bool)"
note = "On by default; `app_modal(false)` is a tool window. The backdrop is the dialog's."

[[setter]]
type = "ViewportWindow"
old = "embedded(bool)"
new = ""
note = "removed: where OS windows are unavailable the fallback layer is the embedded window."

[[setter]]
type = "ViewportWindow"
old = "show(&Context, FnMut(&mut Ui, Hosting)) -> ViewportResponse"
new = "show(self, &mut Ui, FnMut(&mut Ui, &mut BodyCx)) -> ViewportWindowOutput"
