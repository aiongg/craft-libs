# API map of the "App shell and title bar" family: old path to new path and setter renames.
# Filled in by the family track; the codemods and the app scan read it.

family = "App shell and title bar"
new_module = "craft_ui::shell"

# One entry per public type: `old` is the path an app calls today, `new` the path after migration.
# `status` is "pending", "same" (path unchanged), "moved", "replaced" (use `note`) or "removed".

[[type]]
name = "AppShell"
old = "craft_ui::shell::AppShell"
new = "craft_ui::shell::AppShell"
status = "pending"

[[type]]
name = "CanvasShell"
old = "craft_ui::shell::canvas::CanvasShell"
new = "craft_ui::shell::CanvasShell"
status = "pending"

[[type]]
name = "StartScreen"
old = "craft_ui::shell::start::StartScreen"
new = "craft_ui::shell::StartScreen"
status = "pending"

[[type]]
name = "TitleBar"
old = ""
# found in: craft_ui::docking::chrome::TitleBar, craft_ui::title_bar::TitleBar
new = "craft_ui::shell::TitleBar"
status = "pending"

[[type]]
name = "ViewportWindow"
old = "craft_ui::viewport::window::ViewportWindow"
new = "craft_ui::shell::ViewportWindow"
status = "pending"

[[type]]
name = "ShellCx"
old = "craft_ui::shell::ShellCx"
new = "craft_ui::runtime::env::ShellCx"
status = "moved"
note = "Read through `BodyCx::shell() -> Option<ShellCx>`, which returns a clone; built with `ShellCx::new`, `detached` or the `with_*` builders."

[[type]]
name = "Slot"
old = "craft_ui::shell::Slot"
new = "craft_ui::shell::Slot"
status = "same"
note = "Sizes are `SlotSize` names; the label is a `Label`; `frame` is gone."

[[type]]
name = "SlotKey"
old = "craft_ui::shell::SlotKey"
new = "craft_ui::runtime::env::SlotKey"
status = "moved"

[[type]]
name = "WindowKey"
old = "craft_ui::shell::WindowKey"
new = "craft_ui::runtime::env::WindowKey"
status = "moved"

[[type]]
name = "BodyMode"
old = "craft_ui::shell::BodyMode"
new = "craft_ui::runtime::env::BodyMode"
status = "moved"

[[type]]
name = "Edge"
old = "craft_ui::shell::Edge"
new = ""
status = "replaced"
note = "`craft_ui::contract::PaneEdge` (`Center`, `Start`, `End`, `Top`, `Bottom`); the shell adds no second edge type."

# One entry per renamed, removed or reshaped setter or constructor.
# [[setter]]
# type = ""
# old = ""
# new = ""

# Window edge zones, the drag strip and the caption record (winhost cleanup).

[[type]]
name = "CaptionRegions"
old = "craft_ui::title_bar::CaptionRegions"
new = "craft_ui::shell::CaptionRegions"
status = "replaced"
note = "A trait with `button`, `drag` and `native_hit_test` methods becomes the record `CaptionRegions { buttons, edges, moves }` that `WindowHost::caption_regions(viewport)` derives from the window's exclusive parts: a bar tags its parts with `PartBuilder::exclusive(WindowHit::Caption(button))` or `WindowHit::Move`, and publishes nothing."

[[type]]
name = "Caption"
old = "craft_ui::title_bar::Caption"
new = "craft_ui::shell::Caption"
status = "moved"

[[type]]
name = "resize_zones_only"
old = "craft_ui::title_bar::resize_zones_only"
new = ""
status = "replaced"
note = "The edge zones are the body step's resize grips of a container in an OS window; there is no separate call."

[[type]]
name = "release_after_os_resize"
old = "craft_ui::title_bar::release_after_os_resize"
new = ""
status = "replaced"
note = "The runtime ends a press the operating system took over; an app installs no raw-input hook for it."

[[setter]]
type = "Slot"
old = "height(f32)"
new = "size(SlotSize)"
note = "A size is a named theme size: `SlotSize::TitleBar`, `TabBar`, `StatusBar`, `OptionsBar`, `OptionsBarNarrow`, `RailWidth` (per column; `Slot::columns(n)` says how many rail columns)."

[[setter]]
type = "Slot"
old = "width(f32)"
new = "size(SlotSize)"
note = "A size is a named theme size: `SlotSize::RailWidth` for a rail."

[[setter]]
type = "Slot"
old = "size(f32)"
new = "size(SlotSize)"
note = "No point sizes: the slot takes a named theme size."

[[setter]]
type = "Slot"
old = "frame(Frame)"
new = ""
note = "removed: the slot's container paints its own surface."

[[setter]]
type = "ShellCx"
old = "canvas(CanvasId)"
new = ""
note = "removed: the key stage asks the focused component's `KeyUse` whether Tab toggles the chrome, so a canvas registers nothing."

# Caption buttons and the caption icon theme (titlebar-b).

[[type]]
name = "CaptionButtons"
old = "craft_ui::title_bar::CaptionButtons"
new = ""
status = "removed"
note = "`CaptionButton`: one leaf per caption, shown by the title bar, which sends the window command of the click. The slot layout is `CaptionPlan`."

[[type]]
name = "CaptionButton"
old = ""
new = "craft_ui::shell::CaptionButton"
status = "replaced"
note = "`CaptionButton::new(Caption, CaptionFamily)` with `maximized(bool)`, `outermost(CaptionEnd)` and `icons(&CaptionIcons)`; the window's active state comes from the environment, and the labels are the `CaptionLabels` words."

[[type]]
name = "caption_buttons"
old = "craft_ui::title_bar::caption_buttons"
new = ""
status = "removed"
note = "Show a `CaptionButton` per caption of a `CaptionPlan`."

[[type]]
name = "caption_id"
old = "craft_ui::title_bar::caption_id"
new = ""
status = "removed"
note = "A button's id comes from the component's own id; tests find it by its `WindowHit::Caption` part in `WindowHost::caption_regions`."

[[type]]
name = "CaptionLabels"
old = "craft_ui::title_bar::CaptionLabels"
new = "craft_ui::shell::CaptionLabels"
status = "moved"
note = "The words `shell.captionMinimize`, `shell.captionMaximize`, `shell.captionRestore` and `shell.captionClose` (`window.*` before)."

[[type]]
name = "CaptionIcon"
old = "craft_ui::title_bar::CaptionIcon"
new = "craft_ui::shell::CaptionIcon"
status = "moved"

[[type]]
name = "CaptionIcons"
old = "craft_ui::title_bar::CaptionIcons"
new = "craft_ui::shell::CaptionIcons"
status = "moved"
note = "The fields are readers `theme()` and `generation()`; `CaptionIcons::new(theme, generation, render)`, `from_files` and `from_theme(name, bases, &dyn ThemeFiles)` build one."

[[type]]
name = "RenderIconFn"
old = "craft_ui::title_bar::RenderIconFn"
new = "craft_ui::shell::RenderIconFn"
status = "moved"
note = "The mask is a shared slice, `CaptionMask`."

[[type]]
name = "CaptionIconCache"
old = "craft_ui::title_bar::CaptionIconCache"
new = ""
status = "removed"
note = "The textures come from `primitives::TextureCache`; the background load of a theme is a platform service that answers `ThemeFiles` and builds `CaptionIcons`."

[[type]]
name = "caption_icon_theme"
old = "craft_ui::title_bar::caption_icon_theme"
new = "craft_ui::shell::caption_icon_theme"
status = "moved"

[[type]]
name = "CaptionFamily"
old = "craft_ui::title_bar::CaptionFamily"
new = "craft_ui::shell::CaptionFamily"
status = "moved"
note = "Re-exported from `craft_window::policy`."

[[type]]
name = "Captions"
old = "craft_ui::title_bar::Captions"
new = "craft_ui::shell::Captions"
status = "moved"
note = "Re-exported from `craft_window::policy`."

[[type]]
name = "Frame"
old = "craft_ui::title_bar::Frame"
new = "craft_ui::shell::Frame"
status = "moved"
note = "Re-exported from `craft_window::policy`."

[[type]]
name = "MacInset"
old = "craft_ui::title_bar::MacInset"
new = "craft_ui::shell::MacInset"
status = "moved"
note = "Re-exported from `craft_window::policy`."

[[type]]
name = "WINDOWS_BUTTON_WIDTH"
old = "craft_ui::title_bar::WINDOWS_BUTTON_WIDTH"
new = "craft_ui::shell::WINDOWS_BUTTON_WIDTH"
status = "moved"

[[setter]]
type = "CaptionButton"
old = "CaptionButtons::new(&Captions, &TitleBarStyle)"
new = "CaptionButton::new(Caption, CaptionFamily)"
note = "One button per caption; the family comes from the `Captions`, the look from the theme."

[[setter]]
type = "CaptionButton"
old = "window(impl Hash)"
new = ""
note = "removed: the component's id salt (`id_salt`) names the window's buttons."

[[setter]]
type = "CaptionButton"
old = "labels(&CaptionLabels)"
new = ""
note = "removed: the labels are the `CaptionLabels` words of the scope, translated with the catalog."

[[setter]]
type = "CaptionButton"
old = "icons(Option<&CaptionIcons>)"
new = "icons(&CaptionIcons)"
note = "`None` is the call left out."

[[setter]]
type = "CaptionButton"
old = "show(ui, bar)"
new = "show_at(ui, slot.rect)"
note = "The title bar shows each button at its `CaptionSlot::rect` and reads the click from the response."
