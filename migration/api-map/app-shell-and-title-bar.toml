# API map of the "App shell and title bar" family: old path to new path and setter renames.
# Filled in by the family track; the codemods and the app scan read it.

family = "App shell and title bar"
new_module = "craft_ui::shell"

# One entry per public type: `old` is the path an app calls today, `new` the path after migration.
# `status` is "pending", "same" (path unchanged), "moved", "replaced" (use `note`) or "removed".

[[type]]
name = "AppShell"
old = "craft_ui::shell::AppShell"
new = "craft_ui::shell::AppShell"
status = "pending"

[[type]]
name = "CanvasShell"
old = "craft_ui::shell::canvas::CanvasShell"
new = "craft_ui::shell::CanvasShell"
status = "pending"

[[type]]
name = "StartScreen"
old = "craft_ui::shell::start::StartScreen"
new = "craft_ui::shell::StartScreen"
status = "pending"

[[type]]
name = "TitleBar"
old = ""
# found in: craft_ui::docking::chrome::TitleBar, craft_ui::title_bar::TitleBar
new = "craft_ui::shell::TitleBar"
status = "pending"

[[type]]
name = "ViewportWindow"
old = "craft_ui::viewport::window::ViewportWindow"
new = "craft_ui::shell::ViewportWindow"
status = "pending"

# One entry per renamed, removed or reshaped setter or constructor.
# [[setter]]
# type = ""
# old = ""
# new = ""

# Window edge zones, the drag strip and the caption record (contract-window-parts).

[[type]]
name = "CaptionRegions"
old = "craft_ui::title_bar::CaptionRegions"
new = ""
status = "replaced"
note = "A trait with `button`, `drag` and `native_hit_test` methods becomes the record `craft_ui::shell::CaptionRegions`: a bar builds it with `CaptionRegions::new(drag).button(caption, rect)` and calls `publish(ui, viewport)` every pass; `WindowHost::caption_regions(viewport)` reads it."

[[type]]
name = "Caption"
old = "craft_ui::title_bar::Caption"
new = "craft_ui::shell::Caption"
status = "moved"

[[type]]
name = "resize_zones_only"
old = "craft_ui::title_bar::resize_zones_only"
new = ""
status = "replaced"
note = "`WindowEdges::new(viewport).holes(&holes).show(ui)`; `native_hit_test` is the field of the published `CaptionRegions`, and the zones leave out a maximized or full-screen window themselves."

[[type]]
name = "release_after_os_resize"
old = "craft_ui::title_bar::release_after_os_resize"
new = ""
status = "replaced"
note = "The runtime ends a press the operating system took over; an app installs no raw-input hook for it."
