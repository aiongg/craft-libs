# API map of the "App shell and title bar" family: old path to new path and setter renames.
# Filled in by the family track; the codemods and the app scan read it.

family = "App shell and title bar"
new_module = "craft_ui::shell"

# One entry per public type: `old` is the path an app calls today, `new` the path after migration.
# `status` is "pending", "same" (path unchanged), "moved", "replaced" (use `note`) or "removed".

[[type]]
name = "AppShell"
old = "craft_ui::shell::AppShell"
new = "craft_ui::shell::AppShell"
status = "same"
note = "A pattern: slots and the body are closures taking `(&mut Ui, &mut BodyCx)`, each slot is a container on `Mount::Pane`, and `show(ui)` returns `AppShellOutput`."

[[type]]
name = "CanvasShell"
old = "craft_ui::shell::CanvasShell"
new = "craft_ui::shell::CanvasShell"
status = "same"
note = "The body is set with `body(f)` and `show(ui)` returns `AppShellOutput`; the slot keys are `craft_ui::shell::slots`."

[[type]]
name = "StartScreen"
old = "craft_ui::shell::start::StartScreen"
new = "craft_ui::shell::StartScreen"
status = "pending"

[[type]]
name = "TitleBar"
old = ""
# found in: craft_ui::docking::chrome::TitleBar, craft_ui::title_bar::TitleBar
new = "craft_ui::shell::TitleBar"
status = "pending"

[[type]]
name = "ViewportWindow"
old = "craft_ui::viewport::window::ViewportWindow"
new = "craft_ui::shell::ViewportWindow"
status = "pending"

[[type]]
name = "ShellCx"
old = "craft_ui::shell::ShellCx"
new = "craft_ui::runtime::env::ShellCx"
status = "moved"
note = "Read through `BodyCx::shell() -> Option<ShellCx>`, which returns a clone; built with `ShellCx::new`, `detached` or the `with_*` builders."

[[type]]
name = "Slot"
old = "craft_ui::shell::Slot"
new = "craft_ui::shell::Slot"
status = "same"
note = "Sizes are `SlotSize` names; the label is a `Label`; `frame` is gone."

[[type]]
name = "SlotKey"
old = "craft_ui::shell::SlotKey"
new = "craft_ui::runtime::env::SlotKey"
status = "moved"

[[type]]
name = "WindowKey"
old = "craft_ui::shell::WindowKey"
new = "craft_ui::runtime::env::WindowKey"
status = "moved"

[[type]]
name = "BodyMode"
old = "craft_ui::shell::BodyMode"
new = "craft_ui::runtime::env::BodyMode"
status = "moved"

[[type]]
name = "Edge"
old = "craft_ui::shell::Edge"
new = ""
status = "replaced"
note = "`craft_ui::contract::PaneEdge` (`Center`, `Start`, `End`, `Top`, `Bottom`); the shell adds no second edge type."

# One entry per renamed, removed or reshaped setter or constructor.
# [[setter]]
# type = ""
# old = ""
# new = ""

# Window edge zones, the drag strip and the caption record (winhost cleanup).

[[type]]
name = "CaptionRegions"
old = "craft_ui::title_bar::CaptionRegions"
new = "craft_ui::shell::CaptionRegions"
status = "replaced"
note = "A trait with `button`, `drag` and `native_hit_test` methods becomes the record `CaptionRegions { buttons, edges, moves }` that `WindowHost::caption_regions(viewport)` derives from the window's exclusive parts: a bar tags its parts with `PartBuilder::exclusive(WindowHit::Caption(button))` or `WindowHit::Move`, and publishes nothing."

[[type]]
name = "Caption"
old = "craft_ui::title_bar::Caption"
new = "craft_ui::shell::Caption"
status = "moved"

[[type]]
name = "resize_zones_only"
old = "craft_ui::title_bar::resize_zones_only"
new = ""
status = "replaced"
note = "The edge zones are the body step's resize grips of a container in an OS window; there is no separate call."

[[type]]
name = "release_after_os_resize"
old = "craft_ui::title_bar::release_after_os_resize"
new = ""
status = "replaced"
note = "The runtime ends a press the operating system took over; an app installs no raw-input hook for it."

[[setter]]
type = "Slot"
old = "height(f32)"
new = "size(SlotSize)"
note = "A size is a named theme size: `SlotSize::TitleBar`, `TabBar`, `StatusBar`, `OptionsBar`, `OptionsBarNarrow`, `RailWidth` (per column; `Slot::columns(n)` says how many rail columns)."

[[setter]]
type = "Slot"
old = "width(f32)"
new = "size(SlotSize)"
note = "A size is a named theme size: `SlotSize::RailWidth` for a rail."

[[setter]]
type = "Slot"
old = "size(f32)"
new = "size(SlotSize)"
note = "No point sizes: the slot takes a named theme size."

[[setter]]
type = "Slot"
old = "frame(Frame)"
new = ""
note = "removed: the slot's container paints its own surface."

[[setter]]
type = "ShellCx"
old = "canvas(CanvasId)"
new = ""
note = "removed: the key stage asks the focused component's `KeyUse` whether Tab toggles the chrome, so a canvas registers nothing."

# App shell, canvas preset, screen modes and reveal (shell-a).

[[type]]
name = "ShellOutput"
old = "craft_ui::shell::ShellOutput"
new = ""
status = "removed"
note = "`craft_ui::shell::AppShellOutput { response, regions: ShellRegions, revealed, panels_hidden, screen_mode }`; the body closure returns nothing."

[[type]]
name = "AppShellOutput"
old = ""
new = "craft_ui::shell::AppShellOutput"
status = "replaced"
note = "Replaces `ShellOutput`; the body rect and the slot rects are `regions`."

[[type]]
name = "ScreenMode"
old = "craft_ui::shell::ScreenMode"
new = "craft_ui::shell::ScreenMode"
status = "same"
note = "Held in the `screen_mode` binding of the shell; `command_id`, `from_command_id` and `menu_entries` are gone: the modes are `ScreenModeCommand` and the View menu lists those commands."

[[type]]
name = "ScreenModeCommand"
old = ""
new = "craft_ui::shell::ScreenModeCommand"
status = "replaced"
note = "Replaces `ScreenMode::command_id`, `CYCLE_COMMAND` and `ScreenModeLabels`: the window-scope commands `view.screenMode.standard`, `.full_screen_with_menu_bar` (alias `.fullScreenWithMenuBar`), `.full_screen` (alias `.fullScreen`), `.cycle` (F) and `.cycle_back` (Shift+F)."

[[type]]
name = "ScreenModeLabels"
old = "craft_ui::shell::ScreenModeLabels"
new = ""
status = "removed"
note = "The command labels of `ScreenModeCommand`."

[[type]]
name = "full_screen_commands"
old = "craft_ui::shell::full_screen_commands"
new = ""
status = "removed"
note = "The shell carries out a screen-mode change itself through `WindowHost::act`; `FullScreenPlan` holds the Windows keep-apart steps."

[[type]]
name = "FullScreenPlan"
old = ""
new = "craft_ui::shell::FullScreenPlan"
status = "replaced"
note = "Replaces `full_screen_commands`: the steps that bring a window to full screen or back, one `WindowAction` per pass."

[[type]]
name = "CYCLE_COMMAND"
old = "craft_ui::shell::CYCLE_COMMAND"
new = ""
status = "removed"
note = "`ScreenModeCommand::Cycle`."

[[type]]
name = "CanvasLabels"
old = "craft_ui::shell::CanvasLabels"
new = ""
status = "removed"
note = "The region names are words of the shell (`AppShellWords`); a slot takes its own name with `Slot::label`."

[[type]]
name = "AppShellWords"
old = ""
new = "craft_ui::shell::AppShellWords"
status = "replaced"
note = "Replaces `CanvasLabels`: the names of the shell's regions as words."

[[type]]
name = "CanvasOutput"
old = "craft_ui::shell::CanvasOutput"
new = ""
status = "removed"
note = "`craft_ui::shell::CanvasPanelOutput { response, rail, tabs, document }`."

[[type]]
name = "CanvasPanelOutput"
old = ""
new = "craft_ui::shell::CanvasPanelOutput"
status = "replaced"
note = "Replaces `CanvasOutput`."

[[type]]
name = "PanelOptions"
old = "craft_ui::shell::PanelOptions"
new = ""
status = "removed"
note = "`craft_ui::shell::CanvasPanel`: `rail(label, f)`, `tabs(f)` and `opening(bool)`; the rail and tabs are filled with `rails::PanelRail` and `tabs::DocumentTabs`."

[[type]]
name = "CanvasPanel"
old = ""
new = "craft_ui::shell::CanvasPanel"
status = "replaced"
note = "Replaces `ShellCx::canvas_panel` and `canvas_panel_with` with `PanelOptions`."

[[type]]
name = "PanelRail"
old = "craft_ui::shell::PanelRail"
new = ""
status = "removed"
note = "The shell's own rail configuration; use `craft_ui::rails::PanelRail` inside `CanvasPanel::rail`."

[[type]]
name = "tab_toggles_chrome"
old = "craft_ui::shell::tab_toggles_chrome"
new = ""
status = "removed"
note = "The key stage decides it (`RootEnv.tab_toggles_chrome` and the canvas marker `KeyUse::chrome_key`)."

[[type]]
name = "take_tab_toggle"
old = "craft_ui::shell::take_tab_toggle"
new = ""
status = "removed"
note = "No raw-input hook: the key stage writes `FrameOutput.chrome_toggles`; pass `craft_ui::shell::chrome_toggles(ctx, &output)` to `AppShell::chrome_toggles`."

[[type]]
name = "chrome_toggles"
old = ""
new = "craft_ui::shell::chrome_toggles"
status = "replaced"
note = "Replaces `take_tab_toggle`: the toggles of a frame, with menu and palette fires of the chrome commands mapped to the focused window."

[[setter]]
type = "AppShell"
old = "title(Slot, f)"
new = "title(Slot, f) or title_bar(f)"
note = "The closures take `(&mut Ui, &mut BodyCx)`."

[[setter]]
type = "AppShell"
old = "body_mode(BodyMode)"
new = "screen_mode(Bind<ScreenMode>)"
note = "The body mode follows the screen mode; a window that hides its chrome has `ScreenMode::FullScreen`."

[[setter]]
type = "AppShell"
old = "backdrop(Option<Color32>)"
new = ""
note = "The body paints the theme's canvas surface, and the scrim in body-only mode."

[[setter]]
type = "AppShell"
old = "show(ui, body)"
new = "body(f).show(ui)"
note = "The body closure is set with `body`; the shell data is `BodyCx::shell()`."

[[setter]]
type = "AppShell"
old = "toggle_reveal(ctx, window)"
new = "chrome_toggles(&[(ViewportId, ChromeToggle)])"
note = "The reveal toggles follow `FrameOutput.chrome_toggles`; `clear_reveal` and `reveal_active` are gone (a screen-mode change ends a reveal)."

[[setter]]
type = "CanvasShell"
old = "labels(CanvasLabels)"
new = ""
note = "The regions are named by `AppShellWords`."
