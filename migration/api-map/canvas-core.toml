# API map of the "Canvas core" family: old path to new path and setter renames.
# Filled in by the family track; the codemods and the app scan read it.

family = "Canvas core"
new_module = "craft_ui::canvas"

# One entry per public type: `old` is the path an app calls today, `new` the path after migration.
# `status` is "pending", "same" (path unchanged), "moved", "replaced" (use `note`) or "removed".

[[type]]
name = "ToolHost"
old = "craft_ui::canvas::tool_host::ToolHost"
new = "craft_ui::canvas::ToolHost"
status = "pending"

[[type]]
name = "Pasteboard"
old = "craft_ui::canvas::pasteboard::Pasteboard"
new = "craft_ui::canvas::Pasteboard"
status = "pending"

[[type]]
name = "SplitViews"
old = "craft_ui::canvas::split::SplitViews"
new = "craft_ui::canvas::SplitViews"
status = "pending"

[[type]]
name = "Rulers"
old = "craft_ui::canvas::rulers::Rulers"
new = "craft_ui::canvas::Rulers"
status = "pending"

[[type]]
name = "Navigator"
old = "craft_ui::canvas::navigator::preview::Navigator"
new = "craft_ui::canvas::Navigator"
status = "pending"

[[type]]
name = "PaintedCursor"
old = "craft_ui::canvas::cursor::ToolCursor"
new = "craft_behavior::PaintedCursor"
status = "replaced"
note = "A cursor request is data: `cx.cursor(PaintedCursor::..)` through the cursor service, painted by the overlay host on the ghost layer. `ToolCursor::Circle/Crosshair/Outline/Hand/Zoom/Tool/Badged` are `PaintedCursor::circle/Crosshair/outline/Hand/zoom/tool/badged`; `turn_cursor`, `distort_cursor` and `skew_cursor` are `PaintedCursor::turn(toward)`, `distort(dir)` and `skew(dir)` with screen directions (no `CanvasView` or `PointerInk`). The crosshair and the brush outline are painted, not uploaded as OS bitmaps. `CursorOptions` and `CursorHost` are gone; an app decides which cursor to request."

[[type]]
name = "readout"
old = "craft_ui::canvas::readout::Readout"
new = "craft_ui::canvas::readout"
status = "replaced"
note = "A function called each pass of a gesture: `canvas::readout(cx, pointer, &[(Label, String)])` paints the rows beside the pointer on the ghost layer. `Readout::new`, `ReadoutStyle` and `ReadoutLayout` are gone; the look comes from the tokens."

[[type]]
name = "marching_ants"
old = "craft_ui::canvas::marquee::ants::Ants"
new = "craft_ui::primitives::marching_ants"
status = "replaced"
note = "The one pixel-aligned painter: `marching_ants(tokens, points, closed, phase, clip, pixels_per_point)`, or `ContentPainterCx::marching_ants`. `phase` is in points along the path; `Ants::new(ppp, time, ..)` and `draw` are gone."

