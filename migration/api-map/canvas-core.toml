# API map of the "Canvas core" family: old path to new path and setter renames.
# Filled in by the family track; the codemods and the app scan read it.

family = "Canvas core"
new_module = "craft_ui::canvas"

# One entry per public type: `old` is the path an app calls today, `new` the path after migration.
# `status` is "pending", "same" (path unchanged), "moved", "replaced" (use `note`) or "removed".

[[type]]
name = "ToolHost"
old = "craft_ui::canvas::tool_host::ToolHost"
new = "craft_ui::canvas::ToolHost"
status = "moved"
note = "`ToolHost::new().run(ui, &canvas_output, &mut tool)` after `Canvas::show`; `ToolHost::new(CanvasId)`, `snap(..)`, `document(..)`, `pen(..)`, `navigation(..)` and `keys(..)` are gone. The host reads the canvas's space from `CanvasOutput::space` (no `capture_values`), keys its state by the canvas's id (`CanvasOutput::response.id`) and paints the tool's readout in `run`. `inject`, `cancel` and `in_gesture` take that canvas id (an `egui::Id`) in place of a `CanvasId`; `cancel` returns whether a gesture was cancelled. `enabled(false)` leaves the open press spent. `ToolHost::sample` and `snap_tolerance` are gone: a tool maps points through `CanvasSpace` and holds its own snap targets."

[[type]]
name = "CanvasTool"
old = "craft_ui::canvas::tool_host::CanvasTool"
new = "craft_ui::canvas::CanvasTool"
status = "moved"
note = "The trait keeps `press`, `drag`, `release`, `hover`, `cancel`, `key`, `paint`, `cursor`, `takes`, `autoscrolls` and `each_pass`, and adds `command_form() -> ToolPath`. Pointers are screen points (`ToolPointer::pos`); `paint` takes `&Draw`; `cursor` returns `craft_behavior::Cursor`. `parts`, `picked`, `pick`, `node`, `snap_gesture` and `button` are gone: a tool made of parts is a canvas control, a tool holds its snap targets, and `takes` decides the button."

[[type]]
name = "ToolPointer"
old = "craft_ui::canvas::tool_host::ToolPointer"
new = "craft_ui::canvas::ToolPointer"
status = "moved"
note = "Screen position only (`pos`): `doc`, `raw`, `snapped` and `screen` are gone; `modifiers` is `mods: Mods`; the pen reading is `sample: PointerSample` (radians); `button` and `clicks` stay; `time` is the time of the pass that took the sample (the press keeps its press time)."

[[type]]
name = "ToolKey"
old = "craft_ui::canvas::tool_host::ToolKey"
new = "craft_ui::canvas::ToolKey"
status = "moved"
note = "An enum of the intents the canvas holds (`Nudge`, `Delete`, `Submit`, `Cancel`) and the plain keys a tool kept with `ToolContext::keep_keys` (`Kept(Chord)`); the raw `key`, `modifiers`, `pressed` and `repeat` fields are gone."

[[type]]
name = "ToolContext"
old = "craft_ui::canvas::tool_host::ToolContext"
new = "craft_ui::canvas::ToolContext"
status = "moved"
note = "`pointer`, `mods` (was `modifiers`), `rect` and `time`; `space() -> Option<CanvasSpace>` is the canvas's view; `held(Key) -> bool` says whether a key is down; `readout(rows)`, `request_repaint()` and `keep_keys()` stay. `canvas_id`, `view`, `canvas`, `snap`, `snap_tolerance`, `tokens`, `numbers`, `direction`, `caps_lock`, `parts_focused`, `set_view` and `set_cursor` are gone."

[[type]]
name = "ToolAction"
old = "craft_ui::canvas::tool_host::ToolAction"
new = "craft_ui::canvas::ToolAction"
status = "moved"
note = "The variants are unchanged."

[[type]]
name = "ToolHostResponse"
old = "craft_ui::canvas::tool_host::ToolHostResponse"
new = "craft_ui::canvas::ToolHostResponse"
status = "moved"
note = "`gesture` is `Option<GesturePhase>`; `scrolled_by` and `view` are gone (the host moves no view): `past_edge` reports the pointer past the canvas edge; `cursor` is `Option<Cursor>`; `readout` is new data for automation (the host paints it); `id` is gone."

[[type]]
name = "ToolInput"
old = "craft_ui::canvas::tool_host::ToolInput"
new = "craft_ui::canvas::ToolInput"
status = "moved"
note = "Positions are screen points (`pos`), the pen reading is `sample: PointerSample`, and `modifiers` is `mods: Mods`."

[[type]]
name = "ToolGesture"
old = "craft_ui::canvas::tool_host::ToolGesture"
new = ""
status = "removed"
note = "Replaced by `craft_behavior::GesturePhase` (`Begin`, `Update`, `Commit`, `Cancel`)."

[[type]]
name = "ToolParts"
old = "craft_ui::canvas::tool_host::ToolParts"
new = ""
status = "removed"
note = "A tool made of keyboard parts is a canvas control with focusable parts."

[[type]]
name = "ToolNode"
old = "craft_ui::canvas::tool_host::ToolNode"
new = ""
status = "removed"
note = "A tool's accessible description is a canvas control's part or node."

[[type]]
name = "PickStep"
old = ""
new = "craft_ui::canvas::PickStep"
status = "replaced"
note = "`ToolRail::pick_by_key` letter cycling is `tool_pick(tools, slot, current, &last_used, PickStep::Last | PickStep::Next, enabled)`: the app binds a pick command to the letter and a cycle command to Shift with the letter."

[[type]]
name = "ToolReadout"
old = ""
new = "craft_ui::canvas::ToolReadout"
status = "replaced"
note = "The values a tool hands to `ToolContext::readout`, reported in `ToolHostResponse::readout` for the canvas readout overlay."

[[type]]
name = "Pasteboard"
old = "craft_ui::canvas::pasteboard::Pasteboard"
new = "craft_ui::canvas::Pasteboard"
status = "pending"

[[type]]
name = "SplitViews"
old = "craft_ui::canvas::split::SplitViews"
new = "craft_ui::canvas::SplitViews"
status = "pending"

[[type]]
name = "Rulers"
old = "craft_ui::canvas::rulers::Rulers"
new = "craft_ui::canvas::Rulers"
status = "moved"
note = "A canvas control: `Rulers::new(label, &RulerText, &RulerText, Bind::bound(&mut zero))` shown with `show_at(ui, body.rect)` inside the `Canvas` body, over a `Canvas::view`. The strips and the corner are parts at handle priority, so a drag from a strip reaches the rulers and not the canvas tool. The output is `RulerOutput`."

[[type]]
name = "RulerStyle"
old = "craft_ui::canvas::rulers::RulerStyle"
new = ""
status = "removed"
note = "`RulersStyle` is the component style; it comes from the tokens and is not built by callers."

[[type]]
name = "RulersStyle"
old = ""
new = "craft_ui::canvas::RulersStyle"
status = "replaced"
note = "The style type of `Rulers`; callers do not build it."

[[type]]
name = "RulersResponse"
old = "craft_ui::canvas::rulers::RulersResponse"
new = ""
status = "removed"
note = "`RulerOutput` replaces it: `origin` is `zero: EditResponse<Point>`, `reset_origin` is `reset_zero`, `id` is gone (the zero point is a `Bind`, and the host commands are `RulerCommands`), `context` and `unit_picked` stay."

[[type]]
name = "RulerOutput"
old = ""
new = "craft_ui::canvas::RulerOutput"
status = "replaced"
note = "`RulerOutput { zero: EditResponse<Point>, guide: Option<GuideDrag>, reset_zero, unit_picked: Option<UnitKind>, context: Option<RulerPart> }` with `content_rect()`. `guide` is the guide a drag from a strip is placing in this pass; the app forwards it to the guides control."

[[type]]
name = "RulerPart"
old = "craft_ui::canvas::rulers::RulerPart"
new = "craft_ui::canvas::RulerPart"
status = "moved"
note = "Now `#[non_exhaustive]`."

[[type]]
name = "RulerNames"
old = "craft_ui::canvas::rulers::RulerNames"
new = ""
status = "removed"
note = "The accessible names are words (`canvas.rulerHorizontal`, `canvas.rulerVertical`, `canvas.rulerOrigin`); a host translates them with its word sets."

[[type]]
name = "RulerTick"
old = "craft_ui::canvas::rulers::RulerTick"
new = "craft_ui::canvas::RulerTick"
status = "moved"
note = "`RulerTick { value, major, step }`: the label text is written at paint time from `RulerText::tick_label`, and the mid-length tick is gone (`primitives::ticks` draws a minor and a major length)."

[[type]]
name = "TickRule"
old = "craft_ui::canvas::rulers::TickRule"
new = "craft_ui::canvas::TickRule"
status = "moved"
note = "Now `#[non_exhaustive]`; `Rulers::ticks(&RulerUnits, TickRule, zoom, values)` takes no style."

[[type]]
name = "INCH_SIXTEENTHS"
old = "craft_ui::canvas::rulers::INCH_SIXTEENTHS"
new = "craft_ui::canvas::INCH_SIXTEENTHS"
status = "moved"

[[type]]
name = "INCH_EIGHTHS"
old = "craft_ui::canvas::rulers::INCH_EIGHTHS"
new = "craft_ui::canvas::INCH_EIGHTHS"
status = "moved"

[[type]]
name = "unit_entries"
old = "craft_ui::canvas::rulers::unit_entries"
new = ""
status = "removed"
note = "The units menu is built inside `Rulers` over an `Entry<UnitKind>` list; pass the kinds with `Rulers::units(&[UnitKind])`."

[[type]]
name = "RulerCommands"
old = ""
new = "craft_ui::canvas::RulerCommands"
status = "replaced"
note = "The unit choice and Reset Zero Point as app commands (`canvas.rulers.unit_pixels`, `canvas.rulers.reset_zero`, ...); the menu rows and a menu bar offer the same actions."

[[type]]
name = "RulerMargins"
old = ""
new = "craft_ui::canvas::RulerMargins"
status = "replaced"
note = "The margin bands of the two strips, `RulerMargins::new(horizontal, vertical)`, set with `Rulers::margins`."

[[type]]
name = "ZeroSnap"
old = ""
new = "craft_ui::canvas::ZeroSnap"
status = "replaced"
note = "The app's snapping of the zero point; `Rulers::snap(|axis, value, mods| ..)` builds it."

[[type]]
name = "CanvasScrollbars"
old = "craft_ui::canvas::scrollbars::CanvasScrollbars"
new = "craft_ui::canvas::CanvasScrollbars"
status = "moved"
note = "A canvas control: `CanvasScrollbars::new(label, Bind::bound(&mut view), document)` shown with `show_at(ui, view_rect)` inside the `Canvas` body. The thumb drag and the page press run in the pipeline (`PartsCx::scroll`); the output is `ScrollbarsOutput`."

[[type]]
name = "ScrollbarStyle"
old = "craft_ui::canvas::scrollbars::ScrollbarStyle"
new = ""
status = "removed"
note = "`ScrollbarsStyle` is the component style; it comes from the tokens and is not built by callers."

[[type]]
name = "ScrollbarsStyle"
old = ""
new = "craft_ui::canvas::ScrollbarsStyle"
status = "replaced"
note = "The style type of `CanvasScrollbars`; callers do not build it."

[[type]]
name = "ScrollbarNames"
old = "craft_ui::canvas::scrollbars::ScrollbarNames"
new = ""
status = "removed"
note = "The accessible names are words (`canvas.scrollHorizontal`, `canvas.scrollVertical`)."

[[type]]
name = "ScrollbarsResponse"
old = "craft_ui::canvas::scrollbars::ScrollbarsResponse"
new = ""
status = "removed"
note = "`ScrollbarsOutput` replaces it: `changed` is read from `view.event`, `over` stays."

[[type]]
name = "ScrollbarsOutput"
old = ""
new = "craft_ui::canvas::ScrollbarsOutput"
status = "replaced"
note = "`ScrollbarsOutput { view: EditResponse<CanvasView>, over: bool }`."

[[type]]
name = "Navigator"
old = "craft_ui::canvas::navigator::preview::Navigator"
new = "craft_ui::canvas::Navigator"
status = "pending"

[[type]]
name = "CanvasView"
old = "craft_ui::canvas::view::CanvasView"
new = "craft_behavior::CanvasView"
status = "moved"

[[type]]
name = "ZoomLadder"
old = "craft_ui::canvas::zoom::ZoomLadder"
new = "craft_behavior::ZoomLadder"
status = "moved"

[[type]]
name = "ViewHistory"
old = "craft_ui::canvas::view_history::ViewHistory"
new = "craft_behavior::ViewHistory"
status = "moved"

[[type]]
name = "ViewPlace"
old = "craft_ui::canvas::view_history::ViewPlace"
new = "craft_behavior::ViewPlace"
status = "moved"

[[type]]
name = "RulerUnits"
old = "craft_ui::canvas::units::RulerUnits"
new = "craft_behavior::RulerUnits"
status = "replaced"
note = "The tick maths is craft_behavior::RulerUnits; the text of a distance or tick is craft_ui::canvas::RulerText over Env::units. The legacy numbers and unit fields are gone."

[[type]]
name = "Guide"
old = "craft_ui::canvas::guides::Guide"
new = "craft_ui::canvas::Guide"
status = "replaced"
note = "key is a GuideKey, the orientation is `along: craft_behavior::Axis` (the axis the guide runs along: `Axis::X` for a horizontal guide), span is Option<(f64, f64)> and color an Option<craft_theme::Rgba>."

[[type]]
name = "TextureCache"
old = "craft_ui::canvas::textures::TextureCache"
new = ""
status = "removed"
note = "The legacy keyed texture cache is `craft_ui::primitives::TextureStore<K>`; `craft_ui::primitives::TextureCache` is the icon path and keeps its own name. `TextureCacheOptions` is `TextureStoreOptions` (`thumbnails()`, `pages()`, `frames()`; `.filter(..)`, `.budget(..)`, `TextureBudget::new(max_bytes, max_entries)`). `Revision(n)` is `Revision::new(n)`. The store methods take the `Context` (`state`, `put`, `put_region`, `get_or_put`, `put_empty`, `put_failure`, `forget`, `retain`, `clear`, `statistics`); `put_failure` takes a `LoadFailure` instead of a message; `CachedTexture::size` is a `craft_behavior::PixelSize` and `sized()` gives the `SizedTexture` of `PreviewPane`."

[[type]]
name = "TextureStore"
old = ""
new = "craft_ui::primitives::TextureStore"
status = "replaced"
note = "Replaces the legacy keyed `canvas::textures::TextureCache<K>`; see that entry. Its state lives in runtime memory of the context under the salt."

[[type]]
name = "TextureLoader"
old = "craft_ui::canvas::textures::TextureLoader"
new = "craft_ui::primitives::TextureLoader"
status = "moved"
note = "Same methods (`in_context`, `cache`, `request`, `ask`, `submit`, `shutdown`) over `TextureStore`. `LoaderOptions::new().store(..).lanes(..).jobs(..)` replaces the struct literal; `LoadFailure` is stored in the state and worded at run time with `LoadFailure::text(&cx.words::<TextureWords>())`; the `LoadFailureLabels` words are `TextureWords`."

[[type]]
name = "RasterSource"
old = "craft_ui::canvas::raster::RasterSource"
new = "craft_ui::canvas::RasterSource"
status = "moved"
note = "Same methods, with `size() -> craft_behavior::PixelSize` and `revision() -> craft_ui::primitives::Revision` (`Revision::new(n)`) in place of `[u32; 2]` and `u64`; `read(region, factor, out)` is unchanged; `PixelRect` moved with it to `craft_ui::canvas::PixelRect`, built with `PixelRect::new` (`#[non_exhaustive]`). `PixelRect::visible(&CanvasView, size)` is not here: canvas-raster-a writes it over the new `CanvasView`."

[[type]]
name = "PixelRect"
old = "craft_ui::canvas::raster::PixelRect"
new = "craft_ui::canvas::PixelRect"
status = "moved"
note = "See `RasterSource`. `PixelRect::of_size` takes a `PixelSize`."

[[type]]
name = "PaintedCursor"
old = "craft_ui::canvas::cursor::ToolCursor"
new = "craft_behavior::PaintedCursor"
status = "replaced"
note = "A cursor request is data: `cx.cursor(PaintedCursor::..)` through the cursor service, painted by the overlay host on the ghost layer. `ToolCursor::Circle/Crosshair/Outline/Hand/Zoom/Tool/Badged` are `PaintedCursor::circle/Crosshair/outline/Hand/zoom/tool/badged`; `turn_cursor`, `distort_cursor` and `skew_cursor` are `PaintedCursor::turn(toward)`, `distort(dir)` and `skew(dir)` with screen directions (no `CanvasView` or `PointerInk`). The crosshair and the brush outline are painted, not uploaded as OS bitmaps. `CursorOptions` and `CursorHost` are gone; an app decides which cursor to request."

[[type]]
name = "readout"
old = "craft_ui::canvas::readout::Readout"
new = "craft_ui::canvas::readout"
status = "replaced"
note = "A function called each pass of a gesture: `canvas::readout(cx, pointer, &[(Label, String)])` paints the rows beside the pointer on the ghost layer. `Readout::new`, `ReadoutStyle` and `ReadoutLayout` are gone; the look comes from the tokens."

[[type]]
name = "marching_ants"
old = "craft_ui::canvas::marquee::ants::Ants"
new = "craft_ui::primitives::marching_ants"
status = "replaced"
note = "The one pixel-aligned painter: `marching_ants(tokens, points, closed, phase, clip, pixels_per_point)`, or `ContentPainterCx::marching_ants`. `phase` is in points along the path; `Ants::new(ppp, time, ..)` and `draw` are gone."

# One entry per renamed, removed or reshaped setter or constructor.
# [[setter]]
# type = ""
# old = ""
# new = ""

[[setter]]
type = "Rulers"
old = "Rulers::new(id_salt, x, y, names)"
new = "Rulers::new(label, x, y, Bind::bound(&mut zero))"
note = "`x` and `y` are `&RulerText` (units with their `UnitKind`); the zero point is the bound value, so the `zero(Point)` setter is gone."

[[setter]]
type = "Rulers"
old = "margins(horizontal, vertical)"
new = "margins(RulerMargins::new(horizontal, vertical))"

[[setter]]
type = "Rulers"
old = "snap(|Orientation, f64, Modifiers| ..)"
new = "snap(|Axis, f64, Mods| ..)"
note = "The axis is the one a guide at the coordinate would run along: the x coordinate is `Axis::Y`."

[[setter]]
type = "Rulers"
old = "units_menu(units, current)"
new = "units(&[UnitKind])"
note = "The checked unit is the top ruler's `RulerText::kind`."

[[setter]]
type = "Rulers"
old = "policy(EditPolicy)"
new = ""
note = "Removed: the zero point is a `Bind` and its gesture is the pipeline's."

[[setter]]
type = "Rulers"
old = "show(ui, full, view, guides)"
new = "show_at(ui, body.rect)"
note = "Inside the `Canvas` body; the view comes from `Canvas::view`. The guides are forwarded from `RulerOutput::guide`."

[[setter]]
type = "Rulers"
old = "reset_zero(ctx, id)"
new = "RulerCommands::ResetZero"
note = "The app handles the command and puts the zero point back; `RulerOutput::reset_zero` reports the corner's double click and the menu row."

[[setter]]
type = "Rulers"
old = "set_zero(ctx, id, point)"
new = ""
note = "Removed: the app writes the bound zero point."

[[setter]]
type = "Rulers"
old = "ticks(units, rule, style, zoom, values)"
new = "ticks(units, rule, zoom, values)"

[[setter]]
type = "CanvasScrollbars"
old = "CanvasScrollbars::new(id_salt, names)"
new = "CanvasScrollbars::new(label, Bind::bound(&mut view), document)"

[[setter]]
type = "CanvasScrollbars"
old = "show(ui, &mut view, doc)"
new = "show_at(ui, view_rect)"
note = "Inside the `Canvas` body."
