# API map of the "Choice and toggles" family: old path to new path and setter renames.
# Filled in by the family track; the codemods and the app scan read it.

family = "Choice and toggles"
new_module = "craft_ui::choice"

# One entry per public type: `old` is the path an app calls today, `new` the path after migration.
# `status` is "pending", "same" (path unchanged), "moved", "replaced" (use `note`) or "removed".

[[type]]
name = "Checkbox"
old = "craft_ui::controls::checkbox::Checkbox"
new = "craft_ui::choice::Checkbox"
status = "pending"

[[type]]
name = "Switch"
old = "craft_ui::controls::switch::Switch"
new = "craft_ui::choice::Switch"
status = "pending"

[[type]]
name = "RadioGroup"
old = "craft_ui::controls::radio::RadioGroup"
new = "craft_ui::choice::RadioGroup"
status = "pending"

[[type]]
name = "Segmented"
old = "craft_ui::controls::segmented::Segmented"
new = "craft_ui::choice::Segmented"
status = "pending"

[[type]]
name = "Rating"
old = "craft_ui::controls::rating::Rating"
new = "craft_ui::choice::Rating"
status = "pending"

# One entry per renamed, removed or reshaped setter or constructor.
# [[setter]]
# type = ""
# old = ""
# new = ""
