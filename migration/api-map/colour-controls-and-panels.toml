new = "craft_color::ui::SamplerOptions"
status = "replaced"
note = "A pattern shown inside the options `Bar`: `SamplerOptions::new(count).show(ui)` returns `clear_all`."

[[type]]
name = "MAX_SAMPLERS"
old = "craft_color::ui::MAX_SAMPLERS"
new = "craft_color::ui::MAX_SAMPLERS"
status = "same"
note = "Unchanged."

[[type]]
name = "SAMPLER_HIT"
old = "craft_color::ui::SAMPLER_HIT"
new = "craft_color::ui::ColorSamplerTool"
status = "removed"
note = "The hit reach is private to the tool."

[[type]]
name = "ScreenColorPicker"
old = "craft_color::ui::ScreenColorPicker"
new = "craft_color::ui::ScreenPick"
status = "replaced"
note = "The state is the app's `ScreenPick`; the capture windows (`ScreenColorPicker`) are left to the crate finisher."

[[type]]
name = "ScreenPickerLabels"
old = "craft_color::ui::ScreenPickerLabels"
