[[setter]]
type = "ScreenColorPicker"
old = "ScreenColorPicker::{open, tick, tick_with, show, showing, busy, cancel, take, take_notice, set_monitor, available, button, hold_drag}"
new = "ScreenPick::{start, tick, tick_with, busy, cancel, take, take_notice, set_monitor, available, hold}"

[[setter]]
type = "DropperState"
old = "DropperState::{arm, disarm, armed, deliver, take}"
new = "EyedropperRequest through HostRequests"

[[setter]]
type = "DropperTool"
old = "DropperTool::{show_free, sample_at}"
new = "tool_host.run with DropperTool; take()"

[[setter]]
type = "ColorSamplers"
old = "ColorSamplers::paint"
new = "ColorSamplerMarks::new(label, &samplers)"

[[setter]]
type = "ColorSamplerTool"
old = "ColorSamplerTool::take_error(ctx)"
