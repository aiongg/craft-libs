# API changes that are not tied to one family: calls every migrated caller meets.
# The codemods read this file beside the family files.
# A `[[call]]` entry's `old` and `new` are Rust expressions (`_` stands for any expression); `new` is empty for a removed call.

[[call]]
old = "|ui| { .. }"
new = "|ui, cx| { .. }"
note = "Body and item closures take the context as a second argument."

[[call]]
old = "Tokens::of(ui)"
new = ""
note = "Removed: a component reads tokens through its style function."

[[call]]
old = "Host::of(ui)"
new = "cx.env.host()"
note = "The host is read from the env view of the context; the result is an Option."

[[call]]
old = "craft_ui::docking::DropTarget"
new = "craft_ui::docking::DockDrop"
note = "The app-built struct is renamed."

[[call]]
old = "_.label(_)"
new = "Props::label(_, label)"
note = "A component's own label setter is the Props setter that writes Common.label; containers hold only its kind and layout."

[[token]]
old = "space.pad.panel"
new = ""
note = "Waits for cut-over; see the cut-over list."

[[token]]
old = "space.pad.dialog"
new = ""
note = "Waits for cut-over."

[[token]]
old = "pad.bar"
new = ""
note = "Waits for cut-over."

[[token]]
old = "radius.popup"
new = ""
note = "Waits for cut-over."

[[token]]
old = "radius.panel"
new = ""
note = "Waits for cut-over."

[[type]]
name = "Tone"
old = "craft_theme::Tone"
new = "craft_theme::variant::Tone"
status = "moved"

[[call]]
old = "commands::resolve(ctx, _)"
new = "cx.resolve_command(_)"
note = "`Commands::resolve_command` resolves a command with the scoped bindings above any of `Cx`, `BodyCx` and `ItemCx`; `commands::resolve` knows no scopes."

[[call]]
old = "BindMut::get / BindMut::apply (crate-private)"
new = "bind.reborrow().read(cx) / bind.reborrow().write(cx, &event)"
note = "A pattern reads and writes a caller `Bind` from a body or item context; `Bind::kept()` values live under the context's base id."

[[call]]
old = "dates_of(host)"
new = "Env::dates()"
note = "The scope's `Arc<DateFormat>`: the host's, else the system region's, held by the env."

[[call]]
old = "DatePicker::today(date)"
new = "RootEnv::today(date)"
note = "Read back with `Env::today()`. The host gives today's `CalendarDate` in its time zone; the runtime reads no wall clock."

[[call]]
old = "UnitKind::Pixels"
new = "UnitKind::PixelsPerInch"
note = "Also `UnitKind::PixelsPerCentimetre` and `UnitKind::Minutes`. New `UnitKind` variants with translated unit words."

[[call]]
old = "CommandInput::new(command).state(state)"
new = "Fixture::command_state(command, state)"
note = "Gives an app-scope command a state in every following pass of a fixture."
