# canvas-controls-a: Guides and SmartGuides
[[type]]
name = "GuideLine"
old = "craft_ui::canvas::guides::GuideLine"
new = "craft_ui::canvas::GuideLine"
status = "moved"

[[type]]
name = "GuidePlace"
old = "craft_ui::canvas::guides::GuidePlace"
new = ""
status = "removed"
note = "A guide drag is `Vec<Guide>` edit events of `GuidesOutput::edit`; a guide dragged out of a ruler is `craft_ui::canvas::GuideDrag`. A removed guide is a vector without it."

[[type]]
name = "GuidesResponse"
old = "craft_ui::canvas::guides::GuidesResponse"
new = ""
status = "removed"
note = "Replaced by `GuidesOutput`."

[[type]]
name = "GuidesOutput"
old = ""
new = "craft_ui::canvas_controls::GuidesOutput"
status = "replaced"
note = "Legacy `GuidesResponse`: `edit: EditResponse<Vec<Guide>>` replaces `event`; `select`, `clicked` (with `craft_keymap::Mods` and a document point), `double_clicked` and `context` carry over with `GuideKey`; `id`, `claimed` and `hovered` are gone because a press on a guide never reaches the tool."

[[type]]
name = "GuideNames"
old = "craft_ui::canvas::guides::GuideNames"
new = ""
status = "removed"
note = "The accessible names are the words of `GuideWords`."

[[type]]
name = "GuideWords"
old = ""
new = "craft_ui::canvas_controls::GuideWords"
status = "replaced"
note = "Legacy `GuideNames`: the vertical and horizontal guide names and the X and Y readout labels."

[[type]]
name = "Orientation"
old = "craft_ui::canvas::guides::Orientation"
new = ""
status = "removed"
note = "`Guide::along: craft_behavior::Axis` is the axis the guide runs along: a vertical guide is `Axis::Y`, a horizontal one `Axis::X`. `flipped`, `across` and `position` are `craft_behavior::geometry::{across_axis, motion_across, coordinate_across}`."

[[type]]
name = "GuideStyle"
old = "craft_ui::style::guide::GuideStyle"
new = "craft_ui::canvas_controls::GuideStyle"
status = "replaced"
note = "A component style built from the tokens in `Guides`' style hook; its fields are private. `Guides::style(&tokens)` is gone."

[[type]]
name = "GuideCommands"
old = ""
new = "craft_ui::canvas_controls::GuideCommands"
status = "replaced"
note = "App commands `canvas.guides.{new, clear, delete, lock, unlock}` and `GuideCommands::apply(&mut Vec<Guide>, selected)`. Legacy `Guides::request_delete` is `GuideCommands::Delete`."

[[type]]
name = "GuideSnap"
old = ""
new = "craft_ui::canvas_controls::GuideSnap"
status = "replaced"
note = "The named closure type of `Guides::snap`; the setter takes the closure."

[[type]]
name = "GuideHost"
old = "craft_ui::canvas::guides::GuideHost"
new = ""
status = "removed"
note = "A story helper of the legacy module."

[[type]]
name = "SmartGuides"
old = "craft_ui::canvas::guides::SmartGuides"
new = "craft_ui::canvas_controls::SmartGuides"
status = "moved"
note = "A canvas control with no parts, shown with `show_at(ui, body.rect)` in a `Canvas` body that has a view."

[[type]]
name = "SmartLine"
old = "craft_ui::canvas::guides::SmartLine"
new = "craft_ui::canvas_controls::SmartLine"
status = "moved"
note = "`#[non_exhaustive]`: built with `SmartLine::new(a, b)` and `.dashed()`."

[[type]]
name = "Measure"
old = "craft_ui::canvas::guides::Measure"
new = "craft_ui::canvas_controls::Measure"
status = "moved"
note = "`#[non_exhaustive]`: built with `Measure::new(a, b, label)`."

[[setter]]
type = "Guides"
old = "new(id_salt, &guides, &x_units, &y_units, names)"
new = "new(label, Bind<Vec<Guide>>) with x_units(RulerText) and y_units(RulerText)"

[[setter]]
