new = "cursor(options, view, caps_lock) -> craft_behavior::Cursor"

[[setter]]
type = "BrushCursor"
old = "paint_pixels(painter, view, style)"
new = "tip_cell() -> Option<TipCell> shown at the canvas rect with show_at; pixel_cell(view, pixels_per_point) -> Option<egui::Rect> is the snapped cell"

[[setter]]
type = "BrushCursor"
old = "the Caps Lock and centre mark on circles and outlines"
new = "centre(on) applies to an aliased tip only (crosshair instead of a hidden pointer): PaintedCursor::Circle and Outline carry no centre mark; badge(..) rides on the Standard icon and the crosshair only"

[[setter]]
type = "BrushResize"
old = "chord(egui::PointerButton, egui::Modifiers) and takes(..)"
new = "chord(craft_behavior::PointerButton, craft_keymap::Mods) and takes(..); the primary-button chord is Control and Alt (the Control key, not Command)"

[[setter]]
type = "BrushResize"
old = "begin(view, at, start, options) -> Option<EditEvent<BrushDimensions>>"
new = "begin(view, at, start, options) -> Option<ResizeStep>"

[[setter]]
type = "BrushResize"
old = "track(view, at, modifiers) and finish(view, at, modifiers) -> Option<EditEvent<BrushDimensions>>"
new = "track(view, at) and finish(view, at) -> Option<ResizeStep>"

[[setter]]
type = "BrushResize"
old = "cancel() -> Option<EditEvent<BrushDimensions>>"
new = "cancel() -> Option<ResizeStep> carrying the start values"

[[setter]]
type = "BrushResize"
old = "paint(painter, view, style, falloff)"
new = "preview(&falloff) -> Option<FalloffPreview> shown at the canvas rect with show_at"

[[setter]]
type = "BrushResize"
old = "readout(units, labels) -> Option<Readout>"
new = "readout_rows(units, words: &BrushWords) -> Vec<(Label, String)> for ToolContext::readout"

[[setter]]
type = "BrushResizeOptions"
old = "new(style, max_diameter) and tint(Color32)"
new = "new(max_diameter), travel(points) and tint(DataColor)"

[[setter]]
type = "TipFalloff"
old = "paint(painter, centre, zoom, tint)"
new = "FalloffPreview::new(&falloff, centre, ring_radius) shown at the canvas rect, with tint(DataColor)"
