[[setter]]
type = "SelectionOperation"
old = "resolve(bar, modifiers, has_selection)"
new = "resolve(bar, mods, has_selection)"

[[setter]]
type = "SelectionOperation"
old = "badge() -> SelectionBadge"
new = "badge() -> Option<CursorBadge>"

[[setter]]
type = "SelectionOperation"
old = "label(&words)"
new = "a words entry of the canvas controls (the legacy SelectionOperationLabels)"

[[setter]]
type = "DraftReach"
old = "of(&tokens)"
new = "new(close, same_point), the caller passes the hit tokens' target and slop"

[[setter]]
type = "DraftPoint"
old = "new(at, modifiers, zoom) and the field modifiers"
new = "new(at, mods, zoom) and the field mods"

[[setter]]
type = "OutlineDraft"
old = "modifiers_changed(modifiers)"
new = "mods_changed(mods)"

[[setter]]
type = "MarqueeGesture"
old = "press(screen, at, modifiers)"
new = "press(screen, at, mods)"

[[setter]]
type = "MarqueeGesture"
old = "press_modifiers()"
new = "press_mods()"

[[setter]]
type = "MarqueeGesture"
old = "follow(screen, modifiers)"
new = "follow(screen, mods)"

[[setter]]
type = "Constraint"
old = "serde Serialize and Deserialize"
new = "none yet in craft-behavior"

[[setter]]
type = "SnapLine"
old = "impl From<SnapLine> for SmartLine"
new = "SmartLine::from_snap(line) in the canvas controls"

[[setter]]
type = "BoxRules"
old = "drag_modifiers(part, modifiers) and drag_kind(part, modifiers)"
new = "drag_modifiers(part, mods) and drag_kind(part, mods)"
