# API map of the "Dialog shells" family: old path to new path and setter renames.
# Filled in by the family track; the codemods and the app scan read it.

family = "Dialog shells"
new_module = "craft_ui::dialog"

# One entry per public type: `old` is the path an app calls today, `new` the path after migration.
# `status` is "pending", "same" (path unchanged), "moved", "replaced" (use `note`) or "removed".

[[type]]
name = "Dialog"
old = "craft_ui::dialog::dialog::Dialog"
new = "craft_ui::dialog::Dialog"
status = "replaced"
note = "A container: `Dialog::new(title).opened(Bind::bound(&mut open)).show(ui, |ui, cx| ..)`. It takes no `Context`, `DialogState` or fields; the open state is a binding and the body edits the app's values directly."

[[type]]
name = "DialogFrame"
old = "craft_ui::dialog::frame::DialogFrame"
new = "craft_ui::dialog::DialogFrame"
status = "replaced"
note = "A container in the parent's flow: `DialogFrame::new(title).show(ui, |ui, cx| ..)`. `DialogFrameResponse` is gone: the output is a `Response`."

[[type]]
name = "FullWindowDialog"
old = "craft_ui::dialog::full_window::FullWindowDialog"
new = "craft_ui::dialog::FullWindowDialog"
status = "replaced"
note = "A container on `Mount::FullWindow`: `FullWindowDialog::new(title).opened(..).show(ui, |ui, cx| ..)`. `FullWindowFx` is gone: footer buttons are the footer closure's content."

[[type]]
name = "DialogHost"
old = "craft_ui::dialog::dialog_host::DialogHost"
new = "craft_ui::dialog::DialogHost"
status = "moved"
note = "`show(ctx)` is `run(ui)`; a `StackDialog::show` takes `&mut Ui` and its dialog is a container shown from it."

[[type]]
name = "StackDialog"
old = "craft_ui::dialog::dialog_host::StackDialog"
new = "craft_ui::dialog::StackDialog"
status = "moved"
note = "`show(&mut self, ctx: &Context, stack)` is `show(&mut self, ui: &mut Ui, stack)`."

[[type]]
name = "DialogResult"
old = "craft_ui::dialog::dialog_host::DialogResult"
new = "craft_ui::dialog::DialogResult"
status = "moved"

[[type]]
name = "StartupStage"
old = "craft_ui::dialog::dialog_host::StartupStage"
new = "craft_ui::dialog::StartupStage"
status = "moved"

[[type]]
name = "DialogStack"
old = "craft_ui::dialog::stack::DialogStack"
new = "craft_ui::dialog::DialogStack"
status = "moved"
note = "Routing only: the overlay host makes the top modal layer the one that takes input, so `Dialog::stack` and the whole-dialog disable are gone."

[[type]]
name = "dialog_id"
old = "craft_ui::dialog::stack::dialog_id"
new = "craft_ui::dialog::dialog_id"
status = "moved"

[[type]]
name = "DialogId"
old = "craft_ui::dialog::stack::DialogId"
new = "craft_ui::dialog::DialogId"
status = "moved"

[[type]]
name = "BlockingOverlay"
old = "craft_ui::dialog::blocking::BlockingOverlay"
new = "craft_ui::dialog::BlockingOverlay"
status = "replaced"
note = "A container: `BlockingOverlay::new(name).card(true).show(ui, |ui, cx| ..)` while the work lasts. `show(ctx) -> bool` (cancelled) becomes the open binding turning false."

[[type]]
name = "Outcome"
old = "craft_ui::dialog::Outcome"
new = ""
status = "removed"
note = "Escape and the close action close the dialog and write its open state; footer buttons act in the footer closure and call `FooterCx::request_close`. Enter as OK needs a hook the contract lacks (report: contract misfit)."

[[type]]
name = "DialogResponse"
old = "craft_ui::dialog::DialogResponse"
new = ""
status = "removed"
note = "The open binding and the footer closure replace `outcome`, `closed`, `opened`, `active` and `alternate`; `initial_focus`, `outer` and `history` are not reported."

[[type]]
name = "DialogState"
old = "craft_ui::dialog::DialogState"
new = ""
status = "removed"
note = "The open binding is the state; the container saves placement and size under its `SaveKey`."

[[type]]
name = "Backdrop"
old = "craft_ui::dialog::Backdrop"
new = "craft_ui::runtime::overlay::Backdrop"
status = "moved"
note = "`Backdrop::None` stays the transparent backdrop. A `Dialog` defaults to `Backdrop::Scrim`; call `.backdrop(Backdrop::None)` for the old look."

[[type]]
name = "InitialFocus"
old = "craft_ui::dialog::InitialFocus"
new = "craft_ui::runtime::focus::Initial"
status = "replaced"
note = "Auto and FirstField are `Initial::First`, DefaultButton is `Initial::Default`, Field(id) is `Initial::Key(name)`, None is `Initial::Keep`."

[[type]]
name = "EnterRule"
old = "craft_ui::dialog::EnterRule"
new = "craft_ui::runtime::focus::EnterRule"
status = "replaced"
note = "`Default` is `Submit`, `Body` is `Pass`."

[[type]]
name = "KeyInput"
old = "craft_ui::dialog::KeyInput"
new = ""
status = "removed"
note = "`resolve_keys` is the focus scope's Escape and Enter rules."

[[type]]
name = "resolve_keys"
old = "craft_ui::dialog::resolve_keys"
new = ""
status = "removed"
note = "The focus scope and `CancelRule` decide Escape; see `KeyInput`."

[[type]]
name = "Width"
old = "craft_ui::dialog::Width"
new = ""
status = "removed"
note = "A dialog sizes from its content, capped at a share of the window; there are no width classes."

[[type]]
name = "Body"
old = "craft_ui::dialog::Body"
new = ""
status = "removed"
note = "The body scrolls when the window is smaller than the content."

[[type]]
name = "Resize"
old = "craft_ui::dialog::Resize"
new = ""
status = "removed"
note = "`Dialog::resizable(bool)` adds the grips; the saved size is the user's."

[[type]]
name = "ResizeMax"
old = "craft_ui::dialog::ResizeMax"
new = ""
status = "removed"
note = "See `Resize`."

[[type]]
name = "remembered_size"
old = "craft_ui::dialog::remembered_size"
new = ""
status = "removed"
note = "The container saves and restores its own size."

[[type]]
name = "scroll_height"
old = "craft_ui::dialog::scroll_height"
new = ""
status = "removed"
note = "The body step sizes the scroll region."

[[type]]
name = "PlaceKey"
old = "craft_ui::dialog::PlaceKey"
new = "craft_ui::contract::SaveKey"
status = "replaced"
note = "`Dialog::remember(SaveKey::new(\"app.name\"))`."

[[type]]
name = "keep_on_screen"
old = "craft_ui::dialog::keep_on_screen"
new = ""
status = "removed"
note = "The overlay host keeps a placed layer in the window."

[[type]]
name = "next_pin"
old = "craft_ui::dialog::next_pin"
new = ""
status = "removed"
note = "See `keep_on_screen`."

[[type]]
name = "any_modal"
old = "craft_ui::dialog::any_modal"
new = "craft_ui::runtime::overlay::any_open"
status = "replaced"
note = "`any_open(ctx, OpenFilter::Modal)`."

[[type]]
name = "focus_inside"
old = "craft_ui::dialog::focus_inside"
new = ""
status = "removed"
note = "The focus scope records whether focus is inside a layer."

[[type]]
name = "DialogFrameResponse"
old = "craft_ui::dialog::DialogFrameResponse"
new = ""
status = "removed"
note = "The frame's output is a `Response`."

[[type]]
name = "DialogFrameStyle"
old = "craft_ui::dialog::DialogFrameStyle"
new = "craft_ui::dialog::DialogFrameStyle"
status = "replaced"
note = "A component style with the container's metrics; the look comes from the dialog surface and tokens."

[[type]]
name = "FullWindowFx"
old = "craft_ui::dialog::FullWindowFx"
new = "craft_ui::dialog::FooterCx"
status = "replaced"
note = "The footer closure's context."

# One entry per renamed, removed or reshaped setter or constructor.

[[setter]]
type = "Dialog"
old = "Dialog::new(id, title)"
new = "Dialog::new(title)"
note = "The id is the component's `id_salt` (`Props::id_salt`) when two dialogs share a title."

[[setter]]
type = "Dialog"
old = "Dialog::with_id(id, title)"
new = "Dialog::new(title).id_salt(id)"

[[setter]]
type = "Dialog"
old = "show(ctx, &mut state, &mut fields, |ui, fields| ..)"
new = "opened(Bind::bound(&mut open)).show(ui, |ui, cx| ..)"
note = "The body edits the app's values by closure capture."

[[setter]]
type = "Dialog"
old = "show_with_below(..)"
new = ""
note = "Removed: the contract has no non-scrolling region between body and footer."

[[setter]]
type = "Dialog"
old = "modeless()"
new = "modeless()"

[[setter]]
type = "Dialog"
old = "backdrop(Backdrop)"
new = "backdrop(Backdrop)"
note = "Default is `Scrim`."

[[setter]]
type = "Dialog"
old = "width(Width)"
new = ""
note = "Removed."

[[setter]]
type = "Dialog"
old = "body(Body)"
new = ""
note = "Removed."

[[setter]]
type = "Dialog"
old = "resizable(Resize)"
new = "resizable(bool)"

[[setter]]
type = "Dialog"
old = "remember_size(bool)"
new = "remember(SaveKey)"
note = "Placement and size are saved together."

[[setter]]
type = "Dialog"
old = "place_key(PlaceKey)"
new = "remember(SaveKey)"

[[setter]]
type = "Dialog"
old = "center_over(Rect)"
new = ""
note = "Removed: the dialog centres in the window or opens at `first_place`."

[[setter]]
type = "Dialog"
old = "first_place(|ctx| Option<Vec2>)"
new = "first_place(Pos2)"
note = "A screen position, not an offset from the window's corner."

[[setter]]
type = "Dialog"
old = "footer(Footer)"
new = "footer(|ui, fx| ..)"
note = "The closure fills a `FooterBar`; buttons come from the buttons family."

[[setter]]
type = "Dialog"
old = "close_label(Option<String>)"
new = "closable(bool)"
note = "The close action's name comes from the section words."

[[setter]]
type = "Dialog"
old = "outer_gesture(bool)"
new = "outer_gesture(bool)"

[[setter]]
type = "Dialog"
old = "initial_focus(InitialFocus)"
new = "initial_focus(Initial)"

[[setter]]
type = "Dialog"
old = "roomy(bool)"
new = "roomy(bool)"

[[setter]]
type = "Dialog"
old = "history(bool)"
new = ""
note = "Not ported: the container contract has no hook for the body's edit events."

[[setter]]
type = "Dialog"
old = "stack(&DialogStack)"
new = ""
note = "Removed: modal layers stack in the overlay host."

[[setter]]
type = "FullWindowDialog"
old = "new(id)"
new = "new(title)"
note = "The title is required; `title(..)` is gone."

[[setter]]
type = "FullWindowDialog"
old = "title_actions(|ui| ..)"
new = "actions([HeaderAction])"
note = "Close, Menu and Float only."

[[setter]]
type = "FullWindowDialog"
old = "rect(Rect)"
new = ""
note = "Removed: the dialog covers the window."

[[setter]]
type = "FullWindowDialog"
old = "enter(EnterRule)"
new = "enter(EnterRule)"
note = "New `EnterRule`."

[[setter]]
type = "FullWindowDialog"
old = "labels(DialogLabels)"
new = ""
note = "Removed: words come from the word sets."

[[setter]]
type = "BlockingOverlay"
old = "new(id)"
new = "new(name)"
note = "The name is the accessible name."

[[setter]]
type = "BlockingOverlay"
old = "name(..) and message(..)"
new = "new(name) and the body closure"
note = "The message text and spinner are the body's."

[[setter]]
type = "BlockingOverlay"
old = "cancel(label)"
new = "cancellable(bool)"
note = "Escape only; a cancel button is the body's."

[[setter]]
type = "BlockingOverlay"
old = "scrim(bool)"
new = "scrim(bool)"

[[setter]]
type = "BlockingOverlay"
old = "cursor(CursorIcon)"
new = "cursor(CursorIcon)"

[[setter]]
type = "DialogHost"
old = "show(ctx)"
new = "run(ui)"
