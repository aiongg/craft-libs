# API map of the "Docking and panes" family: old path to new path and setter renames.
# Filled in by the family track; the codemods and the app scan read it.

family = "Docking and panes"
new_module = "craft_ui::docking"

# One entry per public type: `old` is the path an app calls today, `new` the path after migration.
# `status` is "pending", "same" (path unchanged), "moved", "replaced" (use `note`) or "removed".

[[type]]
name = "DockArea"
old = "craft_ui::docking::surface::DockArea"
new = "craft_ui::docking::DockArea"
status = "pending"

[[type]]
name = "FloatingFrame"
old = "craft_ui::docking::chrome::FloatingFrame"
new = "craft_ui::docking::FloatingFrame"
status = "pending"

[[type]]
name = "TitleBar"
old = ""
# found in: craft_ui::docking::chrome::TitleBar, craft_ui::title_bar::TitleBar
new = "craft_ui::docking::TitleBar"
status = "pending"

[[type]]
name = "PaneHost"
old = "craft_ui::panes::PaneHost"
new = "craft_ui::docking::PaneHost"
status = "pending"

[[type]]
name = "ResizeHandle"
old = "craft_ui::layout::resize::ResizeHandle"
new = "craft_ui::docking::ResizeHandle"
status = "pending"

# One entry per renamed, removed or reshaped setter or constructor.
# [[setter]]
# type = ""
# old = ""
# new = ""

[[setter]]
type = "FloatingFrame"
old = "new(id, rect)"
new = "Overlay::placed(rect) on the frame container's Mount::Layer overlay"

[[setter]]
type = "FloatingFrame"
old = "bounds(rect)"
new = "Overlay::bounds(rect)"

[[setter]]
type = "FloatingFrame"
old = "limits(PanelLimits { min, max })"
new = "Overlay::size_limits(min, max)"

[[setter]]
type = "FloatingFrame"
old = "opacity(f32)"
new = "Overlay::opacity(f32)"

[[setter]]
type = "FrameResponse"
old = "resized, resize_started"
new = "Container::placement_changed(&PlacementChange): phase Begin starts a resize, rect is the rect it asks for"
