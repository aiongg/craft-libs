# API map of the "Docking and panes" family: old path to new path and setter renames.
# Filled in by the family track; the codemods and the app scan read it.

family = "Docking and panes"
new_module = "craft_ui::docking"

# One entry per public type: `old` is the path an app calls today, `new` the path after migration.
# `status` is "pending", "same" (path unchanged), "moved", "replaced" (use `note`) or "removed".

[[type]]
name = "DockArea"
old = "craft_ui::docking::surface::DockArea"
new = "craft_ui::docking::DockArea"
status = "pending"

[[type]]
name = "FloatingFrame"
old = "craft_ui::docking::chrome::FloatingFrame"
new = "craft_ui::docking::FloatingFrame"
status = "pending"

[[type]]
name = "TitleBar"
old = ""
# found in: craft_ui::docking::chrome::TitleBar, craft_ui::title_bar::TitleBar
new = "craft_ui::docking::TitleBar"
status = "pending"

[[type]]
name = "PaneHost"
old = "craft_ui::panes::PaneHost"
new = "craft_ui::docking::PaneHost"
status = "pending"

[[type]]
name = "ResizeHandle"
old = "craft_ui::layout::resize::ResizeHandle"
new = "craft_ui::docking::ResizeHandle"
status = "pending"

[[type]]
name = "resize_edges"
old = "craft_ui::docking::render::native::resize_edges"
new = ""
status = "replaced"
note = "Internal band of a native dock window; the float frame on `Mount::Viewport` resizes the window through its body-step grips."

[[type]]
name = "resize_bands"
old = "craft_ui::docking::render::native::resize_bands"
new = ""
status = "replaced"
note = "Internal; the eight zones are the float frame's body-step grips."

[[type]]
name = "PanelLimits"
old = "craft_ui::docking::PanelLimits"
new = "craft_ui::docking::PanelLimits"
status = "same"
note = "Built with `PanelLimits::new(min, max)`, `at_least` or `at_most`; the fields stay public; `valid` is public and the 1,000,000 bound is `PanelLimits::BOUND`."

[[type]]
name = "DockHeights"
old = "craft_ui::docking::DockHeights"
new = "craft_ui::docking::DockHeights"
status = "same"
note = "`valid` is public; the builders are `const`."

[[type]]
name = "DockConfig"
old = "craft_ui::docking::DockConfig"
new = "craft_ui::docking::DockConfig"
status = "same"
note = "Behaviour fields only, with a builder per field. The label fields are `DockWords`; the band, zone, cascade-inset and float sizes are `DockSizes`, resolved from the theme by `DockSizes::style(cx)` in the dock's component style; `right_to_left` is the env's direction; `panel_menu` and `min_tab_width` are gone (panel rows come from `DockPanels::panel_rows`, tabs fit by the strip's kind). `Sides` is `DockSides`."

[[type]]
name = "Sides"
old = "craft_ui::docking::Sides"
new = ""
status = "replaced"
note = "`DockSides { start, end, top, bottom }`: the horizontal pair follows the reading direction."

[[type]]
name = "DockEvent"
old = "craft_ui::docking::DockEvent"
new = "craft_ui::docking::DockEvent"
status = "same"
note = "`PanelCommand { panel, command }` carries a `menu::GroupItem` (the dock's own rows); the host's rows are commands and run by themselves. Adds `ColumnPlaced { anchor, rect }` (the anchor is a panel of the column's first group) and `FloatPlaced { panel, rect }`."

[[type]]
name = "FloatSpace"
old = "craft_ui::docking::FloatSpace"
new = "craft_ui::docking::FloatSpace"
status = "same"
note = "`FloatSpace::new(area, &DockSizes)` takes the default float size and the cascade inset from the sizes; the lookups `panel`, `group`, `column` and `place` are public."

[[type]]
name = "HidePanels"
old = "craft_ui::docking::HidePanels"
new = "craft_ui::docking::HidePanels"
status = "same"

[[type]]
name = "WindowKind"
old = "craft_ui::docking::WindowKind"
new = ""
status = "replaced"
note = "`craft_host::target::WindowKind`: `Palette` is `Tool` and `Normal` is `Document`. `PanelSpec::window_kind` holds it."

[[type]]
name = "DockContent"
old = "craft_ui::docking::DockContent"
new = ""
status = "replaced"
note = "`DockPanels<P>`: `spec(&P) -> PanelSpec` carries the label, icon, limits, heights, float size, native and window-kind policy; `body`, `group_view(panels, active, ui, rect, cx)` (was `custom_group(panels, active, floating)`), `group_header(panels, active, ui, cx)` and `panel_rows` stay hooks; a group is named by one of its panels. Permissions are the dock model's."

[[type]]
name = "ZoneRule"
old = "craft_ui::docking::ZoneRule"
new = "craft_ui::docking::ZoneRule"
status = "same"
note = "`Depth` or `Fraction`; `zones(body, &DockSizes, rtl)` gives non-overlapping rects by `craft_behavior::dock::zones`, with `Start` on the right under right-to-left."

[[type]]
name = "DropTarget"
old = "craft_ui::docking::DropTarget"
new = ""
status = "replaced"
note = "`DockTargets::register(ctx, dock, spot, rect)` registers `DockSpot`s (a group is named by an anchor panel) with hit rects for one dock; `DockTargets::resolve(ctx, dock, at)` resolves a pointer against the previous pass, only inside the dock's `DropTarget::accept`; `DockSpot::mark(rect, rtl)` gives the `DropMark` (dock-drop-a adds the model step)."

# Dock model (dock-model-a): moved UI-free into craft-behavior, serde shapes unchanged.

[[type]]
name = "Layout"
old = "craft_ui::docking::model::Layout"
new = "craft_behavior::dock::Layout"
status = "moved"

[[type]]
name = "Node"
old = "craft_ui::docking::model::Node"
new = "craft_behavior::dock::Node"
status = "moved"

[[type]]
name = "Floating"
old = "craft_ui::docking::model::Floating"
new = "craft_behavior::dock::Floating"
status = "moved"

[[type]]
name = "Placement"
old = "craft_ui::docking::model::Placement"
new = "craft_behavior::dock::Placement"
status = "moved"

[[type]]
name = "Location"
old = "craft_ui::docking::model::Location"
new = "craft_behavior::dock::Location"
status = "moved"

[[type]]
name = "Permissions"
old = "craft_ui::docking::model::Permissions"
new = "craft_behavior::dock::Permissions"
status = "moved"

[[type]]
name = "DockError"
old = "craft_ui::docking::model::DockError"
new = "craft_behavior::dock::DockError"
status = "moved"

[[type]]
name = "Action"
old = "craft_ui::docking::model::Action"
new = "craft_behavior::dock::Action"
status = "moved"

[[type]]
name = "StackEntry"
old = "craft_ui::docking::model::StackEntry"
new = "craft_behavior::dock::StackEntry"
status = "moved"

[[type]]
name = "DockSide"
old = "craft_ui::docking::model::Zone"
new = "craft_behavior::DockSide"
status = "replaced"
note = "`DockSide` in reading order: `Left` is `Start` and `Right` is `End`; saved layouts and actions with `Left`/`Right` load through serde aliases. `Placement::for_zone` loses its `right_to_left` argument."

[[type]]
name = "Monitor"
old = "craft_ui::docking::model::Monitor"
new = "craft_behavior::Monitor"
status = "moved"
note = "The one desktop monitor type of saved data, in `craft_behavior::monitor`."

[[type]]
name = "Group"
old = "craft_ui::docking::dock_model::Group"
new = "craft_behavior::dock::Group"
status = "moved"

[[type]]
name = "Column"
old = "craft_ui::docking::dock_model::Column"
new = "craft_behavior::dock::Column"
status = "moved"

[[type]]
name = "DockEdge"
old = "craft_ui::docking::dock_model::Side"
new = "craft_behavior::dock::DockEdge"
status = "replaced"
note = "Renamed: `overlay::Side` is another type. A dock's window edge, `Start` or `End`."

[[type]]
name = "PanelPlace"
old = "craft_ui::docking::dock_model::Place"
new = "craft_behavior::dock::PanelPlace"
status = "replaced"
note = "Renamed: `contract::overlay::Place` is another type."

[[type]]
name = "Target"
old = "craft_ui::docking::dock_model::Target"
new = "craft_behavior::dock::Target"
status = "moved"

[[type]]
name = "GroupLocation"
old = "craft_ui::docking::dock_model::GroupLocation"
new = "craft_behavior::dock::GroupLocation"
status = "moved"

[[type]]
name = "ColumnLocation"
old = "craft_ui::docking::dock_model::ColumnLocation"
new = "craft_behavior::dock::ColumnLocation"
status = "moved"

[[type]]
name = "PanelState"
old = "craft_ui::docking::dock_model::PanelState"
new = "craft_behavior::dock::PanelState"
status = "moved"

[[type]]
name = "MAX_DEPTH"
old = "craft_ui::docking::model::MAX_DEPTH"
new = "craft_behavior::dock::MAX_DEPTH"
status = "moved"
note = "A constant."

[[type]]
name = "MAX_PANELS"
old = "craft_ui::docking::model::MAX_PANELS"
new = "craft_behavior::dock::MAX_PANELS"
status = "moved"
note = "A constant."

[[type]]
name = "Axis"
old = "craft_ui::layout::SplitAxis"
new = "craft_behavior::Axis"
status = "replaced"
note = "`Horizontal` is `X` and `Vertical` is `Y`; saved layouts with the old names load through serde aliases. The split tree is in reading order: the first child is the start (or top) child."

[[type]]
name = "SplitSize"
old = "craft_ui::layout::SplitSize"
new = "craft_behavior::dock::SplitSize"
status = "moved"

# Literals of types that are now `#[non_exhaustive]`.

[[setter]]
type = "Layout"
old = "Layout { root, floating }"
new = "Layout::new(root, floating)"

[[setter]]
type = "Node"
old = "Node::Tabs { panels, active }"
new = "Node::tabs(panels, active)"

[[setter]]
type = "Node"
old = "Node::Split { axis, size, first: Box::new(first), second: Box::new(second) }"
new = "Node::split(axis, size, first, second)"

[[setter]]
type = "Floating"
old = "Floating { ..Floating::single(..) } with fields set"
new = "Floating::single(panels, active, rect); then assign `native`, `monitor`, `monitor_size` or `minimized` on the value"

[[setter]]
type = "StackEntry"
old = "StackEntry { panel, open, height }"
new = "StackEntry::new(panel); then assign `open` and `height`"

[[setter]]
type = "Monitor"
old = "Monitor { name, rect, scale }"
new = "Monitor::new(name, rect, scale)"

[[setter]]
type = "Permissions"
old = "Permissions { movable, floatable, closable, accepts_tabs, accepts_splits }"
new = "Permissions::new(movable, floatable, closable, accepts_tabs, accepts_splits)"

[[setter]]
type = "Permissions"
old = "Permissions { accepts_splits: true, ..Permissions::PROTECTED }"
new = "Permissions::new(false, false, false, false, true)"

[[setter]]
type = "Location"
old = "Location { floating, anchor, placement, size, stack, sibling, group }"
new = "Location::new(anchor, placement); then assign the other fields"

[[setter]]
type = "GroupLocation"
old = "GroupLocation { minimized, height, column }"
new = "GroupLocation::new(minimized, height, column)"

[[setter]]
type = "ColumnLocation"
old = "ColumnLocation { side, width, iconic, iconic_width }"
new = "ColumnLocation::new(side, width, iconic, iconic_width)"

[[setter]]
type = "Group"
old = "Group { panels, active, minimized, height }"
new = "Group::new(panels, active); then assign `minimized` and `height`"

[[setter]]
type = "Column"
old = "Column { groups, width, iconic, iconic_width }"
new = "Column::new(groups, width); then assign `iconic` and `iconic_width`"

# One entry per renamed, removed or reshaped setter or constructor.
# [[setter]]
# type = ""
# old = ""
# new = ""

[[setter]]
type = "FloatingFrame"
old = "new(id, rect)"
new = "Overlay::placed(rect) on the frame container's Mount::Layer overlay"

[[setter]]
type = "FloatingFrame"
old = "bounds(rect)"
new = "Overlay::bounds(rect)"

[[setter]]
type = "FloatingFrame"
old = "limits(PanelLimits { min, max })"
new = "Overlay::size_limits(min, max)"

[[setter]]
type = "FloatingFrame"
old = "opacity(f32)"
new = "Overlay::opacity(f32)"

[[setter]]
type = "FrameResponse"
old = "resized, resize_started"
new = "Container::placement_changed(&PlacementChange): phase Begin starts a resize, rect is the rect it asks for"
