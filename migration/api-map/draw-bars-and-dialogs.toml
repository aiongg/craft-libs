# API map of the "draw bars and dialogs" family: old path to new path and setter renames.
# Filled in by the family track; the codemods and the app scan read it.

family = "draw bars and dialogs"
new_module = ""

# One entry per public type: `old` is the path an app calls today, `new` the path after migration.
# `status` is "pending", "same" (path unchanged), "moved", "replaced" (use `note`) or "removed".

[[type]]
name = "TransformFields"
old = ""
new = ""
status = "pending"

[[type]]
name = "ReferencePoint"
old = "craft_ui::canvas::ReferencePoint"
new = "craft_ui::pickers::ReferencePoint"
status = "moved"
note = "The 3 by 3 picker, now `ReferencePoint::new(label, Bind<Anchor9>)` with output `EditResponse<Anchor9>`, over the one `craft_ui::pickers::Anchor9` (`craft_behavior::Anchor9`; `Center` is `Centre`). It has the look of PhotoCraft's Canvas Size picker; the options-bar size is `.compact()`."

[[type]]
name = "RefSize"
old = "craft_ui::canvas::RefSize"
new = ""
status = "replaced"
note = "`Compact` is `.compact()`; `Large` is the default."

# One entry per renamed, removed or reshaped setter or constructor.
# [[setter]]
# type = ""
# old = ""
# new = ""

[[setter]]
type = "ReferencePoint"
old = "ReferencePoint::new(id_salt, Option<Anchor9>)"
new = "ReferencePoint::new(label, Bind<Anchor9>)"
note = "The picker always has a point; a mixed binding checks none. The pick comes back in the output's event."

[[setter]]
type = "ReferencePoint"
old = "growth(i8, i8)"
new = "growth((f64, f64))"
note = "The change in width and height; only the signs decide the arrows."

[[setter]]
type = "ReferencePoint"
old = "size(RefSize)"
new = "compact()"
note = "`RefSize::Compact` is `.compact()`; `RefSize::Large` is the default and needs no call."

[[setter]]
type = "ReferencePoint"
old = "names([String; 9])"
new = ""
note = "The nine names are the picker family's words (`PickerWords`)."

# draw-gradient-a: the gradient stop bar, its stops, ramp and swatch.

[[type]]
name = "GradientEditor"
old = "craft_draw::ui::GradientEditor"
new = "craft_draw::ui::gradient::GradientEditor"
status = "replaced"
note = "A pattern: `GradientEditor::new(label, Bind<GradientStops>).show(ui)` with output `GradientEditorOutput`. The selection is the host's `selected` binding or the editor's own."

[[type]]
name = "GradientEditorResponse"
old = "craft_draw::ui::GradientEditorResponse"
new = "craft_draw::ui::gradient::GradientEditorOutput"
status = "replaced"
note = "`edit` folds the bar's and the fields' events; `color_requested` carries a `StopColor`; the eyedropper request is `screen_pick`."

[[type]]
name = "GradientEditorStyle"
old = "craft_draw::ui::GradientEditorStyle"
new = ""
status = "removed"
note = "The bar's look is a `ComponentStyle` of the bar."

[[type]]
name = "GradientLabels"
old = "craft_draw::ui::GradientLabels"
new = "craft_draw::ui::gradient::GradientWords"
status = "replaced"
note = "A `words!` set with count rows for the stop counts."

[[type]]
name = "StopRef"
old = "craft_draw::ui::gradient::StopRef"
new = "craft_draw::ui::gradient::StopRef"
status = "same"
note = "Moved to `value.rs`; `#[non_exhaustive]`."

[[type]]
name = "StopDrop"
old = "craft_draw::ui::gradient::StopDrop"
new = "craft_draw::ui::gradient::StopDrop"
status = "same"
note = "The payload type is carried with it in `dropped`."

[[type]]
name = "GradientRamp"
old = "craft_draw::ui::gradient::GradientRamp"
new = "craft_draw::ui::gradient::GradientRamp"
status = "same"
note = "`paint(cx, rect, colors)` over the kit's ramp painter."

[[type]]
name = "GradientRampStyle"
old = "craft_draw::ui::gradient::GradientRampStyle"
new = ""
status = "removed"
note = "The checker comes from the kit."

[[type]]
name = "GradientSwatch"
old = "craft_draw::ui::gradient::GradientSwatch"
new = "craft_draw::ui::gradient::GradientSwatch"
status = "replaced"
note = "`GradientSwatch::new(label, &stops)`; output `GradientSwatchOutput { response, clicked }`."

[[type]]
name = "GradientStops"
old = "craft_draw::ui::gradient::GradientStops"
new = "craft_draw::ui::gradient::GradientStops"
status = "same"
note = "`#[non_exhaustive]` with constructors."

[[type]]
name = "ColorStop"
old = "craft_draw::ui::gradient::ColorStop"
new = "craft_draw::ui::gradient::ColorStop"
status = "same"
note = "`#[non_exhaustive]` with constructors."

[[type]]
name = "OpacityStop"
old = "craft_draw::ui::gradient::OpacityStop"
new = "craft_draw::ui::gradient::OpacityStop"
status = "same"
note = "`#[non_exhaustive]` with constructors."

[[type]]
name = "StopRow"
old = "craft_draw::ui::gradient::StopRow"
new = "craft_draw::ui::gradient::StopRow"
status = "same"
note = "`#[non_exhaustive]` with constructors."

[[type]]
name = "StopRows"
old = "craft_draw::ui::gradient::StopRows"
new = "craft_draw::ui::gradient::StopRows"
status = "same"
note = "`#[non_exhaustive]` with constructors."

[[type]]
name = "StopRules"
old = "craft_draw::ui::gradient::StopRules"
new = "craft_draw::ui::gradient::StopRules"
status = "same"
note = "`#[non_exhaustive]` with constructors."

[[type]]
name = "Sampler"
old = "craft_draw::ui::gradient::Sampler"
new = "craft_draw::ui::gradient::Sampler"
status = "same"
note = "`#[non_exhaustive]` with constructors."

[[type]]
name = "default_sampler"
old = "craft_draw::ui::gradient::default_sampler"
new = "craft_draw::ui::gradient::default_sampler"
status = "same"

[[type]]
name = "StopColor"
old = ""
new = "craft_draw::ui::gradient::StopColor"
status = "pending"
note = "New: the colour stop whose colour the host is asked to edit, with its `ColorRequest`."

[[setter]]
type = "GradientEditor"
old = "new(id_salt, label, &stops, &numbers)"
new = "new(label, Bind<GradientStops>)"
note = "The id salt and the numbers go; the binding carries the stops."

[[setter]]
type = "GradientEditor"
old = "select(ctx, id, ..) / selected(ctx, id) / id_in"
new = "selected(Bind<Option<StopRef>>)"
note = "One selection, owned by the host."

[[setter]]
type = "GradientEditor"
old = "style / policy / labels / enabled"
new = ""
note = "Style is the component's; the policy is on the `Bind`; the words are `GradientWords`; `enabled` is kept."

[[setter]]
type = "GradientEditor"
old = "stops(min, max) / rows / midpoint_range"
new = "rules(StopRules)"
note = "One rules value."

[[setter]]
type = "GradientEditor"
old = "color_picker(setup)"
new = "picker(setup)"

[[setter]]
type = "GradientSwatch"
old = "width / size / enabled"
new = "fill()"
note = "The swatch takes the width the layout offers."

[[setter]]
type = "GradientSwatch"
old = "has_popup(bool)"
new = "has_popup()"

