# API map of the "draw bars and dialogs" family: old path to new path and setter renames.
# Filled in by the family track; the codemods and the app scan read it.

family = "draw bars and dialogs"
new_module = ""

# One entry per public type: `old` is the path an app calls today, `new` the path after migration.
# `status` is "pending", "same" (path unchanged), "moved", "replaced" (use `note`) or "removed".

[[type]]
name = "TransformFields"
old = ""
new = ""
status = "pending"

[[type]]
name = "ReferencePoint"
old = "craft_ui::canvas::ReferencePoint"
new = "craft_ui::pickers::ReferencePoint"
status = "moved"
note = "The 3 by 3 picker, now `ReferencePoint::new(label, Bind<Anchor9>)` with output `EditResponse<Anchor9>`, over the one `craft_ui::pickers::Anchor9` (`craft_behavior::Anchor9`; `Center` is `Centre`). It has the look of PhotoCraft's Canvas Size picker; the options-bar size is `.compact()`."

[[type]]
name = "RefSize"
old = "craft_ui::canvas::RefSize"
new = ""
status = "replaced"
note = "`Compact` is `.compact()`; `Large` is the default."

# One entry per renamed, removed or reshaped setter or constructor.
# [[setter]]
# type = ""
# old = ""
# new = ""

[[setter]]
type = "ReferencePoint"
old = "ReferencePoint::new(id_salt, Option<Anchor9>)"
new = "ReferencePoint::new(label, Bind<Anchor9>)"
note = "The picker always has a point; a mixed binding checks none. The pick comes back in the output's event."

[[setter]]
type = "ReferencePoint"
old = "growth(i8, i8)"
new = "growth((f64, f64))"
note = "The change in width and height; only the signs decide the arrows."

[[setter]]
type = "ReferencePoint"
old = "size(RefSize)"
new = "compact()"
note = "`RefSize::Compact` is `.compact()`; `RefSize::Large` is the default and needs no call."

[[setter]]
type = "ReferencePoint"
old = "names([String; 9])"
new = ""
note = "The nine names are the picker family's words (`PickerWords`)."

# draw-connector
[[type]]
name = "ConnectorBar"
old = "craft_draw::ui::connector::ConnectorBar"
new = "craft_draw::ui::connector::ConnectorBar"
status = "same"
note = "A pattern shown as a child of the host's options `Bar`: `ConnectorBar::new(Mixed<Routing>, Mixed<ConnectorLine>).caps(start, end).show(ui)`; `add_to` is gone."

[[setter]]
type = "ConnectorBar"
old = "add_to(slots)"
new = "show(ui)"
note = "Shown in the host's `Bar`."

[[type]]
name = "ConnectorBarOutput"
old = "craft_draw::ui::connector::ConnectorBarOutput"
new = "craft_draw::ui::connector::ConnectorBarOutput"
status = "same"
note = "Gains `response`; is no longer `Default` or `PartialEq`."

[[type]]
name = "ConnectorBarLabels"
old = "craft_draw::ui::connector::ConnectorBarLabels"
new = "craft_draw::ui::connector::ConnectorBarWords"
status = "removed"
note = "Words are `ConnectorBarWords`."

[[type]]
name = "ConnectorLine"
old = "craft_draw::ui::connector::ConnectorLine"
new = "craft_draw::ui::connector::ConnectorLine"
status = "same"

[[type]]
name = "CreateShapeDialog"
old = "craft_draw::ui::shape_drag::CreateShapeDialog"
new = "craft_draw::ui::shape_drag::CreateShapeDialog"
status = "same"
note = "Still a `StackDialog`, now over `FormDialog`."

[[type]]
name = "CreateShapeOptions"
old = "craft_draw::ui::shape_drag::CreateShapeOptions"
new = "craft_draw::ui::shape_drag::CreateShapeOptions"
status = "same"
note = "`units` takes `GuideUnits` (its `ruler` is a `UnitKind`)."

[[type]]
name = "CreatedShape"
old = "craft_draw::ui::shape_drag::CreatedShape"
new = "craft_draw::ui::shape_drag::CreatedShape"
status = "same"

[[type]]
name = "CreateShapeLabels"
old = "craft_draw::ui::shape_drag::CreateShapeLabels"
new = "craft_draw::ui::shape_drag::CreateShapeWords"
status = "removed"
note = "Words are `CreateShapeWords`."
