# API map of the "draw bars and dialogs" family: old path to new path and setter renames.
# Filled in by the family track; the codemods and the app scan read it.

family = "draw bars and dialogs"
new_module = ""

# One entry per public type: `old` is the path an app calls today, `new` the path after migration.
# `status` is "pending", "same" (path unchanged), "moved", "replaced" (use `note`) or "removed".

[[type]]
name = "TransformFields"
old = ""
new = ""
status = "pending"

[[type]]
name = "ReferencePoint"
old = "craft_ui::canvas::ReferencePoint"
new = "craft_ui::pickers::ReferencePoint"
status = "moved"
note = "The 3 by 3 picker, now `ReferencePoint::new(label, Bind<Anchor9>)` with output `EditResponse<Anchor9>`, over the one `craft_ui::pickers::Anchor9` (`craft_behavior::Anchor9`; `Center` is `Centre`). It has the look of PhotoCraft's Canvas Size picker; the options-bar size is `.compact()`."

[[type]]
name = "RefSize"
old = "craft_ui::canvas::RefSize"
new = ""
status = "replaced"
note = "`Compact` is `.compact()`; `Large` is the default."

# One entry per renamed, removed or reshaped setter or constructor.
# [[setter]]
# type = ""
# old = ""
# new = ""

[[setter]]
type = "ReferencePoint"
old = "ReferencePoint::new(id_salt, Option<Anchor9>)"
new = "ReferencePoint::new(label, Bind<Anchor9>)"
note = "The picker always has a point; a mixed binding checks none. The pick comes back in the output's event."

[[setter]]
type = "ReferencePoint"
old = "growth(i8, i8)"
new = "growth((f64, f64))"
note = "The change in width and height; only the signs decide the arrows."

[[setter]]
type = "ReferencePoint"
old = "size(RefSize)"
new = "compact()"
note = "`RefSize::Compact` is `.compact()`; `RefSize::Large` is the default and needs no call."

[[setter]]
type = "ReferencePoint"
old = "names([String; 9])"
new = ""
note = "The nine names are the picker family's words (`PickerWords`)."

# draw-pen-b: Path Options

[[type]]
name = "PathOptionsPopover"
old = "craft_draw::ui::pen::PathOptionsPopover"
new = "craft_draw::ui::pen::PathOptionsPopover"
status = "same"
note = "A pattern: `new(label, Bind<PathOptionsSettings>)`, `default_color`, `show(ui, &mut open)`."

[[type]]
name = "PathOptionsPopoverResponse"
old = "craft_draw::ui::pen::PathOptionsPopoverResponse"
new = ""
status = "removed"
note = "The output is `PathOptionsOutput { response, edit, pick_color }`."

[[type]]
name = "PathOptionsOutput"
old = ""
new = "craft_draw::ui::pen::PathOptionsOutput"
status = "replaced"
note = "Replaces `PathOptionsPopoverResponse`; `edit` is `Option<EditEvent<PathOptionsSettings>>`."

[[type]]
name = "PathOptionsLabels"
old = "craft_draw::ui::pen::PathOptionsLabels"
new = ""
status = "removed"
note = "The words are `PathOptionsWords`."

[[type]]
name = "PathOptionsWords"
old = ""
new = "craft_draw::ui::pen::PathOptionsWords"
status = "replaced"
note = "The `words!` set of the popover."

[[type]]
name = "PathOptionsSettings"
old = "craft_draw::ui::pen::PathOptionsSettings"
new = "craft_draw::ui::pen::PathOptionsSettings"
status = "same"
note = "The serde shape is unchanged; the thickness is in pixels."

[[type]]
name = "PathMode"
old = "craft_draw::ui::pen::PathMode"
new = "craft_draw::ui::pen::PathMode"
status = "same"
note = "`resolve` takes `craft_keymap::Mods` in place of `egui::Modifiers`."

[[type]]
name = "PathTool"
old = "craft_draw::ui::pen::PathTool"
new = "craft_draw::ui::pen::PathTool"
status = "same"

[[type]]
name = "PenMode"
old = "craft_draw::ui::pen::PenMode"
new = "craft_draw::ui::pen::PenMode"
status = "same"

[[setter]]
type = "PathOptionsPopover"
old = "new(id_salt, &settings)"
new = "new(label, Bind<PathOptionsSettings>)"
note = "The `ColorRequest` comes from the swatch as `pick_color`."

[[setter]]
type = "PathOptionsPopover"
old = "labels(PathOptionsLabels)"
new = ""
note = "Words come from the env."
