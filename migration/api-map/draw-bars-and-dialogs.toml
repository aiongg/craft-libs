# API map of the "draw bars and dialogs" family: old path to new path and setter renames.
# Filled in by the family track; the codemods and the app scan read it.

family = "draw bars and dialogs"
new_module = ""

# One entry per public type: `old` is the path an app calls today, `new` the path after migration.
# `status` is "pending", "same" (path unchanged), "moved", "replaced" (use `note`) or "removed".

[[type]]
name = "TransformFields"
old = ""
new = ""
status = "pending"

[[type]]
name = "ReferencePoint"
old = "craft_ui::canvas::ReferencePoint"
new = "craft_ui::pickers::ReferencePoint"
status = "moved"
note = "The 3 by 3 picker, now `ReferencePoint::new(label, Bind<Anchor9>)` with output `EditResponse<Anchor9>`, over the one `craft_ui::pickers::Anchor9` (`craft_behavior::Anchor9`; `Center` is `Centre`). It has the look of PhotoCraft's Canvas Size picker; the options-bar size is `.compact()`."

[[type]]
name = "RefSize"
old = "craft_ui::canvas::RefSize"
new = ""
status = "replaced"
note = "`Compact` is `.compact()`; `Large` is the default."

# One entry per renamed, removed or reshaped setter or constructor.
# [[setter]]
# type = ""
# old = ""
# new = ""

[[setter]]
type = "ReferencePoint"
old = "ReferencePoint::new(id_salt, Option<Anchor9>)"
new = "ReferencePoint::new(label, Bind<Anchor9>)"
note = "The picker always has a point; a mixed binding checks none. The pick comes back in the output's event."

[[setter]]
type = "ReferencePoint"
old = "growth(i8, i8)"
new = "growth((f64, f64))"
note = "The change in width and height; only the signs decide the arrows."

[[setter]]
type = "ReferencePoint"
old = "size(RefSize)"
new = "compact()"
note = "`RefSize::Compact` is `.compact()`; `RefSize::Large` is the default and needs no call."

[[setter]]
type = "ReferencePoint"
old = "names([String; 9])"
new = ""
note = "The nine names are the picker family's words (`PickerWords`)."

# gradient-b: the palette and the Gradient Map

[[type]]
name = "GradientPalette"
old = "craft_draw::ui::GradientPalette"
new = "craft_draw::ui::gradient::GradientPalette"
status = "replaced"
note = "A pattern over `PresetBrowser`: `new(label, groups, Bind<PresetState<GradientRef>>)`, output `GradientPaletteOutput { picked }`."

[[type]]
name = "PaletteLayout"
old = "craft_draw::ui::PaletteLayout"
new = ""
status = "removed"
note = "`PresetView::{Grid, List}` in the bound `PresetState`."

[[type]]
name = "GradientGroup"
old = "craft_draw::ui::GradientGroup"
new = "craft_draw::ui::gradient::GradientGroup"
status = "same"

[[type]]
name = "GradientItem"
old = "craft_draw::ui::GradientItem"
new = "craft_draw::ui::gradient::GradientItem"
status = "same"

[[type]]
name = "GradientRef"
old = "craft_draw::ui::GradientRef"
new = "craft_draw::ui::gradient::GradientRef"
status = "same"
note = "The browser's key."

[[type]]
name = "GradientMap"
old = "craft_draw::ui::GradientMap"
new = "craft_draw::ui::gradient::GradientMap"
status = "same"

[[type]]
name = "GradientMapEditor"
old = "craft_draw::ui::GradientMapEditor"
new = "craft_draw::ui::gradient::GradientMapEditor"
status = "replaced"
note = "`new(label, &GradientMap)`; output `GradientMapOutput { event, color_requested, import }`."

[[type]]
name = "GradientMapLabels"
old = "craft_draw::ui::GradientMapLabels"
new = "craft_draw::ui::gradient::GradientMapWords"
status = "replaced"
note = "A `words!` set."

[[type]]
name = "GradientMapOutput"
old = "craft_draw::ui::GradientMapOutput"
new = "craft_draw::ui::gradient::GradientMapOutput"
status = "replaced"
note = "`pick_color` is `color_requested: Option<StopColor>`; `import_presets` is `import`."
