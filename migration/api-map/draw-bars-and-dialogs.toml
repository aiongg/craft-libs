[[setter]]
type = "CropInput"
old = "units(&RulerUnits, &RulerUnits)"
new = ""
note = "The readout and the parts' values read the canvas's rulers."

[[setter]]
type = "CropInput"
old = "names(CropNames)"
new = ""
note = "The names are `CropWords`."

[[setter]]
type = "CropInput"
old = "readout(CropLabels)"
new = ""
note = "The readout words are the overlay's."

[[setter]]
type = "CropInput"
old = "canvas_colour(Color32)"
new = ""
note = "The overlay reads the canvas colour token."

[[setter]]
type = "CropInput"
old = "snap(closure)"
new = "snap(&SnapTargets)"
note = "The overlay snaps; the tool snaps nothing itself."

[[setter]]
type = "CropTool"
old = "undo(&CanvasView) -> Option<CanvasView>"
new = "undo() -> bool"
note = "The next pass turns the image-mode view with the frame."

[[setter]]
type = "CropTool"
old = "refit(&CanvasView, ..) -> Option<(CropEvent, CanvasView)>"
new = "refit(..) -> Option<CropEvent>"
note = "The next pass turns the image-mode view with the frame."

[[setter]]
type = "CropTool"
old = "apply(.., Option<CanvasView>)"
new = "apply(..)"
note = "The tool keeps the view the last pass saw."

[[setter]]
type = "CropTool"
old = "applied(bool) -> Option<CanvasView>"
new = "applied(bool)"
note = "A refused commit's view goes to the host on the next pass."

[[setter]]
type = "CanvasTool"
old = "parts / picked / pick"
new = ""
note = "The overlay's roving group owns the keyboard parts."

[[setter]]
type = "PerspectiveCropQuad"
old = "new(id_salt, &state, names)"
new = "new(label, Bind<PerspectiveQuad>)"
note = "The value is a binding; the label names the group."

[[setter]]
type = "PerspectiveCropQuad"
old = "show(ui, canvas, view)"
new = "show_at(ui, canvas_rect)"
note = "A canvas control is shown in the canvas body."

[[setter]]
type = "PerspectiveCropQuad"
old = "focus(ctx, id) / clear(ctx, id)"
new = ""
note = "The arena owns focus; `PerspectiveCropTool::clear` drops the quad and the clicks."

[[setter]]
type = "PerspectiveCropQuad"
old = "units / value / policy / tolerance"
new = ""
note = "Reach comes from tokens; the binding carries the policy."
