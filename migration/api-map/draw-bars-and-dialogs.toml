# API map of the "draw bars and dialogs" family: old path to new path and setter renames.
# Filled in by the family track; the codemods and the app scan read it.

family = "draw bars and dialogs"
new_module = ""

# One entry per public type: `old` is the path an app calls today, `new` the path after migration.
# `status` is "pending", "same" (path unchanged), "moved", "replaced" (use `note`) or "removed".

[[type]]
name = "TransformFields"
old = ""
new = ""
status = "pending"

[[type]]
name = "ReferencePoint"
old = "craft_ui::canvas::ReferencePoint"
new = "craft_ui::pickers::ReferencePoint"
status = "moved"
note = "The 3 by 3 picker, now `ReferencePoint::new(label, Bind<Anchor9>)` with output `EditResponse<Anchor9>`, over the one `craft_ui::pickers::Anchor9` (`craft_behavior::Anchor9`; `Center` is `Centre`). It has the look of PhotoCraft's Canvas Size picker; the compact options-bar look is not ported."

[[type]]
name = "RefSize"
old = "craft_ui::canvas::RefSize"
new = ""
status = "removed"
note = "The picker has one size, set by the style. `Large` is that size; `Compact` is not ported."

# One entry per renamed, removed or reshaped setter or constructor.
# [[setter]]
# type = ""
# old = ""
# new = ""

[[setter]]
type = "ReferencePoint"
old = "ReferencePoint::new(id_salt, Option<Anchor9>)"
new = "ReferencePoint::new(label, Bind<Anchor9>)"
note = "The picker always has a point; a mixed binding checks none. The pick comes back in the output's event."

[[setter]]
type = "ReferencePoint"
old = "growth(i8, i8)"
new = "growth((f64, f64))"
note = "The change in width and height; only the signs decide the arrows."

[[setter]]
type = "ReferencePoint"
old = "size(RefSize)"
new = ""

[[setter]]
type = "ReferencePoint"
old = "names([String; 9])"
new = ""
note = "The nine names are the picker family's words (`PickerWords`)."

# draw-brush: the Brush Settings panel and the Brush Preset picker.

[[type]]
name = "BrushSettingsPanel"
old = "craft_draw::ui::brush_settings::BrushSettingsPanel"
new = "craft_draw::ui::brush_settings::BrushSettingsPanel"
status = "same"
note = "Shown with `show(ui, |ui, cx, key| ..)`; the pane closure also gets the body context. `new(label, sections, Bind<K>)` replaces `new(id_salt)` with `sections(..)` and `selected(..)`."

[[type]]
name = "BrushSettingsPanelOutput"
old = "craft_draw::ui::brush_settings::BrushSettingsPanelOutput"
new = "craft_draw::ui::brush_settings::BrushSettingsPanelOutput"
status = "same"
note = "`sections`, `action` and `body` as before."

[[type]]
name = "BrushPanelAction"
old = "craft_draw::ui::brush_settings::BrushPanelAction"
new = "craft_draw::ui::brush_settings::BrushPanelAction"
status = "same"

[[type]]
name = "BrushSectionList"
old = "craft_draw::ui::brush_settings::BrushSectionList"
new = "craft_draw::ui::brush_settings::BrushSectionList"
status = "same"
note = "`new(label, sections, Bind<K>)`; the shown pane is a binding."

[[type]]
name = "BrushSectionListResponse"
old = "craft_draw::ui::brush_settings::BrushSectionListResponse"
new = "craft_draw::ui::brush_settings::BrushSectionListOutput"
status = "replaced"
note = "Renamed `BrushSectionListOutput { response, events }`."

[[type]]
name = "BrushStrokeStrip"
old = "craft_draw::ui::brush_settings::BrushStrokeStrip"
new = "craft_draw::ui::brush_settings::BrushStrokeStrip"
status = "same"
