[[type]]
name = "BrushSizeField"
old = "craft_draw::ui::brush_settings::BrushSizeField"
new = "craft_draw::ui::brush_settings::BrushSizeField"
status = "same"
note = "`new(label, Bind<f64>, max)`; the output is `BrushSizeOutput { response, edit: Option<EditResponse<f64>> }`."

[[type]]
name = "TipEllipse"
old = "craft_draw::ui::brush_settings::TipEllipse"
new = "craft_draw::ui::brush_settings::TipEllipse"
status = "same"
note = "`new(label, Bind<TipAngle>)`; the output is `EditResponse<TipAngle>`."

[[type]]
name = "TipEllipseGrab"
