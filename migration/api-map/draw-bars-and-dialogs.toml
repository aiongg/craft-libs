# API map of the "draw bars and dialogs" family: old path to new path and setter renames.
# Filled in by the family track; the codemods and the app scan read it.

family = "draw bars and dialogs"
new_module = ""

# One entry per public type: `old` is the path an app calls today, `new` the path after migration.
# `status` is "pending", "same" (path unchanged), "moved", "replaced" (use `note`) or "removed".

[[type]]
name = "TransformFields"
old = ""
new = ""
status = "pending"

[[type]]
name = "ReferencePoint"
old = "craft_ui::canvas::ReferencePoint"
new = "craft_ui::pickers::ReferencePoint"
status = "moved"
note = "The 3 by 3 picker, now `ReferencePoint::new(label, Bind<Anchor9>)` with output `EditResponse<Anchor9>`, over the one `craft_ui::pickers::Anchor9` (`craft_behavior::Anchor9`; `Center` is `Centre`). It has the look of PhotoCraft's Canvas Size picker; the compact options-bar look is not ported."

[[type]]
name = "RefSize"
old = "craft_ui::canvas::RefSize"
new = ""
status = "removed"
note = "The picker has one size, set by the style. `Large` is that size; `Compact` is not ported."

# One entry per renamed, removed or reshaped setter or constructor.
# [[setter]]
# type = ""
# old = ""
# new = ""

[[setter]]
type = "ReferencePoint"
old = "ReferencePoint::new(id_salt, Option<Anchor9>)"
new = "ReferencePoint::new(label, Bind<Anchor9>)"
note = "The picker always has a point; a mixed binding checks none. The pick comes back in the output's event."

[[setter]]
type = "ReferencePoint"
old = "growth(i8, i8)"
new = "growth((f64, f64))"
note = "The change in width and height; only the signs decide the arrows."

[[setter]]
type = "ReferencePoint"
old = "size(RefSize)"
new = ""

[[setter]]
type = "ReferencePoint"
old = "names([String; 9])"
new = ""
note = "The nine names are the picker family's words (`PickerWords`)."

# draw-transform-a
[[type]]
name = "TransformSession"
old = "craft_draw::ui::transform::TransformSession"
new = "craft_draw::ui::transform::TransformSession"
status = "same"
note = "Plain data as before; undo goes through `EditHistory`. `menu(&TransformMenuWords)` returns `Vec<Entry<TransformChoice>>`. The warp type `W` is `Send + Sync + 'static`."

[[type]]
name = "TransformEdit"
old = "craft_draw::ui::transform::TransformEdit"
new = "craft_draw::ui::transform::TransformEdit"
status = "same"

[[type]]
name = "TransformRequest"
old = "craft_draw::ui::transform::TransformRequest"
new = "craft_draw::ui::transform::TransformRequest"
status = "same"

[[type]]
name = "TransformResult"
old = "craft_draw::ui::transform::TransformResult"
new = "craft_draw::ui::transform::TransformResult"
status = "same"

[[type]]
name = "TransformPhase"
old = "craft_draw::ui::transform::TransformPhase"
new = "craft_draw::ui::transform::TransformPhase"
status = "same"

[[type]]
name = "TransformPreset"
old = "craft_draw::ui::transform::TransformPreset"
new = "craft_draw::ui::transform::TransformPreset"
status = "same"

[[type]]
name = "Interpolation"
old = "craft_draw::ui::transform::Interpolation"
new = "craft_draw::ui::transform::Interpolation"
status = "same"

[[type]]
name = "TransformChoice"
old = "craft_draw::ui::transform::TransformChoice"
new = "craft_draw::ui::transform::TransformChoice"
status = "same"

[[type]]
name = "TransformWarp"
old = "craft_draw::ui::transform::TransformWarp"
new = "craft_draw::ui::transform::TransformWarp"
status = "same"

[[type]]
name = "TransformSettings"
old = "craft_draw::ui::transform::TransformSettings"
new = "craft_draw::ui::transform::TransformSettings"
status = "same"
note = "`size_unit` is `Option<UnitKind>`; saved preferences that spell it `Pixels`, `Percent`, `Inches`, `Centimetres`, `Millimetres`, `Points` or `Picas` still load."

[[type]]
name = "TransformMenuWords"
old = ""
new = "craft_draw::ui::transform::TransformMenuWords"
status = "replaced"
note = "Replaces `TransformMenuLabels` with the same word ids."

[[type]]
name = "TransformMenuLabels"
old = "craft_draw::ui::transform::TransformMenuLabels"
new = ""
status = "removed"
note = "Use `TransformMenuWords`."

[[setter]]
type = "TransformSession"
old = "menu(&TransformMenuLabels) -> Vec<MenuEntry<TransformChoice>>"
new = "menu(&TransformMenuWords) -> Vec<Entry<TransformChoice>>"

[[setter]]
type = "TransformSettings"
old = "size_unit: Option<LengthUnit>"
new = "size_unit: Option<UnitKind>"

