# API map of the "draw canvas controls" family: old path to new path and setter renames.
# Filled in by the family track; the codemods and the app scan read it.

family = "draw canvas controls"
new_module = ""

# One entry per public type: `old` is the path an app calls today, `new` the path after migration.
# `status` is "pending", "same" (path unchanged), "moved", "replaced" (use `note`) or "removed".

[[type]]
name = "CropFrame"
old = ""
new = ""
status = "pending"

[[type]]
name = "TransformBox"
old = "craft_draw::ui::TransformBox"
new = "craft_draw::ui::TransformBox"
status = "same"
note = "A canvas control (`#[component(canvas_control)]`): `TransformBox::new(label, Bind<BoxState>, start, skew_v)` shown with `show_at(ui, body.rect)` inside a `Canvas`; its parts are in the canvas arena, so there is no host-driven `press`, `track`, `release`, `hit` or `double_click`, no `focus(ctx, id)` and no `Claim`. Output `TransformBoxOutput { edit, apply, discard, picked, hovered }`."

[[type]]
name = "BezierOverlay"
old = ""
new = ""
status = "pending"

[[type]]
name = "PenDraft"
old = ""
new = ""
status = "pending"

[[type]]
name = "GradientOverlay"
old = ""
new = ""
status = "pending"

# One entry per renamed, removed or reshaped setter or constructor.
# [[setter]]
# type = ""
# old = ""
# new = ""

