new = "craft_draw::ui::EditSubpath"
status = "same"

[[type]]
name = "Knot"
old = "craft_draw::ui::Knot"
new = "craft_draw::ui::Knot"
status = "same"

[[type]]
name = "KnotRef"
old = "craft_draw::ui::KnotRef"
new = "craft_draw::ui::KnotRef"
status = "same"

[[type]]
name = "HandleSide"
old = "craft_draw::ui::HandleSide"
new = "craft_draw::ui::HandleSide"
status = "same"

[[type]]
