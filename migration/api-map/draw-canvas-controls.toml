# craft_draw::ui::pen::bezier (draw-pen-a)
[[type]]
name = "BezierOverlay"
old = "craft_draw::ui::BezierOverlay"
new = "craft_draw::ui::BezierOverlay"
status = "moved"
note = "A canvas control: `BezierOverlay::new(label, Bind<Vec<EditPath>>, &PathSelection)` shown with `show_at(ui, body.rect)` in a `Canvas` body that has a view. The value is the paths: a drag proposes them with the edit applied and Escape restores the start; `BezierOutput::change` carries the gesture's `PathEdit`. The parts are in the canvas's arena, so there is no `claimed` flag."

[[type]]
name = "BezierResponse"
old = "craft_draw::ui::BezierResponse"
new = ""
status = "removed"
note = "`BezierOutput`: `edit` (an `EditResponse<Vec<EditPath>>`) replaces `event` and `id`; `change` carries the `PathEdit`; `context` carries the screen position; `claimed` is gone (a press on a part never reaches the tool)."

[[type]]
name = "BezierOutput"
old = ""
new = "craft_draw::ui::BezierOutput"
status = "replaced"
note = "Replaces `BezierResponse`."

[[type]]
name = "BezierNames"
old = "craft_draw::ui::BezierNames"
new = ""
status = "removed"
note = "`BezierWords`, a `craft_ui::words!` set read from the env."

[[type]]
name = "BezierWords"
old = ""
new = "craft_draw::ui::BezierWords"
status = "replaced"
note = "Replaces `BezierNames`: the in and out handle names, the marquee name and the template \"Anchor {i} of {n}\"; the group is named by the overlay's label."

[[type]]
name = "BezierStyle"
old = "craft_ui::style::bezier::BezierStyle"
new = "craft_draw::ui::BezierStyle"
status = "moved"
note = "A `ComponentStyle` built from the theme in `Component::style`; there is no `BezierOverlay::style(&tokens)` and no `look` setter."

[[type]]
name = "BezierTool"
old = "craft_draw::ui::BezierTool"
new = "craft_draw::ui::BezierTool"
status = "same"
note = "`Show` is now `Anchors`."

[[type]]
name = "HandlesShown"
old = "craft_draw::ui::HandlesShown"
new = "craft_draw::ui::HandlesShown"
status = "same"

[[type]]
name = "AnchorsShown"
old = "craft_draw::ui::AnchorsShown"
new = "craft_draw::ui::AnchorsShown"
status = "same"

[[type]]
name = "SegmentMark"
old = "craft_draw::ui::SegmentMark"
new = "craft_draw::ui::SegmentMark"
status = "same"

[[type]]
