# API map of the "draw canvas controls" family: old path to new path and setter renames.
# Filled in by the family track; the codemods and the app scan read it.

family = "draw canvas controls"
new_module = ""

# One entry per public type: `old` is the path an app calls today, `new` the path after migration.
# `status` is "pending", "same" (path unchanged), "moved", "replaced" (use `note`) or "removed".

[[type]]
name = "CropFrame"
old = ""
new = ""
status = "pending"

[[type]]
name = "TransformBox"
old = ""
new = ""
status = "pending"

[[type]]
name = "BezierOverlay"
old = ""
new = ""
status = "pending"

[[type]]
name = "PenDraft"
old = ""
new = ""
status = "pending"

[[type]]
name = "GradientOverlay"
old = ""
new = ""
status = "pending"

# One entry per renamed, removed or reshaped setter or constructor.
# [[setter]]
# type = ""
# old = ""
# new = ""

# craft_behavior::geometry (contract-geometry)
[[type]]
name = "Anchor9"
old = "craft_ui::canvas::quad::Anchor9"
new = "craft_behavior::Anchor9"
status = "moved"

[[type]]
name = "BoxState"
old = "craft_ui::canvas::quad::BoxState"
new = "craft_behavior::geometry::quad::BoxState"
status = "moved"

[[type]]
name = "BoxPart"
old = "craft_ui::canvas::quad::BoxPart"
new = "craft_behavior::geometry::quad::BoxPart"
status = "moved"

[[type]]
name = "BoxRules"
old = "craft_ui::canvas::quad::BoxRules"
new = "craft_behavior::geometry::quad::BoxRules"
status = "moved"

[[type]]
name = "BoxDrag"
old = "craft_ui::canvas::quad::BoxDrag"
new = "craft_behavior::geometry::quad::BoxDrag"
status = "moved"

[[type]]
name = "TransformMode"
old = "craft_ui::canvas::quad::TransformMode"
new = "craft_behavior::geometry::quad::TransformMode"
status = "moved"

[[type]]
name = "SnapTargets"
old = "craft_ui::canvas::SnapTargets"
new = "craft_behavior::geometry::snap::SnapTargets"
status = "moved"

[[type]]
name = "SnapKind"
old = "craft_ui::canvas::SnapKind"
new = "craft_behavior::geometry::snap::SnapKind"
status = "moved"

[[type]]
name = "OutlineDraft"
old = "craft_ui::canvas::draft::OutlineDraft"
new = "craft_behavior::geometry::draft::OutlineDraft"
status = "moved"

[[type]]
name = "DraftKind"
old = "craft_ui::canvas::draft::DraftKind"
new = "craft_behavior::geometry::draft::DraftKind"
status = "moved"

[[type]]
name = "drag"
old = "craft_ui::canvas::quad::drag"
new = "craft_behavior::geometry::quad::drag"
status = "moved"

[[setter]]
type = "Anchor9"
old = "Anchor9::Center"
new = "Anchor9::Centre"

[[setter]]
type = "DraftReach"
old = "of(&tokens)"
new = "new(close, same_point), the caller passes the hit tokens' target and slop"

[[setter]]
type = "BoxRules"
old = "drag_modifiers(part, modifiers) and drag_kind(part, modifiers)"
new = "drag_modifiers(part, mods) and drag_kind(part, mods)"

[[type]]
name = "ConstrainStyle"
old = "craft_ui::behavior::move_gesture::ConstrainStyle"
new = "craft_behavior::geometry::ConstrainStyle"
status = "moved"

[[type]]
name = "MoveValue"
old = "craft_ui::behavior::move_gesture::MoveValue"
new = "craft_behavior::geometry::MoveValue"
status = "moved"

[[type]]
name = "MoveGesture"
old = "craft_ui::behavior::move_gesture::MoveGesture"
new = "craft_behavior::geometry::MoveGesture"
status = "moved"

[[type]]
name = "StrokeLock"
old = "craft_ui::behavior::move_gesture::StrokeLock"
new = "craft_behavior::geometry::StrokeLock"
status = "moved"

[[type]]
name = "snap_ray"
old = "craft_ui::behavior::move_gesture::snap_ray"
new = ""
status = "removed"
note = "a point moved onto the nearest 45-degree ray from `origin` is `origin + craft_behavior::geometry::lock_direction(p - origin, None, Directions::Eight)`; the angle rounding is `craft_behavior::geometry::round_to_direction`"

[[type]]
name = "snap_direction"
old = "craft_ui::behavior::move_gesture::snap_direction"
new = ""
status = "removed"
note = "the unit direction is `lock_direction(p - origin, None, Directions::Eight)` divided by its length; a step other than 45 degrees has no caller"

[[setter]]
type = "MoveGesture"
old = "begin(style, start, modifiers, directions)"
new = "press(style, start, mods, directions), returning the gesture only: the tool makes its own begin event"

[[setter]]
type = "MoveGesture"
old = "drag(at, modifiers, zoom)"
new = "follow(at, mods, zoom), returning Option<MoveValue>: the tool makes its own update event"

[[setter]]
type = "MoveGesture"
old = "end(at, modifiers, zoom)"
new = "release(at, mods, zoom), returning MoveValue: the tool makes its own commit event with changed = value.changed()"

[[setter]]
type = "MoveGesture"
old = "cancel()"
new = "removed: CanvasTool::cancel owns the cancel and restores the tool's mark; the gesture is dropped"

[[setter]]
type = "ConstrainStyle"
old = "of(&tokens)"
new = "new(copy_reach, stroke_lock), a tool passes ToolContext.slop for both"

# draw-connector
[[type]]
name = "ConnectorTool"
old = "craft_draw::ui::connector::ConnectorTool"
new = "craft_draw::ui::connector::ConnectorTool"
status = "same"
note = "A `CanvasTool` that draws new connectors and shows the hover sites; its events are `Draw(EditEvent<ConnectorDraft>)` (a drag that ends on its start object is cancelled as `Dismissed`, a refused release as `Refused`). The selected connector's ends and bends are `ConnectorHandles`."

[[setter]]
type = "ConnectorTool"
old = "selected(Option<&ConnectorItem>)"
new = ""
note = "Removed: the selected connector is the value of `ConnectorHandles`."

[[setter]]
type = "ConnectorTool"
old = "connected(Option<Rect>)"
new = ""
note = "Removed: the host shows `AddBesideHandles` over the selected object."

[[setter]]
type = "ConnectorTool"
old = "labels(ConnectorToolLabels)"
new = ""
note = "Removed: the words are `ConnectorWords`."

[[type]]
name = "ConnectorHandles"
old = ""
new = "craft_draw::ui::connector::ConnectorHandles"
status = "replaced"
note = "The ends and bends of a selected connector as a canvas control: `ConnectorHandles::new(label, Bind<ConnectorItem>, &[ConnectionTarget])`, shown with `show_at(ui, body.rect)`. Output `ConnectorHandlesOutput { edit, event }`."

[[type]]
name = "ConnectorOverlay"
old = "craft_draw::ui::connector::ConnectorOverlay"
new = ""
status = "removed"
note = "The route and handles are painted by `ConnectorHandles`, the sites and the draft by `ConnectorTool`; there is no separate painter."

[[type]]
name = "ConnectorToolLabels"
old = "craft_draw::ui::connector::ConnectorToolLabels"
new = "craft_draw::ui::connector::ConnectorWords"
status = "removed"
note = "Words are `ConnectorWords`."

[[type]]
name = "ConnectorStyle"
old = "craft_draw::ui::connector::ConnectorStyle"
new = ""
status = "removed"
note = "The look comes from the theme in `paint` and in the handles' component style."

[[type]]
name = "ShapeDragTool"
old = "craft_draw::ui::shape_drag::ShapeDragTool"
new = "craft_draw::ui::shape_drag::ShapeDragTool"
status = "same"
note = "A `CanvasTool`; `ShapeDragEvent::Click` carries `mods: Mods`; a drag under 1 px is cancelled as `Dismissed`."

[[type]]
name = "ShapeDragToolLabels"
old = "craft_draw::ui::shape_drag::ShapeDragToolLabels"
new = "craft_draw::ui::shape_drag::ShapeDragWords"
status = "removed"
note = "Words are `ShapeDragWords`."

[[type]]
name = "ShapeDragStyle"
old = "craft_draw::ui::shape_drag::ShapeDragStyle"
new = ""
status = "removed"
note = "The outline is painted in the theme's overlay colours; the press slop is the canvas's."
