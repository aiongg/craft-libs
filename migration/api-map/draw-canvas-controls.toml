new = "craft_behavior::geometry::quad::BoxState"
status = "moved"

[[type]]
name = "BoxPart"
old = "craft_ui::canvas::quad::BoxPart"
new = "craft_behavior::geometry::quad::BoxPart"
status = "moved"

[[type]]
name = "BoxRules"
old = "craft_ui::canvas::quad::BoxRules"
new = "craft_behavior::geometry::quad::BoxRules"
status = "moved"

[[type]]
name = "BoxDrag"
old = "craft_ui::canvas::quad::BoxDrag"
new = "craft_behavior::geometry::quad::BoxDrag"
status = "moved"

[[type]]
name = "TransformMode"
old = "craft_ui::canvas::quad::TransformMode"
new = "craft_behavior::geometry::quad::TransformMode"
status = "moved"

[[type]]
name = "SnapTargets"
old = "craft_ui::canvas::SnapTargets"
new = "craft_behavior::geometry::snap::SnapTargets"
status = "moved"

[[type]]
name = "SnapKind"
old = "craft_ui::canvas::SnapKind"
new = "craft_behavior::geometry::snap::SnapKind"
status = "moved"

[[type]]
name = "OutlineDraft"
old = "craft_ui::canvas::draft::OutlineDraft"
new = "craft_behavior::geometry::draft::OutlineDraft"
status = "moved"

[[type]]
name = "DraftKind"
old = "craft_ui::canvas::draft::DraftKind"
new = "craft_behavior::geometry::draft::DraftKind"
status = "moved"

[[type]]
name = "drag"
old = "craft_ui::canvas::quad::drag"
new = "craft_behavior::geometry::quad::drag"
status = "moved"

[[setter]]
type = "Anchor9"
old = "Anchor9::Center"
new = "Anchor9::Centre"

[[setter]]
type = "DraftReach"
old = "of(&tokens)"
new = "new(close, same_point), the caller passes the hit tokens' target and slop"

[[setter]]
type = "BoxRules"
old = "drag_modifiers(part, modifiers) and drag_kind(part, modifiers)"
new = "drag_modifiers(part, mods) and drag_kind(part, mods)"

[[type]]
name = "ConstrainStyle"
old = "craft_ui::behavior::move_gesture::ConstrainStyle"
new = "craft_behavior::geometry::ConstrainStyle"
status = "moved"

[[type]]
name = "MoveValue"
old = "craft_ui::behavior::move_gesture::MoveValue"
new = "craft_behavior::geometry::MoveValue"
status = "moved"

[[type]]
name = "MoveGesture"
old = "craft_ui::behavior::move_gesture::MoveGesture"
new = "craft_behavior::geometry::MoveGesture"
status = "moved"

[[type]]
name = "StrokeLock"
old = "craft_ui::behavior::move_gesture::StrokeLock"
new = "craft_behavior::geometry::StrokeLock"
status = "moved"

[[type]]
name = "snap_ray"
old = "craft_ui::behavior::move_gesture::snap_ray"
new = ""
status = "removed"
note = "a point moved onto the nearest 45-degree ray from `origin` is `origin + craft_behavior::geometry::lock_direction(p - origin, None, Directions::Eight)`; the angle rounding is `craft_behavior::geometry::round_to_direction`"

[[type]]
name = "snap_direction"
old = "craft_ui::behavior::move_gesture::snap_direction"
new = ""
status = "removed"
note = "the unit direction is `lock_direction(p - origin, None, Directions::Eight)` divided by its length; a step other than 45 degrees has no caller"

[[setter]]
type = "MoveGesture"
old = "begin(style, start, modifiers, directions)"
new = "press(style, start, mods, directions), returning the gesture only: the tool makes its own begin event"

[[setter]]
type = "MoveGesture"
old = "drag(at, modifiers, zoom)"
new = "follow(at, mods, zoom), returning Option<MoveValue>: the tool makes its own update event"

[[setter]]
type = "MoveGesture"
old = "end(at, modifiers, zoom)"
new = "release(at, mods, zoom), returning MoveValue: the tool makes its own commit event with changed = value.changed()"

[[setter]]
type = "MoveGesture"
old = "cancel()"
new = "removed: CanvasTool::cancel owns the cancel and restores the tool's mark; the gesture is dropped"

[[setter]]
type = "ConstrainStyle"
old = "of(&tokens)"
new = "new(copy_reach, stroke_lock), a tool passes ToolContext.slop for both"

# draw-pen-b: the Pen tool and the corner widgets

[[type]]
name = "PenTool"
old = ""
new = "craft_draw::ui::pen::PenTool"
status = "replaced"
note = "The pen draft as a `CanvasTool`; setters `draft`, `mode`, `sensing`, `auto_add_delete`, `path_options`, `ends`, `remove_last`; `take_events` returns `PenEvent`s."

[[type]]
name = "PenResponse"
old = "craft_draw::ui::pen::PenResponse"
new = ""
status = "removed"
note = "The tool reports `PenEvent::{Edit, Finished, Resumed}` through `take_events`; `closes` is `PenTool::closes`, and `claimed` goes (the tool host owns the press)."

[[type]]
name = "PenEvent"
old = ""
new = "craft_draw::ui::pen::PenEvent"
status = "replaced"
note = "Replaces the fields of `PenResponse`: `event` is `Edit`, `finished` is `Finished`, `resumed` is `Resumed`."

[[type]]
name = "PenNames"
old = "craft_draw::ui::pen::PenNames"
new = ""
status = "removed"
note = "The words are `PenWords`, read from the env."

[[type]]
name = "PenWords"
old = ""
new = "craft_draw::ui::pen::PenWords"
status = "replaced"
note = "The `words!` set of the pen: group, anchor template, undo step name."

[[type]]
name = "PenStyle"
old = "craft_draw::ui::pen::PenStyle"
new = "craft_draw::ui::pen::PenStyle"
status = "same"
note = "Built from a `StyleCx` in a paint call with `PenStyle::of`; the sizes are the theme handle look and dash tokens."

[[type]]
name = "CornerWidgets"
old = "craft_draw::ui::corner::CornerWidgets"
new = "craft_draw::ui::corner::CornerWidgets"
status = "same"
note = "A canvas control over `Bind<Vec<CornerTarget>>`; `new(label, targets)`."

[[type]]
name = "CornerWidgetsResponse"
old = "craft_draw::ui::corner::CornerWidgetsResponse"
new = ""
status = "removed"
note = "The output is `CornerWidgetsOutput { edit, change, cycle_kind, activate }`."

[[type]]
name = "CornerWidgetsOutput"
old = ""
new = "craft_draw::ui::corner::CornerWidgetsOutput"
status = "replaced"
note = "The edit of the bound targets, the `CornerEdit` operation, the corner to cycle and the corner to activate."

[[type]]
name = "CornerWidgetsLabels"
old = "craft_draw::ui::corner::CornerWidgetsLabels"
new = ""
status = "removed"
note = "The words are `CornerWords`."

[[type]]
name = "CornerWords"
old = ""
new = "craft_draw::ui::corner::CornerWords"
status = "replaced"
note = "The `words!` set of the corner widgets."

[[type]]
name = "CornerStyle"
old = "craft_draw::ui::corner::CornerStyle"
new = "craft_draw::ui::corner::CornerStyle"
status = "same"
note = "A `ComponentStyle` of `CornerWidgets` with private fields; `look` is gone."

[[setter]]
type = "PenTool"
old = "PenDraft::new(id_salt, draft, names)"
new = "PenTool::new()"
note = "The tool keeps the draft; `draft(Option<&EditSubpath>)` hands in a resumed path only."

[[setter]]
type = "PenTool"
old = "units(x, y) / zero(point)"
new = ""
note = "The anchors read the units and zero from `ToolContext::space()?.rulers()`."

[[setter]]
type = "PenTool"
old = "look(PenStyle)"
new = ""
note = "The look is built from the theme in the paint call."

[[setter]]
type = "PenTool"
old = "remove_last(bool)"
new = "remove_last() -> bool"
note = "Called by the host when Undo runs, not set each pass; false while a press is held."

[[setter]]
type = "PenTool"
old = "sensing(bool)"
new = "sensing(bool)"
note = "Also kept: `takes` is false while Cmd is held."

[[setter]]
type = "CornerWidgets"
old = "new(id_salt, targets, units)"
new = "new(label, Bind<Vec<CornerTarget>>)"
note = "The units come from the canvas rulers; the edit is the bound value and the `CornerEdit` operation is reported as `change`."

[[setter]]
type = "CornerWidgets"
old = "kinds(bool)"
new = "kinds(bool)"
note = "A prop; `cycle_kind` reports the corner only."

[[setter]]
type = "CornerWidgets"
old = "steps(step, big_step)"
new = ""
note = "The arrow steps are the canvas nudge distances (1 and, with Shift, 10)."

[[setter]]
type = "CornerWidgets"
old = "labels(CornerWidgetsLabels)"
new = ""
note = "Words come from the env."

[[setter]]
type = "CornerWidgets"
old = "look(CornerStyle)"
new = ""
note = "The style is the component style."

[[setter]]
type = "CornerWidgets"
old = "policy(EditPolicy)"
new = ""
note = "The bound value carries the policy."
