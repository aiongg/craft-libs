status = "replaced"
note = "A canvas control (`#[component(canvas_control)]`) shown with `show_at(ui, canvas_rect)` inside a `Canvas`; its buttons are parts in the canvas arena, so a press on one reaches the control before the tool. The tool stops hit-testing and painting the buttons and takes `AddBesideOutput::added`."

