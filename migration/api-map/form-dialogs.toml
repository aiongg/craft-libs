# ParamDialog and CommandForm (form-dialogs-b).

[[setter]]
type = "ParamDialog"
old = "ParamDialog::new(key, title: impl Into<String>, params: Vec<Param>)"
new = "ParamDialog::new(key, title: impl Into<Label>, params: impl Into<Cow<[Param]>>)"

[[setter]]
type = "ParamDialog"
old = "instance(id)"
new = ""
note = "Removed: a hosted dialog is named with `HostedParamDialog::instance`; a shown one is told apart by its key."

[[setter]]
type = "ParamDialog"
old = "values(DialogFields)"
new = "values(Bind<DialogFields>)"
note = "Without a binding the dialog keeps its values between passes; the opening snapshot is taken on the first pass."

[[setter]]
type = "ParamDialog"
old = "remember(key: impl Into<String>)"
new = "remember(SaveKey)"
note = "Opens with the saved values; `ParamResult::remember(ui)` stores them after the command succeeds."

[[setter]]
type = "ParamDialog"
old = "ok_enabled(bool)"
new = "ok_enabled(bool)"
note = "Unchanged; `set_ok_enabled` is gone, the next pass passes the value."

[[setter]]
type = "ParamDialog"
old = "set_ok_enabled(bool)"
new = ""
note = "Removed: the dialog is built each pass, so `ok_enabled` takes the current value."

[[setter]]
