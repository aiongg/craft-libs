# API map of the "Imaging layer style" family: old path to new path and setter renames.

family = "Imaging layer style"
new_module = "craft_imaging::ui::layer_style"

[[type]]
name = "LayerStyleDialog"
old = "craft_imaging::ui::layer_style::LayerStyleDialog"
new = "craft_imaging::ui::layer_style::LayerStyleDialog"
status = "same"

[[type]]
name = "LayerStyleOutput"
old = "craft_imaging::ui::layer_style::LayerStyleOutput"
new = "craft_imaging::ui::layer_style::LayerStyleOutput"
status = "same"

[[type]]
name = "PatternChoice"
old = "craft_imaging::ui::layer_style::PatternChoice"
new = ""
status = "removed"
note = "the host's patterns are PresetRow<String> rows of the preset library"

[[type]]
name = "StylePresets"
old = "craft_imaging::ui::layer_style::StylePresets"
new = "craft_imaging::ui::layer_style::StylePresets"
status = "same"

[[type]]
name = "StyleThumb"
old = "craft_imaging::ui::layer_style::StyleThumb"
new = ""
status = "removed"
note = "StylePresets::new takes the thumbnail painter closure itself"

[[type]]
name = "LayerStyleLabels"
old = "craft_imaging::ui::layer_style::LayerStyleLabels"
new = ""
status = "removed"
note = "the words! set is LayerStyleWords"

[[type]]
name = "LayerStyleWords"
old = ""
new = "craft_imaging::ui::layer_style::LayerStyleWords"
status = "replaced"
note = "the words! set that replaces LayerStyleLabels, with the legacy field names"

[[type]]
name = "LayerStyleCommand"
old = ""
new = "craft_imaging::ui::layer_style::LayerStyleCommand"
status = "replaced"
note = "the + and - keys of the effect list as a command set in the layerStyleList scope"

[[type]]
name = "LayerStyleDialogStyle"
old = "craft_imaging::ui::layer_style::LayerStyleDialogStyle"
new = ""
status = "removed"
note = "sizes come from the controls the dialog uses"

[[setter]]
type = "LayerStyleDialog"
old = "new(id_salt, draft, channel_names, numbers)"
new = "new(label, draft, channel_names)"

[[setter]]
type = "LayerStyleDialog"
old = "blend_modes(&[BlendChoice])"
new = "blend_modes(&[Entry<String>])"

[[setter]]
type = "LayerStyleDialog"
old = "patterns(&[PatternChoice])"
new = "patterns(&[PresetRow<String>])"

[[setter]]
type = "LayerStyleDialog"
old = "sampler(&Sampler)"
new = "sampler(impl Fn(&[[f32; 2]]) -> Vec<f32>)"

[[setter]]
type = "LayerStyleDialog"
old = "labels"
new = ""
note = "removed: the words come from the scope (LayerStyleWords)"

[[setter]]
type = "LayerStyleDialog"
old = "policy"
new = ""
note = "removed: the policy belongs to the binding"

[[setter]]
type = "LayerStyleDialog"
old = "enabled"
new = ""
note = "removed: the dialog follows the scope's enabled state"

[[setter]]
type = "StylePresets"
old = "new(state, rows, thumb)"
new = "new(rows, thumb)"
