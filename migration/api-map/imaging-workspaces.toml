# API map of the "imaging workspaces" family: old path to new path and setter renames.
# Filled in by the family track; the codemods and the app scan read it.

family = "imaging workspaces"
new_module = ""

# One entry per public type: `old` is the path an app calls today, `new` the path after migration.
# `status` is "pending", "same" (path unchanged), "moved", "replaced" (use `note`) or "removed".

# One entry per renamed, removed or reshaped setter or constructor.
# [[setter]]
# type = ""
# old = ""
# new = ""

# img-vanishing

[[type]]
name = "VanishingPointWorkspace"
old = "craft_imaging::ui::vanishing_point::VanishingPointWorkspace"
new = "craft_imaging::ui::vanishing_point::VanishingPointWorkspace"
status = "replaced"
note = "A pattern the app holds: `show(ui, scene, source)` takes a `Ui` (was a `Context`) and reports `closed: Option<DialogRole>` (was `outcome`) and `response` (was `rect`); `step(craft_behavior::Step)` is the app's Undo and Redo, `momentary(..)` the app's fired Hand and Zoom commands; the preview is `VanishingPointSource::preview_job` (no ticket, no `preview_ready`, no `preview_failed`). The view and the strip's memory live in the dialog body."

[[type]]
name = "VanishingPointEditor"
old = "craft_imaging::ui::vanishing_point::VanishingPointEditor"
new = "craft_imaging::ui::vanishing_point::VanishingPointEditor"
status = "replaced"
note = "`pass(session, settings, scene, source)` returns a `VanishingPointPass` whose `tool()` is the canvas tool and `planes()` the canvas control; `delete_selected` takes the history step's name; `cancel(session, reason)` ends a drag (the host cancels only the tool's presses); `add_plane` adds a plane from four typed corners; `labels`, `cursor_options` and `style` are gone."

[[type]]
name = "VanishingPointPass"
old = "craft_imaging::ui::vanishing_point::VanishingPointPass"
new = "craft_imaging::ui::vanishing_point::VanishingPointPass"
status = "replaced"
note = "No longer the `CanvasTool`: `tool()` gives the `VanishingPointTool` and `planes()` the `VanishingPlanes` control; both share the pass."

[[type]]
name = "VanishingPointBar"
old = "craft_imaging::ui::vanishing_point::VanishingPointBar"
new = "craft_imaging::ui::vanishing_point::VanishingPointBar"
status = "replaced"
note = "A pattern over `&VanishingPointSettings`: `VanishingPointBar::new(tool, &settings, paste, has_clip).has_strokes(..).show(ui)`; it takes no id salt and no labels and edits nothing in place."

[[type]]
name = "VanishingPointBarOutput"
old = "craft_imaging::ui::vanishing_point::VanishingPointBarOutput"
new = "craft_imaging::ui::vanishing_point::VanishingPointBarOutput"
status = "replaced"
note = "`edit` is an `EditEvent<VanishingPointSettings>` and `paste_width` an `EditEvent<f64>` (was `paste: Option<PasteImage>`); gains an `Outcome` impl."

[[type]]
name = "VanishingPointLabels"
old = "craft_imaging::ui::vanishing_point::VanishingPointLabels"
new = ""
status = "removed"
note = "Replaced by `VanishingPointWords`; the tools' names are the labels of `VanishingPointCommands`."

[[type]]
name = "VanishingPointStyle"
old = "craft_imaging::ui::vanishing_point::VanishingPointStyle"
new = "craft_imaging::ui::vanishing_point::VanishingPointStyle"
status = "replaced"
note = "A `ComponentStyle` of the planes control built from `StyleCx`; it has no public fields and no `of(tokens)`."

[[type]]
name = "VanishingPointSource"
old = "craft_imaging::ui::vanishing_point::VanishingPointSource"
new = "craft_imaging::ui::vanishing_point::VanishingPointSource"
status = "replaced"
note = "`paste()` returns `Option<&dyn RasterSource>` (was a `SizedTexture`); gains `preview_job`."

[[type]]
name = "VanishingPointOpen"
old = "craft_imaging::ui::vanishing_point::VanishingPointOpen"
new = "craft_imaging::ui::vanishing_point::VanishingPointOpen"
status = "replaced"
note = "Loses `cursor_options`; `checkerboard` is a `craft_ui::primitives::Checker` and `navigation` stays."

[[type]]
name = "VanishingPointOutput"
old = "craft_imaging::ui::vanishing_point::VanishingPointOutput"
new = "craft_imaging::ui::vanishing_point::VanishingPointOutput"
status = "replaced"
note = "`closed` replaces `outcome`, `response` replaces `rect`; `preview_wanted` is gone (the workspace starts the preview job itself)."

[[type]]
name = "VanishingPointStripTool"
old = "craft_imaging::ui::vanishing_point::VanishingPointStripTool"
new = "craft_imaging::ui::vanishing_point::VanishingPointStripTool"
status = "same"

[[type]]
name = "VanishingPointEvent"
old = "craft_imaging::ui::vanishing_point::VanishingPointEvent"
new = "craft_imaging::ui::vanishing_point::VanishingPointEvent"
status = "same"

[[type]]
name = "paint_editor"
old = "craft_imaging::ui::vanishing_point::paint_editor"
new = ""
status = "removed"
note = "The planes control paints itself (`VanishingPointPass::planes`)."

[[type]]
