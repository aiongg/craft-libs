[[setter]]
type = "ContentAwareFillWorkspace"
old = "show(ctx, source)"
new = "show(ui, source)"
note = "Shown in a Ui; the output has closed: Option<DialogRole> and apply: bool in place of outcome."

[[setter]]
type = "ContentAwareFillWorkspace"
old = "navigation(options)"
new = "navigation(options)"
note = "Unchanged name; NavigationOptions is craft_ui::canvas::NavigationOptions."

[[setter]]
type = "ContentAwareFillWorkspace"
old = "checkerboard(checkerboard)"
new = "checkerboard(checker)"
note = "Checker replaces Checkerboard."

[[setter]]
type = "ContentAwareFillWorkspace"
old = "cursor_options(options)"
new = "cursor_options(options)"
note = "BrushCursorOptions replaces CursorOptions."

[[setter]]
type = "ContentAwareFillWorkspace"
old = "preview_ready(ticket)"
new = ""
note = "Removed: the preview job is a Pending the workspace polls; the source gives FillSource::preview_job."

[[setter]]
type = "ContentAwareFillWorkspace"
old = "preview_failed(ticket, message)"
new = ""
note = "Removed: a failed job shows through FullWindowStatus."

[[setter]]
type = "FillOutput"
old = "preview_wanted"
new = ""
note = "Replaced by FillSource::preview_job."

[[setter]]
type = "FillOutput"
old = "outcome"
new = "closed, apply"
note = "closed: Option<DialogRole> (Accept, Cancel) and apply: bool."

[[setter]]
type = "FillCanvas"
old = "cursor_options(options)"
new = ""
note = "Removed: the workspace passes the cursor options to the tool."

[[setter]]
type = "ContentAwareFillWorkspace"
old = "step(step)"
new = "step(step)"
note = "Step is craft_behavior::edit_history::Step; with a stroke open the step waits for the next pass."

[[setter]]
type = "ContentAwareFillWorkspace"
old = "zoom(keys)"
new = ""
note = "Removed: the zoom chords are the ViewCommand scope of the dialog."
