# API map of the "Review" family: old path to new path and setter renames.
# Filled in by the family track; the codemods and the app scan read it.

family = "Review"
new_module = "craft_review::ui"

# One entry per public type: `old` is the path an app calls today, `new` the path after migration.
# `status` is "pending", "same" (path unchanged), "moved", "replaced" (use `note`) or "removed".

# review-b

[[type]]
name = "VersionHistoryPanel"
old = "craft_review::ui::VersionHistoryPanel"
new = "craft_review::ui::VersionHistoryPanel"
status = "replaced"
note = "A `Pattern` over a `Stack` with a tree `List`; `new(versions, branches, now)`, `previewing(..)`; panel state lives in the body's session slot."

[[type]]
name = "VersionHistoryPanelOutput"
old = "craft_review::ui::VersionHistoryPanelOutput"
new = "craft_review::ui::VersionHistoryPanelOutput"
status = "same"

[[type]]
name = "VersionPreviewBanner"
old = "craft_review::ui::VersionPreviewBanner"
new = "craft_review::ui::VersionPreviewBanner"
status = "replaced"
note = "A `Pattern` shown with `show(ui, canvas)`; `new(version, now)`; a `Popover` at the top of the canvas."

[[type]]
name = "VersionPreviewBannerOutput"
old = "craft_review::ui::VersionPreviewBannerOutput"
new = "craft_review::ui::VersionPreviewBannerOutput"
status = "same"

[[type]]
name = "VersionAction"
old = "craft_review::ui::VersionAction"
new = "craft_review::ui::VersionAction"
status = "same"

[[type]]
name = "SignaturePadDialog"
old = "craft_review::ui::SignaturePadDialog"
new = "craft_review::ui::SignaturePadDialog"
status = "replaced"
note = "A `StackDialog` on `Dialog`; the draw pad is the leaf `DrawPad`."

[[type]]
name = "SignaturePadResult"
old = "craft_review::ui::SignaturePadResult"
new = "craft_review::ui::SignaturePadResult"
status = "same"

[[type]]
name = "SignatureSettings"
old = "craft_review::ui::SignatureSettings"
new = "craft_review::ui::SignatureSettings"
status = "same"

[[type]]
name = "paint_signature"
old = "craft_review::ui::paint_signature"
new = "craft_review::ui::paint_signature"
status = "replaced"
note = "Takes a `Draw`, the rect, the signature and a `DataColor`; an image signature is shown with a `Picture`."

[[type]]
name = "RevisionsPanel"
old = "craft_review::ui::RevisionsPanel"
new = "craft_review::ui::RevisionsPanel"
status = "replaced"
note = "A `Pattern`; `new(label, compared_with, revisions)`, `by_position(..)`."

[[type]]
name = "RevisionsPanelOutput"
old = "craft_review::ui::RevisionsPanelOutput"
new = "craft_review::ui::RevisionsPanelOutput"
status = "same"

[[type]]
name = "PeopleBar"
old = "craft_review::ui::PeopleBar"
new = "craft_review::ui::PeopleBar"
status = "replaced"
