# API map of the "Review" family: old path to new path and setter renames.
# Filled in by the family track; the codemods and the app scan read it.

family = "Review"
new_module = "craft_review::ui"

# One entry per public type: `old` is the path an app calls today, `new` the path after migration.
# `status` is "pending", "same" (path unchanged), "moved", "replaced" (use `note`) or "removed".

# One entry per renamed, removed or reshaped setter or constructor.
# [[setter]]
# type = ""
# old = ""
# new = ""

# review-c

[[type]]
name = "CommentsPanel"
old = "craft_review::ui::CommentsPanel"
new = "craft_review::ui::CommentsPanel"
status = "moved"

[[type]]
name = "CommentsPanelOutput"
old = "craft_review::ui::CommentsPanelOutput"
new = "craft_review::ui::CommentsPanelOutput"
status = "moved"

[[type]]
name = "CommentsPanelState"
old = "craft_review::ui::CommentsPanelState"
new = "craft_review::ui::CommentsPanelState"
status = "moved"

[[type]]
name = "CommentEdit"
old = "craft_review::ui::CommentEdit"
new = "craft_review::ui::CommentEdit"
status = "moved"

[[type]]
name = "CommentPins"
old = "craft_review::ui::CommentPins"
new = "craft_review::ui::CommentPins"
status = "moved"

[[type]]
name = "CommentPin"
old = "craft_review::ui::CommentPin"
new = "craft_review::ui::CommentPin"
status = "same"

[[type]]
name = "CommentPinsOutput"
old = "craft_review::ui::CommentPinsOutput"
new = "craft_review::ui::CommentPinsOutput"
status = "moved"

[[type]]
name = "PinMove"
old = "craft_review::ui::PinMove"
new = "craft_review::ui::PinMove"
status = "same"

[[type]]
name = "PinCluster"
old = "craft_review::ui::PinCluster"
new = "craft_review::ui::PinCluster"
status = "same"

[[type]]
name = "ThreadPopover"
old = "craft_review::ui::ThreadPopover"
new = "craft_review::ui::ThreadPopover"
status = "moved"

[[type]]
name = "ThreadPopoverOutput"
old = "craft_review::ui::ThreadPopoverOutput"
new = "craft_review::ui::ThreadPopoverOutput"
status = "moved"

[[type]]
name = "CommentComposer"
old = "craft_review::ui::CommentComposer"
new = "craft_review::ui::CommentComposer"
status = "moved"

[[type]]
name = "CommentComposerResponse"
old = "craft_review::ui::thread::CommentComposerResponse"
new = "craft_review::ui::CommentComposerOutput"
status = "replaced"
note = "`closed` is `cancelled`; `posted` is unchanged."

[[type]]
name = "CommentsLabels"
old = "craft_review::ui::CommentsLabels"
new = "craft_review::ui::CommentsWords"
status = "removed"
note = "Replaced by the words! set of the new name; apps no longer pass labels."

[[type]]
name = "ThreadLabels"
old = "craft_review::ui::ThreadLabels"
new = "craft_review::ui::ThreadWords"
status = "removed"
note = "Replaced by the words! set of the new name; apps no longer pass labels."

[[setter]]
type = "CommentsPanel"
old = "new(id_salt, threads, state)"
new = "new(label, threads, state)"

[[setter]]
type = "CommentsPanel"
old = "labels(CommentsLabels)"
new = ""

[[setter]]
type = "CommentsPanel"
old = "annotate_labels(AnnotateLabels)"
new = ""

[[setter]]
type = "CommentsPanel"
old = "(no time prop)"
new = "now(unix_seconds)"

[[setter]]
type = "CommentPins"
old = "new(id_salt, pins, me)"
new = "new(label, pins, me)"

[[setter]]
type = "CommentPins"
old = "labels(ThreadLabels)"
new = ""

[[setter]]
type = "CommentPinsOutput"
old = "moved: Option<EditEvent<PinMove>>"
new = "moved: Option<PinMove>"

[[setter]]
type = "ThreadPopover"
old = "new(id_salt, thread, anchor_rect, me, people, draft)"
new = "new(thread, opener_response, me, people, draft)"

[[setter]]
type = "ThreadPopover"
old = "labels(ThreadLabels)"
new = ""

[[setter]]
type = "ThreadPopover"
old = "(no time prop)"
new = "now(unix_seconds)"

[[setter]]
type = "CommentComposer"
old = "new(id_salt, anchor, draft)"
new = "new(anchor, draft)"

[[setter]]
type = "CommentComposer"
old = "labels(ThreadLabels)"
new = ""

# review-a

[[type]]
name = "AnnotateTool"
old = "craft_review::ui::annotate::AnnotateTool"
new = "craft_review::ui::annotate::AnnotateTool"
status = "same"
note = "A `CanvasTool` on the new tool host. Pointers arrive in screen points and the tool maps them to page units with the canvas's space. `take_edits` and the public fields stay; a selection edit carries a `SelectionChange` (`Set`, `Toggle`, `Clear`); edit events carry the undo step's name and a `Mixed` before value. `new_annotation_params` and `create_from_form` serve the `New Annotation...` command form."

[[type]]
name = "AnnotationOverlay"
old = "craft_review::ui::annotate::AnnotationOverlay"
new = "craft_review::ui::annotate::AnnotationOverlay"
status = "same"
note = "A canvas control: `new(label, annotations, selected)` and `show_at(ui, canvas_rect)`. `paint(painter, tokens, to_screen)` is gone: the view is the canvas's."

[[type]]
name = "AnnotationToolbar"
old = "craft_review::ui::annotate::AnnotationToolbar"
new = "craft_review::ui::annotate::AnnotationToolbar"
status = "same"
note = "A pattern over a `Bar`: `new(tool)` (the id salt is gone) and `show(ui)`. Each group is a `FlyoutButton` of `AnnotateCommand`s."

[[type]]
name = "AnnotationToolbarOutput"
old = "craft_review::ui::annotate::AnnotationToolbarOutput"
new = "craft_review::ui::annotate::AnnotationToolbarOutput"
status = "same"
note = "`response` and `changed`; `flyouts` is gone."

[[type]]
name = "AnnotateLabels"
old = "craft_review::ui::annotate::AnnotateLabels"
new = "craft_review::ui::annotate::AnnotateWords"
status = "replaced"
note = "Words register through `words!`. The per-tool tooltips are the labels of `AnnotateCommand`; `kind` and `palette_color` stay beside the type."

[[setter]]
type = "AnnotationToolbar"
old = "new(id_salt, tool)"
new = "new(tool)"

[[setter]]
type = "AnnotationToolbar"
old = "labels(labels)"
note = "Removed: words register through `words!`."

[[setter]]
type = "AnnotationToolbarOutput"
old = "flyouts"
note = "Removed: `FlyoutButton` owns its flyout."

[[setter]]
type = "AnnotationOverlay"
old = "new(annotations, selected)"
new = "new(label, annotations, selected)"

[[setter]]
type = "AnnotationOverlay"
old = "paint(painter, tokens, to_screen)"
new = "show_at(ui, rect)"
note = "The overlay maps through the canvas's view."
