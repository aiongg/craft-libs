# API map of the "Sections and title rows" family: old path to new path and setter renames.
# Filled in by the family track; the codemods and the app scan read it.

family = "Sections and title rows"
new_module = "craft_ui::sections"

# One entry per public type: `old` is the path an app calls today, `new` the path after migration.
# `status` is "pending", "same" (path unchanged), "moved", "replaced" (use `note`) or "removed".

[[type]]
name = "SectionHeader"
old = "craft_ui::composites::section_header::SectionHeader"
new = "craft_ui::sections::SectionHeader"
status = "pending"

