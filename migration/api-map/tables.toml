# API map of the "Tables" family: old path to new path and setter renames.
# Filled in by the family track; the codemods and the app scan read it.

family = "Tables"
new_module = "craft_ui::table"

# One entry per public type: `old` is the path an app calls today, `new` the path after migration.
# `status` is "pending", "same" (path unchanged), "moved", "replaced" (use `note`) or "removed".

[[type]]
name = "Table"
old = "craft_ui::list::table::Table"
new = "craft_ui::table::Table"
status = "pending"

[[type]]
name = "MetadataTable"
old = "craft_ui::list::metadata::MetadataTable"
new = "craft_ui::table::MetadataTable"
status = "moved"
note = "a pattern over Table; show(ui) is an inherent method of the pattern"

# One entry per renamed, removed or reshaped setter or constructor.
# [[setter]]
# type = ""
# old = ""
# new = ""

# MetadataTable (tables-b).

[[type]]
name = "MetadataTableOutput"
old = "craft_ui::list::metadata::MetadataTableOutput"
new = "craft_ui::table::MetadataTableOutput"
status = "moved"
note = "response becomes table (CollectionResponse); chosen_changed is a method; checked lists the changed keys"

[[type]]
name = "MetadataRow"
old = "craft_ui::list::metadata::MetadataRow"
new = "craft_ui::table::MetadataRow"
status = "moved"
note = "key and locked are derived setters; matches(query) is new"

[[type]]
name = "MetadataGroup"
old = "craft_ui::list::metadata::MetadataGroup"
new = "craft_ui::table::MetadataGroup"
status = "moved"
note = "non_exhaustive: build with MetadataGroup::new(name, rows)"

[[type]]
name = "MetadataStyle"
old = "craft_ui::list::metadata::MetadataStyle"
new = ""
status = "removed"
note = "sizes and colours come from Table, ListRow and the tokens; the pattern has no style"

[[type]]
name = "MetadataLabels"
old = "craft_ui::list::metadata::MetadataLabels"
new = ""
status = "removed"
note = "the words are installed words (MetadataWords)"

[[type]]
name = "filter_metadata"
old = "craft_ui::list::metadata::filter_metadata"
new = ""
status = "removed"
note = "use MetadataRow::matches(query); the table filters its own rows"

[[setter]]
type = "MetadataTable"
old = "new(id_salt, &[MetadataGroup])"
new = "new(label, &[MetadataGroup])"

[[setter]]
type = "MetadataTable"
old = "max_height(f32)"
new = ""
note = "removed: the table sizes by Sizing and the room it is given"

[[setter]]
type = "MetadataTable"
old = "labels(MetadataLabels)"
new = ""
note = "removed: installed words"
