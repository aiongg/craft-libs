# API map of the "Tables" family: old path to new path and setter renames.
# Filled in by the family track; the codemods and the app scan read it.

family = "Tables"
new_module = "craft_ui::table"

# One entry per public type: `old` is the path an app calls today, `new` the path after migration.
# `status` is "pending", "same" (path unchanged), "moved", "replaced" (use `note`) or "removed".

[[type]]
name = "Table"
old = "craft_ui::list::table::Table"
new = "craft_ui::table::Table"
status = "pending"

[[type]]
name = "MetadataTable"
old = "craft_ui::list::metadata::MetadataTable"
new = "craft_ui::table::MetadataTable"
status = "pending"

# One entry per renamed, removed or reshaped setter or constructor.
# [[setter]]
# type = ""
# old = ""
# new = ""
