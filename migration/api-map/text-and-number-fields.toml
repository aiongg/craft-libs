# API map of the "Text and number fields" family: old path to new path and setter renames.
# Filled in by the family track; the codemods and the app scan read it.

family = "Text and number fields"
new_module = "craft_ui::text"

# One entry per public type: `old` is the path an app calls today, `new` the path after migration.
# `status` is "pending", "same" (path unchanged), "moved", "replaced" (use `note`) or "removed".

[[type]]
name = "TextField"
old = "craft_ui::controls::text_field::TextField"
new = "craft_ui::text::TextField"
status = "pending"

[[type]]
name = "SearchField"
old = "craft_ui::controls::text_field::SearchField"
new = "craft_ui::text::SearchField"
status = "pending"

[[type]]
name = "AltTextField"
old = "craft_ui::controls::alt_text::AltTextField"
new = "craft_ui::text::AltTextField"
status = "pending"

[[type]]
name = "NumberField"
old = "craft_ui::controls::number_field::NumberField"
new = "craft_ui::text::NumberField"
status = "moved"
note = "A `Component`: `NumberField::new(label, Bind<Option<f64>>)`; the locale's digits, separators and units are the `NumberCodec` given to `.codec(..)`, and a blank field is `None`. `craft_ui::localized::NumberField` (deprecated) has the same replacement: its `LocaleNumbers` become a `NumberCodec` over a `quantity::Reader`. `show_full`, `show_optional` and `show_optional_full` are `show`; its `NumberOutput` is the edit response (through `Deref`) and `preset`."

[[type]]
name = "NumberOutput"
old = "craft_ui::controls::number_field::NumberFieldOutput"
new = "craft_ui::text::NumberOutput"
status = "moved"
note = "The edit response of the value is `.edit` (and derefs); `preset` is the position of a picked `Preset::Choice` row."

[[type]]
name = "Preset"
old = "craft_ui::controls::number_field::Preset"
new = "craft_ui::text::Preset"
status = "moved"
note = "`Preset::value(label, number)`, `Preset::choice(label, checked)` and `Preset::Separator`; labels are `Label`s. The rows go to `NumberField::presets(&[Preset])`."

[[type]]
name = "PresetSource"
old = "craft_ui::controls::number_field::PresetSource"
new = ""
status = "removed"
note = "Private in legacy; the three preset builders it served (`presets(&[(label, value)])`, `preset_rows`, `preset_list`) are one `presets(&[Preset])`."

[[type]]
name = "FieldRule"
old = "craft_ui::controls::number_field::FieldRule"
new = ""
status = "removed"
note = "The field applies its range and step itself. A composite that replayed `apply` with a rule shows a `NumberField` per value instead."

[[type]]
name = "LocalizedDragValue"
old = "craft_ui::localized::LocalizedDragValue"
new = ""
status = "replaced"
note = "Deprecated drag value; use `NumberField::new(label, bind).scrub_by_label()` with a `NumberCodec` for the locale."

[[type]]
name = "ChipField"
old = "craft_ui::controls::chips::ChipField"
new = "craft_ui::text::ChipField"
status = "pending"

[[type]]
name = "LinkedFields"
old = "craft_ui::controls::linked::LinkedFields"
new = "craft_ui::text::LinkedFields"
status = "pending"

[[type]]
name = "ApplyRow"
old = "craft_ui::controls::mixed::ApplyRow"
new = "craft_ui::text::ApplyRow"
status = "pending"

# One entry per renamed, removed or reshaped setter or constructor.
# [[setter]]
# type = ""
# old = ""
# new = ""

[[setter]]
type = "NumberField"
old = "new(id_salt, label, value, numbers)"
new = "new(label, Bind<Option<f64>>)"
note = "`id_salt` is `Props::id_salt`; the locale is the codec; `optional(..)` is the same constructor with a `None` value."

[[setter]]
type = "NumberField"
old = "with_id(Id)"
new = "id_salt(..)"

[[setter]]
type = "NumberField"
old = "width(f32)"
new = ""
note = "Removed: the width is the sample text, the unit and the chevrons."

[[setter]]
type = "NumberField"
old = "labels(NumberFieldLabels)"
new = ""
note = "Removed: built-in words come from the word set."

[[setter]]
type = "NumberField"
old = "range(RangeInclusive<V>)"
new = "range(RangeInclusive<f64>)"

[[setter]]
type = "NumberField"
old = "snap_typed(bool)"
new = ""
note = "Removed: a typed value is held to the range and kept as typed."

[[setter]]
type = "NumberField"
old = "decimals(RangeInclusive<usize>)"
new = "codec(NumberCodec::new(reader, decimals))"

[[setter]]
type = "NumberField"
old = "commit_decimals(usize)"
new = ""
note = "Removed: a typed number keeps its digits."

[[setter]]
type = "NumberField"
old = "unit(Unit)"
new = "unit(impl Into<Label>)"
note = "The text shown after the number. The spellings typed text may carry are `Reader::unit(spelling, factor)` on the codec."

[[setter]]
type = "NumberField"
old = "unit_kind(UnitKind)"
new = ""
note = "Removed: units are the codec's."

[[setter]]
type = "NumberField"
old = "or_parse(Fn)"
new = "codec(..)"
note = "Reading is the codec's."

[[setter]]
type = "NumberField"
old = "expressions(bool)"
new = ""
note = "Removed: the reader always takes expressions on commit."

[[setter]]
type = "NumberField"
old = "steps_with(Fn)"
new = ""
note = "Removed: a step is a multiple of `step`."

[[setter]]
type = "NumberField"
old = "scrub_wrap(bool)"
new = ""
note = "Removed: a label scrub warps the pointer at the window edge where the platform can."

[[setter]]
type = "NumberField"
old = "scrub_label(text)"
new = ""
note = "Removed: the scrub grip is the field's side label."

[[setter]]
type = "NumberField"
old = "scrub_icon(Icon)"
new = ""
note = "Removed: the scrub grip is the field's side label."

[[setter]]
type = "NumberField"
old = "scrub_by(&Response)"
new = "scrub_by_label()"
note = "A drag on the side label scrubs."

[[setter]]
type = "NumberField"
old = "scrub_text(bool)"
new = ""
note = "Removed: text drags select; only the label scrubs."

[[setter]]
type = "NumberField"
old = "scrub_rate(f64)"
new = "step(f64)"
note = "One point of label drag moves one step; Alt a tenth."

[[setter]]
type = "NumberField"
old = "popup_slider(name)"
new = "popup_slider(RangeInclusive<f64>)"
note = "The slider runs over the given range and steps by `step`."

[[setter]]
type = "NumberField"
old = "mixed(bool)"
new = "Bind::bound_mixed(..)"

[[setter]]
type = "NumberField"
old = "policy(EditPolicy)"
new = ""
note = "Removed: the edit policy is the pipeline's."

[[setter]]
type = "NumberField"
old = "size(ControlSize)"
new = "size(ControlSize)"
note = "The `Props::size` setter."

[[setter]]
type = "NumberField"
old = "enabled(bool)"
new = "enabled(bool)"
note = "The `Props::enabled` setter."

[[setter]]
type = "NumberField"
old = "invalid(bool)"
new = "Bind::check(..)"

[[setter]]
type = "NumberField"
old = "max_chars(usize)"
new = ""
note = "Removed."

[[setter]]
type = "NumberField"
old = "keep_focus(bool)"
new = ""
note = "Removed: Enter submits and the focus stays."

[[setter]]
type = "NumberField"
old = "edit_menu(bool)"
new = ""
note = "Removed: the edit menu is the text part's."

[[setter]]
type = "NumberField"
old = "unit_menu(entries, picked)"
new = ""
note = "Removed: a unit choice is a `Select` beside the field."

[[setter]]
type = "NumberField"
old = "presets(&[(String, f64)])"
new = "presets(&[Preset])"

[[setter]]
type = "NumberField"
old = "preset_rows(labels, picked)"
new = "presets(&[Preset])"
note = "Rows are `Preset::choice(..)`; the pick is `NumberOutput::preset`."

[[setter]]
type = "NumberField"
old = "preset_list(rows, picked)"
new = "presets(&[Preset])"
note = "The pick of a choice row is `NumberOutput::preset`."

[[setter]]
type = "NumberField"
old = "part(bool)"
new = ""
note = "Removed: a composite shows the field as a child."
