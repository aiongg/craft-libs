# API map of the "Text and number fields" family: old path to new path and setter renames.
# Filled in by the family track; the codemods and the app scan read it.

family = "Text and number fields"
new_module = "craft_ui::text"

# One entry per public type: `old` is the path an app calls today, `new` the path after migration.
# `status` is "pending", "same" (path unchanged), "moved", "replaced" (use `note`) or "removed".

[[type]]
name = "TextField"
old = "craft_ui::controls::text_field::TextField"
new = "craft_ui::text::TextField"
status = "pending"

[[type]]
name = "SearchField"
old = "craft_ui::controls::text_field::SearchField"
new = "craft_ui::text::SearchField"
status = "pending"

[[type]]
name = "AltTextField"
old = "craft_ui::controls::alt_text::AltTextField"
new = "craft_ui::text::AltTextField"
status = "pending"

[[type]]
name = "NumberField"
old = ""
# found in: craft_ui::controls::number_field::NumberField, craft_ui::localized::NumberField
new = "craft_ui::text::NumberField"
status = "pending"

[[type]]
name = "ChipField"
old = "craft_ui::controls::chips::ChipField"
new = "craft_ui::text::ChipField"
status = "pending"

[[type]]
name = "LinkedFields"
old = "craft_ui::controls::linked::LinkedFields"
new = "craft_ui::text::LinkedFields"
status = "moved"
note = "A `Component` over one `Bind<[Option<f64>; N]>` and a link `Bind<bool>`; the output is `LinkedOutput` (the values' `EditResponse` and the link's event). Captions are `.captions([..])`, ranges `.range(..)` and `.ranges([..])`, the link kind `.mode(LinkMode)`, the arrangement `.layout(LinkedLayout)`. Decimals and units are the `NumberField` codec's. `show_cells` and `LinkedSlot` are gone: place the fields yourself with `NumberField` and `link_toggle`."

[[type]]
name = "ApplyRow"
old = "craft_ui::controls::mixed::ApplyRow"
new = "craft_ui::text::ApplyRow"
status = "moved"
note = "A container: `ApplyRow::new(label, Bind<bool>).show(ui, |ui, _| field)`. The check box is in the header and the body is enabled while `apply` is on. The field binds a `Mixed<T>` itself."

[[type]]
name = "LinkMode"
old = "craft_ui::controls::linked::LinkMode"
new = "craft_ui::text::LinkMode"
status = "moved"

[[type]]
name = "LinkedLayout"
old = "craft_ui::controls::linked::LinkedLayout"
new = "craft_ui::text::LinkedLayout"
status = "moved"

[[type]]
name = "LinkedSlot"
old = "craft_ui::controls::linked::LinkedSlot"
new = ""
status = "removed"
note = "`show_cells` is gone; a host that lays the fields out itself shows `NumberField`s and `link_toggle`."

[[type]]
name = "LinkedFieldsLabels"
old = "craft_ui::controls::linked::LinkedFieldsLabels"
new = "craft_ui::text::LinkedWords"
status = "replaced"
note = "The words of the link toggle are `LinkedWords`, read from the installed words; `LinkMode::label(&words)` picks one."

[[type]]
name = "LinkButton"
old = "craft_ui::controls::linked::LinkButton"
new = ""
status = "replaced"
note = "`craft_ui::text::link_toggle(mode.label(&words), Bind<bool>)`, a `ToggleButton` face."

[[type]]
name = "MixedValue"
old = "craft_ui::controls::mixed::MixedValue"
new = ""
status = "replaced"
note = "`craft_behavior::Mixed`: `Mixed::Same(v)` or `Mixed::Mixed`; a field binds it with `Bind::given` or `Bind::bound_mixed`."

[[type]]
name = "ApplyValue"
old = "craft_ui::controls::mixed::ApplyValue"
new = ""
status = "replaced"
note = "A `Mixed<T>` for the value and a `bool` for apply: `ApplyRow` binds the bool, the field binds the `Mixed<T>`."

# One entry per renamed, removed or reshaped setter or constructor.
# [[setter]]
# type = ""
# old = ""
# new = ""

[[setter]]
type = "LinkedFields"
old = "LinkedFields::new(id_salt, captions, values, &mut linked, mode, &numbers)"
new = "LinkedFields::new(label, Bind::bound(&mut values), Bind::bound(&mut linked)).captions(captions).mode(mode)"

[[setter]]
type = "LinkedFields"
old = "units(&ExprUnits)"
new = ""
note = "The units and decimals are the number codec's."

[[setter]]
type = "LinkedFields"
old = "decimals(RangeInclusive<usize>)"
new = ""
note = "The units and decimals are the number codec's."

[[setter]]
type = "LinkedFields"
old = "captions_as_names()"
new = ""
note = "Without `.captions(..)` no caption is shown and each field is named from the group's label."

[[setter]]
type = "LinkedFields"
old = "size(ControlSize)"
new = ""
note = "The size is the scope's `ControlSize`."

[[setter]]
type = "LinkedFields"
old = "labels(LinkedFieldsLabels)"
new = ""
note = "Words come from the installed `LinkedWords`."

[[setter]]
type = "ApplyRow"
old = "ApplyRow::new(id_salt, label, &mut apply_value).show(ui, |ui, value| ..)"
new = "ApplyRow::new(label, Bind::bound(&mut apply)).show(ui, |ui, _| ..)"
note = "The row no longer owns the value: the field in the body binds its own `Mixed<T>`."

[[setter]]
type = "ApplyRow"
old = "labels(ApplyRowLabels)"
new = ""
note = "The mixed text is the field's placeholder."
