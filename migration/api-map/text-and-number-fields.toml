# API map of the "Text and number fields" family: old path to new path and setter renames.
# Filled in by the family track; the codemods and the app scan read it.

family = "Text and number fields"
new_module = "craft_ui::text"

# One entry per public type: `old` is the path an app calls today, `new` the path after migration.
# `status` is "pending", "same" (path unchanged), "moved", "replaced" (use `note`) or "removed".

[[type]]
name = "TextField"
old = "craft_ui::controls::text_field::TextField"
new = "craft_ui::text::TextField"
status = "moved"
note = "Generic over a `Codec` (`TextField::with_codec`); `TextField::new(label, Bind<String>)` is the plain field. The value is a `Bind`, not `&str`; the id salt is `.id_salt(..)`."

[[type]]
name = "SearchField"
old = "craft_ui::controls::text_field::SearchField"
new = ""
status = "replaced"
note = "`TextField::search(label, Bind<String>)`: a leading search glyph, a clear part while there is text, Escape clears first. The clear button's name is the library word `text.clear`, not an argument."

[[type]]
name = "TextFieldOutput"
old = "craft_ui::controls::text_field::TextFieldOutput"
new = ""
status = "replaced"
note = "`TextField` shows to `EditResponse<String>`: `submitted`, `escaped` and the edit events are fields of it."

[[type]]
name = "TextFieldStyle"
old = "craft_ui::controls::text_field::TextFieldStyle"
new = ""
status = "replaced"
note = "Read-only style struct; the field look is `craft_ui::text::FieldStyle`, resolved from the tokens. A field's look is a custom variant."

[[type]]
name = "field_box"
old = "craft_ui::controls::text_field::field_box"
new = ""
status = "removed"
note = "The box is the component's surface; a widget that wants a field look shows a `TextField` or reuses `FieldStyle`."

[[type]]
name = "AltTextField"
old = "craft_ui::controls::alt_text::AltTextField"
new = "craft_ui::text::AltTextField"
status = "pending"

[[type]]
name = "NumberField"
old = ""
# found in: craft_ui::controls::number_field::NumberField, craft_ui::localized::NumberField
new = "craft_ui::text::NumberField"
status = "pending"

[[type]]
name = "ChipField"
old = "craft_ui::controls::chips::ChipField"
new = "craft_ui::text::ChipField"
status = "pending"

[[type]]
name = "LinkedFields"
old = "craft_ui::controls::linked::LinkedFields"
new = "craft_ui::text::LinkedFields"
status = "pending"

[[type]]
name = "ApplyRow"
old = "craft_ui::controls::mixed::ApplyRow"
new = "craft_ui::text::ApplyRow"
status = "pending"

