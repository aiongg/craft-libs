[package]
name = "codemod-v4"
description = "A tool: rewrites a crate's sources from the egui-backed contract API to craft-ui (contract-rt.md section 15.11, rules 1-24), by byte spans so formatting and comments stay"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "codemod-v4"
path = "src/main.rs"

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
